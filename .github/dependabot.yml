# Dependabot version updates. Security updates follow the same rules once
# Dependabot alerts are on in the repository settings.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# One entry per ecosystem and directory (#145): the server's uv project lives in
# /server; workflows and git hooks are repo-wide. The extension gets an npm entry
# for /extension with its first package.json, since Dependabot fails on a
# directory that has no manifest.
#
# Every ecosystem runs weekly. Minor and patch bumps are grouped into one PR per
# ecosystem; a major bump gets its own PR, because it may need code changes.
version: 2
updates:
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      pre-commit-hooks:
        patterns: ["*"]
