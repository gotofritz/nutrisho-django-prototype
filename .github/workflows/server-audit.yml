name: Server audit

# Checks the server's locked Python dependencies against known advisories.
# Runs weekly as well as on changes, so a new advisory against an unchanged
# lockfile still turns the build red. Extension-only changes skip it (#145).
on:
  push:
    branches: ["main"]
    paths-ignore: ["extension/**"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["extension/**"]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Audit dependencies
        run: make audit
