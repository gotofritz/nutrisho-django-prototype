name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Read-only token by default; only the badge and release jobs widen it.
permissions:
  contents: read

# A newer push to a PR cancels the run it supersedes. On main every commit
# finishes, so each one gets a result and badge deploys never overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to commit SHAs; Dependabot updates the SHA and the
# version comment together.
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # `make qa` is Python-only, so the Tailwind build is checked here.
      - name: Build CSS
        run: make css

      - name: Run QA
        run: make qa

      - name: Build coverage badge
        if: success() && github.event_name == 'push'
        run: make coverage-badge

      - name: Upload coverage badge
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: badge-out/coverage.json
          if-no-files-found: error

  # Browser smoke tests (#63): Chromium drives the app through pytest-playwright.
  # The browser is the one the locked Playwright release pins.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Headless runs use the shell build alone.
      - name: Install Chromium
        run: uv run playwright install --only-shell chromium

      # `make e2e` installs the Node dependencies and builds the CSS first.
      - name: Run browser tests
        run: make e2e ARGS="--screenshot only-on-failure"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

  # Runs no code of its own: it only publishes the JSON the qa job wrote.
  badge:
    needs: qa
    if: needs.qa.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download coverage badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: badge-out

      - name: Deploy coverage badge
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badge-out
          publish_branch: badges
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # Runs no project code: when a push to main carries a version that has no
  # release yet, it tags that commit v<version> and publishes the version's
  # CHANGELOG.md section as the release notes. `make release` starts the PR.
  release:
    needs: qa
    if: needs.qa.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[project\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' pyproject.toml)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          awk -v tag="$tag" '$1 == "##" && $2 == tag { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $tag" >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
