name: Extension

# The recipe clipper under extension/ (#162). Its checks run for changes to
# extension/, this workflow and the script that gates it, the Makefile, the
# git hooks, the server's API examples, which the extension's tests read, and
# the site's stylesheet, fonts and plate, which the clipper copies (M12).
# The `changes` job decides, rather than a path filter here, so the workflow
# always reports and its checks can be required.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to commit SHAs; Dependabot updates the SHA and the
# version comment together.
jobs:
  # Decides whether the checks below run; see .github/scripts/touches.sh.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      extension: ${{ steps.diff.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does it touch the extension?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/touches.sh extension '^(extension/|\.github/workflows/extension\.yml$|\.github/scripts/|Makefile$|\.pre-commit-config\.yaml$|server/tests/api_examples/|server/src/recipes/static/(css/style\.css$|fonts/|img/plate-lineout\.webp$))' >> "$GITHUB_OUTPUT"

  ext-qa:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version is packageManager in extension/package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extension/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extension/.nvmrc
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        run: make ext-install

      - name: Run QA
        run: make ext-qa

      # The release job below takes these, so it runs no project code itself.
      - name: Zip for a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make ext-zip

      - name: Keep the zips
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: extension/.output/*.zip
          # .output/ is hidden, and is left out unless this says otherwise.
          include-hidden-files: true
          if-no-files-found: error

  # Runs no project code: when a push to main carries an extension version
  # that has no release yet, it tags that commit ext-v<version>, publishes
  # the version's extension/CHANGELOG.md section as the notes, and attaches
  # the zips the checks built. `make ext-release` starts the PR. Not marked
  # latest, so the server's releases stay the repository's latest (M15).
  ext-release:
    needs: ext-qa
    if: needs.ext-qa.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: zips

      - name: Publish a new version
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version extension/package.json)
          tag="ext-v$version"
          if [ "$version" = "0.0.0" ]; then
            echo "The extension has not been released yet"
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          awk -v tag="$tag" '$1 == "##" && $2 == tag { found = 1; next } found && /^## / { exit } found' \
            extension/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "extension/CHANGELOG.md has no section for $tag" >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest=false zips/*.zip
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Has AMO sign the Firefox zip the checks built, as an unlisted add-on
  # (D22), attaches the signed .xpi to the release just made, and points
  # Firefox's update check at it. Runs in the store-publishing environment,
  # whose required reviewer lets it start and whose secrets hold the AMO
  # keys (#145). Runs no project code: web-ext comes from npm, at the
  # version package.json pins, with no install of ours.
  ext-sign:
    needs: ext-release
    if: needs.ext-release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: store-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extension/.nvmrc

      - name: Take the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: zips

      - name: Have AMO sign the Firefox build
        env:
          TAG: ${{ needs.ext-release.outputs.tag }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_API_KEY and AMO_API_SECRET must be secrets of the store-publishing environment"
            exit 1
          fi
          version="${TAG#ext-v}"
          unzip -q "zips/nutrisho-clipper-$version-firefox.zip" -d firefox
          npx --yes web-ext@10.8.0 sign --source-dir firefox --artifacts-dir signed \
            --channel unlisted --upload-source-code "zips/nutrisho-clipper-$version-sources.zip"
          mv signed/*.xpi "nutrisho-clipper-$version-firefox.xpi"

      - name: Attach it to the release, and name it for Firefox's update check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ext-release.outputs.tag }}
        run: |
          version="${TAG#ext-v}"
          xpi="nutrisho-clipper-$version-firefox.xpi"
          gh release upload "$TAG" "$xpi" --repo "$GITHUB_REPOSITORY"
          mkdir updates
          jq -n --arg id "nutrisho-clipper@gotofritz.net" --arg version "$version" \
            --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$xpi" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link}]}}}' \
            > updates/updates.json

      # The manifest's update_url reads this file from the ext-updates branch.
      - name: Publish the update manifest
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./updates
          publish_branch: ext-updates
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
