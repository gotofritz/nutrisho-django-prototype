name: PR title

# PRs are squash-merged, so the title becomes the commit subject on main.
# commit-msg hooks never see it, so this checks it against Conventional
# Commits, again whenever the title is edited.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # The title comes in through env, never spliced into the script.
      - name: Check the title with commitizen
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --directory server --locked --only-group dev cz check --message "$PR_TITLE"
