<div
  id="ingredient-count"
  class="column-header"
  {% if oob %}hx-swap-oob="true"{% endif %}
>
  {# How many rows the column shows; every request that re-renders it sends this back (#80). #}
  <input type="hidden" id="ingredient-limit" name="limit" value="{{ limit }}">
  <p class="column-count" data-announce>
    {{ found_count }} found / {{ selected_count }} selected
  </p>
  <label class="select-all" title="Select all / none">
    <input
      type="checkbox"
      id="select-all"
      {% if all_selected %}checked{% endif %}
      {# indeterminate has no HTML attribute; app.js sets the property from this on every swap. #}
      data-indeterminate="{{ some_selected|yesno:"true,false" }}"
      hx-get="{% url 'recipes:ingredient_manage_search' %}"
      hx-vals='{"toggle_all": "1"}'
      hx-target="#col-ingredients"
      hx-swap="outerHTML"
      hx-include=".ingredient-pick:checked, #ingredient-search, #unused-only, #plurals-only, #private-only, #ingredient-limit"
    >
  </label>
</div>
