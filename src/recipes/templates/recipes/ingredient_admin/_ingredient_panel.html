<form
  id="ingredient-panel-{{ ingredient.pk }}"
  class="ingredient-panel"
  hx-post="{% url 'recipes:ingredient_manage_save' ingredient.pk %}"
  hx-target="this"
  hx-swap="outerHTML"
  hx-include=".workspace-pick, #ingredient-search, #unused-only, #plurals-only, #private-only, #ingredient-limit"
>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="panel-save">Save</button>
  {% if saved %}<span class="panel-saved" data-announce>Saved</span>{% endif %}
</form>
