{% load recipe_filters %}
<div
  id="col-recipes"
  class="col-recipes"
  {% if oob %}hx-swap-oob="true"{% endif %}
>
  <p class="column-count" data-announce>{{ match_count }} matches / {{ selected_count }} selected</p>
  <ul class="recipe-rows">
    {% for recipe in recipes %}
    <li class="recipe-row">
      <button
        type="button"
        class="recipe-match"
        hx-get="{% url 'recipes:ingredient_manage_preview' recipe.pk %}"
        hx-target="#col-preview"
        hx-swap="outerHTML"
      >{{ recipe.recipe_name|safe_title_html }}</button>
    </li>
    {% endfor %}
  </ul>
</div>
