{% load recipe_filters %}
<p>Delete <strong>{{ recipe.recipe_name|safe_title_html }}</strong>? This cannot be undone.</p>
<button
  type="button"
  onclick="document.getElementById('delete-panel').innerHTML=''"
>Cancel</button>
<button
  hx-post="{% url 'recipes:delete' recipe.id %}"
>Confirm delete</button>
