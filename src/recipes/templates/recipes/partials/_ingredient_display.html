{% load recipe_filters %}
{% comment %}
An ingredient row. Read mode (#58) shows the line alone; edit mode makes it a
button that opens its editor (#60), with the row's tick box and move buttons.
{% endcomment %}
{% if reading %}
<div id="iir-{{ iir.id }}" class="ingredient-in-group-show">
  <span class="ingredient-content">{% include "./_ingredient_text.html" %}</span>
</div>
{% else %}
<div id="iir-{{ iir.id }}" class="ingredient-in-group-show editable-row">
  <button
    type="button"
    class="editable ingredient-content"
    hx-get="{% url 'recipes:ingredient_edit' recipe.id iir.id %}"
    hx-target="closest div.ingredient-in-group-show"
    hx-swap="outerHTML"
  >{% include "./_ingredient_text.html" %}</button>
  <span class="ingredient-check">
    <input type="checkbox" class="ingredient-select" name="ingredient_ids" value="{{ iir.id }}" aria-label="Select {{ iir|display_ingredient_name|default:"ingredient" }}">
  </span>
  <span class="move-btns">
    <button
      id="iir-{{ iir.id }}-up"
      aria-label="Move {{ iir|display_ingredient_name|default:"ingredient" }} up"
      hx-post="{% url 'recipes:ingredient_move_up' recipe.id iir.id %}"
      hx-target="#iir-list-{{ iir.ingredient_group.id }}"
      hx-swap="innerHTML"
    >↑</button>
    <button
      id="iir-{{ iir.id }}-down"
      aria-label="Move {{ iir|display_ingredient_name|default:"ingredient" }} down"
      hx-post="{% url 'recipes:ingredient_move_down' recipe.id iir.id %}"
      hx-target="#iir-list-{{ iir.ingredient_group.id }}"
      hx-swap="innerHTML"
    >↓</button>
  </span>
</div>
{% endif %}
