<li{% if step %} id="step-{{ step.id }}"{% endif %} class="is-editing">
  <form
    {% if step %}
    hx-post="{% url 'recipes:step_save' recipe.id step.id %}"
    {% else %}
    hx-post="{% url 'recipes:step_create' recipe.id %}"
    hx-on::config-request="event.detail.parameters.position = Array.prototype.indexOf.call(this.closest('ol').querySelectorAll(':scope > li'), this.closest('li'))"
    {% endif %}
    hx-swap="outerHTML"
    hx-target="closest li"
  >
    {% csrf_token %}
    {{ form.step_title }}
    {{ form.step_title.errors }}
    {{ form.step_text }}
    {{ form.step_text.errors }}
    {% if split_error %}<p class="form-error" role="alert">{{ split_error }}</p>{% endif %}
    <button type="submit">Save</button>
    {% if step %}
    <button
      type="button"
      hx-post="{% url 'recipes:step_split' recipe.id step.id %}"
      hx-on::config-request="var t = this.form.elements.step_text; event.detail.parameters.split_at = Array.from(t.value.slice(0, t.selectionStart)).length"
      hx-target="closest li"
      hx-swap="outerHTML"
      title="Split this step in two where the cursor is"
    >Split at cursor</button>
    <button
      type="button"
      hx-get="{% url 'recipes:step_display' recipe.id step.id %}"
      hx-target="closest li"
      hx-swap="outerHTML"
    >Cancel</button>
    <button
      type="button"
      hx-post="{% url 'recipes:step_delete' recipe.id step.id %}"
      hx-target="closest li"
      hx-swap="outerHTML"
    >Delete</button>
    {% else %}
    <button type="button" onclick="_cancelDraft(this, 'li')">Cancel</button>
    {% endif %}
  </form>
</li>
