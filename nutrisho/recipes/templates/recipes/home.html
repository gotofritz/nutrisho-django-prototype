{% extends "./base.html" %}

{% block title %}Recipes{% endblock %}

{% block content %}
{% if latest_recipe_list %}
<ul>
  {% for recipe in latest_recipe_list %}
  <li><a href="{% url 'recipes:recipe' recipe.id %}">{{ recipe.name }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>No recipes are available.</p>
{% endif %}
{% endblock %}
