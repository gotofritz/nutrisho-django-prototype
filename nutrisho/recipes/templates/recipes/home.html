{% extends "./base.html" %}

{% block title %}Recipes{% endblock %}

{% block content %}
{% if latest_recipe_list %}
<ul>
  {% for recipe in latest_recipe_list %}
  <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.recipe_name }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>No recipes are available.</p>
{% endif %}
{% endblock %}
