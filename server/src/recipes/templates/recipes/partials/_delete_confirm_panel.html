{% load recipe_filters %}
<p>Delete <strong>{{ recipe.recipe_name|safe_title_html }}</strong>? It goes to the trash, where you can restore it.</p>
<button
  type="button"
  data-close-panel="delete-panel"
  autofocus
>Cancel</button>
<button
  hx-post="{% url 'recipes:delete' recipe.id %}"
>Confirm delete</button>
