<div{% if group %} id="group-{{ group.id }}"{% endif %} class="is-editing">
  <form
    {% if group %}
    hx-post="{% url 'recipes:group_save' recipe.id group.id %}"
    {% else %}
    hx-post="{% url 'recipes:group_create' recipe.id %}"
    data-position-in="#groups-list"
    data-position-of=":scope > div:not(.reassign-panel)"
    data-position-row="div"
    {% endif %}
    hx-swap="outerHTML"
    hx-target="closest div"
  >
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    {% if group %}
    <button
      type="button"
      data-escape
      hx-get="{% url 'recipes:group_display' recipe.id group.id %}"
      hx-target="closest div"
      hx-swap="outerHTML"
    >Cancel</button>
    {% if recipe.ingredient_groups.count > 1 %}
    {% with doomed=group.items.count %}
    <button
      type="button"
      hx-post="{% url 'recipes:group_delete' recipe.id group.id %}"
      hx-target="closest .group-block"
      hx-swap="outerHTML"
      {% if doomed %}hx-confirm="Delete {% if group.group_name %}'{{ group.group_name|striptags }}'{% else %}this group{% endif %} and its {{ doomed }} ingredient{{ doomed|pluralize }}? To keep {{ doomed|pluralize:"it,them" }}, move {{ doomed|pluralize:"it,them" }} to another group first."{% endif %}
    >Delete</button>
    {% endwith %}
    {% endif %}
    {% else %}
    <button type="button" data-escape data-cancel-draft="div">Cancel</button>
    {% endif %}
  </form>
</div>
