{% load recipe_filters %}
<div id="cuisine-columns" class="columns">
  <div
    id="col-cuisines"
    class="col-cuisines"
    hx-get="{% url 'recipes:cuisine_manage_columns' %}"
    hx-trigger="change target:.cuisine-pick"
    hx-target="#cuisine-columns"
    hx-swap="outerHTML"
    hx-include=".cuisine-pick:checked, #cuisine-search, #cuisine-unused-only, #cuisine-sort"
  >
    <p class="column-count" data-announce>{{ rows|length }} cuisine{{ rows|length|pluralize }} / {{ selected_count }} selected</p>
    <ul class="cuisine-rows">
      {% for row in rows %}
      <li class="cuisine-row cuisine-depth-{{ row.depth }}">
        <label>
          <input
            type="checkbox"
            id="cuisine-pick-{{ row.cuisine.pk }}"
            class="cuisine-pick"
            name="cuisine_ids"
            value="{{ row.cuisine.pk }}"
            {% if row.cuisine.pk in selected_ids %}checked{% endif %}
          >
          <span class="cuisine-path">{{ row.path }}</span>
          {% if row.recipe_count %}<span class="cuisine-recipe-count">({{ row.recipe_count }})</span>{% endif %}
        </label>
      </li>
      {% endfor %}
    </ul>
  </div>
  <div
    id="col-cuisine-recipes"
    class="col-recipes"
  >
    <p class="column-count" data-announce>{{ recipes|length }} of your recipes</p>
    <ul class="recipe-rows">
      {% for recipe in recipes %}
      <li class="recipe-row">
        <a class="recipe-match" href="{% url 'recipes:recipe' recipe.pk %}">{{ recipe.recipe_name|safe_title_html }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
