<div id="cuisine-columns" class="columns workspace">
  {% include "./_selection.html" %}
  <form
    {% if node %}hx-post="{% url 'recipes:cuisine_manage_save' node.pk %}"{% else %}hx-post="{% url 'recipes:cuisine_manage_add' %}"{% endif %}
    hx-target="#cuisine-columns"
    hx-swap="outerHTML"
    hx-include=".workspace-pick, #cuisine-search, #cuisine-unused-only, #cuisine-sort"
  >
    {% csrf_token %}
    <p class="cuisine-form-intro">
      {% if node %}Rename or move <strong>{{ node.path }}</strong>.{% else %}Add a cuisine.{% endif %}
      Cuisines go at most three deep: area, region, subregion.
    </p>
    {{ form.as_p }}
    <button type="submit" class="panel-save">{% if node %}Save{% else %}Add{% endif %}</button>
    {% include "./_cancel.html" %}
  </form>
</div>
