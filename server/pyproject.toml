[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "commitizen>=4.16.2",
  "django-debug-toolbar>=8.0.0",
  "pre-commit>=4.6.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-django>=4.10.0",
  "pytest-playwright>=0.10.0",
  "ruff>=0.14.10",
  "ty>=0.0.9"
]

[project]
name = "nutrisho"
version = "0.3.0"
description = "A multi-user recipe manager: server-rendered Django with HTMX"
authors = [{ name = "fritz", email = "gotofritz@users.noreply.github.com" }]
license = "0BSD"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django ~=6.1",
  "django-environ>=0.13.0",
  "django-htmx>=1.27.0",
  "sentry-sdk>=2.0"
]

# Releases: `make release` runs `cz bump`; see docs/developer-guide.md. The
# server and the extension release separately, so server tags carry a prefix;
# v0.3.0 predates it (#145).
[tool.commitizen]
changelog_incremental = true
ignored_tag_formats = ["ext-v*"]
legacy_tag_formats = ["v$version"]
major_version_zero = true
name = "cz_customize"
tag_format = "server-v$version"
update_changelog_on_bump = true
version_provider = "uv"
version_scheme = "semver2"

# Conventional Commits, as cz_conventional_commits reads them, less those
# scoped `ext`: the extension counts those for its own releases
# (extension/.cz.toml), and the default plugin cannot leave them out.
[tool.commitizen.customize]
bump_pattern = '^((BREAKING[\-\ ]CHANGE|\w+)(\((?!ext\))[^()]+\))?!?):'
changelog_pattern = '^((BREAKING[\-\ ]CHANGE|\w+)(\((?!ext\))[^()]+\))?!?):'
commit_parser = '^((?P<change_type>feat|fix|refactor|perf|BREAKING CHANGE)(?:\((?P<scope>(?!ext\))[^()\r\n]*)\)|\()?(?P<breaking>!)?|\w+!):\s(?P<message>.*)?'
schema = "<type>(<scope>): <subject>"
schema_pattern = '(?s)(build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'

[tool.commitizen.customize.change_type_map]
feat = "Feat"
fix = "Fix"
perf = "Perf"
refactor = "Refactor"

[tool.coverage.run]
branch = true
omit = [
  "*/migrations/*",
  "*/settings*.py",
  "*/asgi.py",
  "*/wsgi.py",
  "*/manage.py"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nutrisho", "src/recipes"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nutrisho.settings.test"
# Browser tests (`e2e`) need Chromium and the built CSS, so the default run skips
# them; `make e2e` runs them alone.
addopts = ["--fail-on-template-vars", "-m", "not e2e"]
markers = ["e2e: drives the app in Chromium through pytest-playwright (`make e2e`)"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
