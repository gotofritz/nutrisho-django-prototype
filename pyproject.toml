[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrisho"
version = "0.2.0"
description = "Quick and dirty django prototype"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = "0BSD"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django ~=6.0.0",
    "PyYAML ~=6.0",
    "django-debug-toolbar ~=6.1",
    "google-genai~=1.56",
]

[project.optional-dependencies]
dev = [
    "black~=24.4",
]

