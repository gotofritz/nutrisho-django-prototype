[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrisho"
version = "0.2.0"
description = "Quick and dirty django prototype"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = "0BSD"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django >=4.0.3",
    "PyYAML >=6.0.1",
    "django-debug-toolbar >=3.2.4",
]

[project.optional-dependencies]
dev = [
    "black>=22.1.0",
]

