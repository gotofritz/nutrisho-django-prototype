[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "commitizen>=4.16.2",
  "faker>=37.0.0",
  "polyfactory>=2.21.0",
  "pre-commit>=4.6.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-django>=4.10.0",
  "ruff>=0.14.10",
  "ty>=0.0.9"
]

[project]
name = "nutrisho"
version = "0.2.0"
description = "Quick and dirty django prototype"
authors = [{name = "Your Name", email = "you@example.com"}]
license = "0BSD"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django ~=6.0.0",
  "PyYAML ~=6.0",
  "django-debug-toolbar ~=6.1",
  "django-environ>=0.13.0",
  "google-genai~=1.56",
  "xmltodict"
]

[tool.coverage.run]
omit = [
  "*/migrations/*",
  "*/settings*.py",
  "*/asgi.py",
  "*/wsgi.py",
  "*/manage.py"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nutrisho", "src/recipes"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nutrisho.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
# This only has an effect when the `docstring-code-format` setting is
# enabled.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  "docs"
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

[tool.ruff.lint]
select = [
  # Enable a subset of the pycodestyle (`E`) codes
  "E4",
  "E7",
  "E9",
  # Enable Pyflakes
  "F",
  # Enable Isort
  "I",
  # Enable Airtable
  "AIR",
  # Enable FastAPI
  "FAST",
  # Enable flake8-print
  "T20",
  # Enforce : dict | None annotation instead of Optional[Dict]
  "UP006",
  "UP007"
]
ignore = []
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Settings modules intentionally call read_env() before importing base
# so .env is loaded into os.environ before base.py reads it at import time.
"src/nutrisho/settings/*.py" = ["E402"]
