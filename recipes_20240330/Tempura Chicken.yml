cuisine: .asia.japan
description: Japanese staple
directions:
  step:
    - Cut chicken in pieces roughly the size of a ping pong ball
    - Put all the Marinade ingredients in the small food processor and whiz
    - Remove blade, add the chicken pieces and coat meat with marinade. Tip into bowl
    - Let it rest 30 mins to overnight in the fridge. Remove from fridge 30 m before using
    - Heat oil to 170° - 190°C
    - Beat egg in a bowl, then add water
    - Mix Dry Batter ingredients, and sieve into bowl with egg
    - Coat chicken pieces with batter
    - When oil is hot enough deep fry in batches, roughly 2m per batch
    - The Japanese serve it with Ponzu (soy sauce + vinegar) and mustard, with a side of fresh cabbage salad

