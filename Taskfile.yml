version: "3"

vars:
  ALL: src/ tests/
  VENV: .venv/bin
  SOURCES: src/

tasks:
  venv:
    desc: "Activate the virtual environment (use 'source .venv/bin/activate' manually or 'uv run ...')"
    cmds:
      - echo "Virtual environment tasks use {{.VENV}}/python. For interactive shell, run 'source .venv/bin/activate' manually."

  run:
    cmd: "{{.VENV}}/python manage.py runserver"

  migrate:
    cmd: "{{.VENV}}/python manage.py migrate"

  clean:
    desc: "Clean up database and migration files"
    cmds:
      - rm ./db.sqlite3 || true
      - rm src/recipes/migrations/0* || true

  filldb:
    desc: "Fill database with initial data"
    deps:
      - clean
    cmds:
      - "{{.VENV}}/python manage.py makemigrations"
      - "{{.VENV}}/python manage.py migrate"
      - "{{.VENV}}/python manage.py addinitialuser"
      - "{{.VENV}}/python manage.py batch_load_yaml_recipes recipes_yaml/"

  createsuperuser:
    desc: "Create a superuser"
    cmds:
      - DJANGO_SUPERUSER_PASSWORD=fritz {{.VENV}}/python manage.py createsuperuser --noinput --username fritz --email fritzthecat@gmail.com

  lint-fix:
    desc: "Fix linting issues"
    cmds:
      - uv run python -m ruff check --fix {{.SOURCES}}
      - uv run python -m ruff format {{.SOURCES}}

  lint:
    desc: "Run ruff (non-mutating)"
    cmds:
      - uv run python -m ruff check {{.SOURCES}}
      - uv run python -m ruff format --check {{.SOURCES}}

  # Task to open the latest coverage report in a web browser
  coverage:
    desc: "Open the latest coverage report in a web browser"
    cmds:
      - open htmlcov/index.html

  # Task to run ty for static type checking on the source code
  typecheck:
    desc: "Run ty for static type checking"
    cmds:
      - "{{.VENV}}/ty check src"

  # Task to run linting, type checking, and tests (sequential for deterministic validation)
  qa:
    desc: "Run linting, type checking, and tests"
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  # Task to run tests using pytest with coverage reporting
  test:
    desc: "Run tests with coverage"
    cmds:
      - uv run pytest -vv -s --cov=src --cov-report=html:htmlcov --cov-fail-under=40 {{.CLI_ARGS}}
