version: "3"

vars:
  ALL: src/ tests/
  VENV: .venv/bin
  SOURCES: src/

tasks:
  venv:
    desc: "Activate the virtual environment (use 'source .venv/bin/activate' manually or 'uv run ...')"
    cmds:
      - echo "Virtual environment tasks use {{.VENV}}/python. For interactive shell, run 'source .venv/bin/activate' manually."

  run:
    env:
      DJANGO_SETTINGS_MODULE: nutrisho.settings.dev
    cmd: "{{.VENV}}/python manage.py runserver"

  migrate:
    env:
      DJANGO_SETTINGS_MODULE: nutrisho.settings.dev
    cmd: "{{.VENV}}/python manage.py migrate"

  clean:
    desc: "Clean up database and migration files"
    cmds:
      - rm ./db.sqlite3 || true
      - rm src/recipes/migrations/0* || true

  filldb:
    desc: "Fill database with initial data"
    deps:
      - clean
    env:
      DJANGO_SETTINGS_MODULE: nutrisho.settings.dev
    cmds:
      - "{{.VENV}}/python manage.py makemigrations"
      - "{{.VENV}}/python manage.py migrate"
      - "{{.VENV}}/python manage.py addinitialuser"
      - "{{.VENV}}/python manage.py batch_load_yaml_recipes recipes_yaml/"

  createsuperuser:
    desc: "Create a superuser"
    env:
      DJANGO_SETTINGS_MODULE: nutrisho.settings.dev
    cmds:
      - DJANGO_SUPERUSER_PASSWORD=fritz {{.VENV}}/python manage.py createsuperuser --noinput --username fritz --email fritzthecat@gmail.com

  node-install:
    desc: "Install Node dependencies via pnpm"
    cmds:
      - pnpm install

  css:
    desc: "Build Tailwind CSS (minified)"
    deps:
      - node-install
    cmds:
      - pnpm run css

  css-watch:
    desc: "Watch and rebuild Tailwind CSS on changes"
    deps:
      - node-install
    cmds:
      - pnpm run css:watch

  lint-fix:
    desc: "Fix linting issues"
    cmds:
      - uv run python -m ruff check --fix {{.ALL}}
      - uv run python -m ruff format {{.ALL}}

  lint:
    desc: "Run ruff (non-mutating)"
    cmds:
      - uv run python -m ruff check {{.ALL}}
      - uv run python -m ruff format --check {{.ALL}}

  # Task to open the latest coverage report in a web browser
  coverage:
    desc: "Open the latest coverage report in a web browser"
    cmds:
      - open htmlcov/index.html

  # Task to run ty for static type checking on the source code
  typecheck:
    desc: "Run ty for static type checking"
    cmds:
      - "{{.VENV}}/ty check src tests"

  # Shell hook regression tests (portability checks for caveman grep patterns)
  test-hooks:
    desc: "Run shell regression tests for .claude/hooks"
    cmds:
      - bash .claude/hooks/test-caveman-patterns.sh

  # Task to run linting, type checking, tests, and hook regressions (sequential)
  qa:
    desc: "Run linting, type checking, tests, and hook regressions"
    cmds:
      - task: css
      - task: lint
      - task: typecheck
      - task: test
      - task: test-hooks

  # Task to run tests using pytest with coverage reporting
  test:
    desc: "Run tests with coverage"
    env:
      DJANGO_SETTINGS_MODULE: nutrisho.settings.test
    cmds:
      - uv run pytest -vv -s --cov=src --cov-report=html:htmlcov --cov-fail-under=95 {{.CLI_ARGS}}
