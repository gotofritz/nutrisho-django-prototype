  step:
  - Sift self-rising flour, baking powder into large bowl
  - Mix together eggs, butter, sugar, vanilla estract well with a wooden spoon. It
    should be runny, if not add some water
  - "Split into two baking tins and bake for 30-35 mins at 170\xB0. Don't open before\
    \ at least 30 mins. Let cool for 5 mins before turning on wire racks"
  - 'Mix together all the filling ingredients: passion fruits, mascarpone, fromage
    frais, sugar, vanilla extract'
  - Spread the filling on top of one of the cakes and put the other on top. Sprinkle
    icing sugar over the top
