cuisine: eu.france
description: A quick hollandaise sauce made with an immersion blender for smooth emulsification.
directions:
  step:
  - Combine egg yolks, water, lemon juice, and salt in a cup just wide enough for
    an immersion blender
  - Melt butter over high heat until foaming stops, then transfer to a measuring cup
  - With the blender running at the bottom of the cup, slowly stream in hot butter
    until emulsified and thick
  - Adjust texture with warm water if too thick
  - Season with salt and cayenne or hot sauce
  - Serve immediately, or keep warm up to 1 hour. Do not cool and reheat.
