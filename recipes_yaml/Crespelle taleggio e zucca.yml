directions:
    step:
    - 'Crêpes: sieve flour into milk, trying to avoid lumps. Add the beaten eggs,
        pinch of salt, and melted butter. Mix and stand 2 hours'
    - Rub butter on flat pans, and cook crêpes in it. Lay over a table, next to each
        other
    - 'Filling: Chop onion and rosemary and sauté in a butter and oil mixture, 5 mins.
        Add diced pumpkin and cook diluting with water 20-30mins.'
    - 'Béchamelle: Melt the butter in another pot, remove from fire and sieve the
        flour in. Put back on fire and cook while mixing until browned.'
    - Slowly add the milk, while still mixing. When done, season with salt, pepper,
        and nutmeg. Set aside.
    - When the pumpkin is tender, mash it with a food processor and add to béchamelle
    - Spoon sauce over each crêpe, drop bits of walnuts and cheese cubes over sauce,
        and roll up.
    - Lay in a buttered baking tray, pour melted butter and grated parmesan over it,
        and bake 10 mins at 180°
