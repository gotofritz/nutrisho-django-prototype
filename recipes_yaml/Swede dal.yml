cuisine: .indian.fusion
description: An anglicized dal recipe
directions:
  step:
  - "Saut\xE8e onion in hot oil / butter mixture until it becomes translucent"
  - Add swede until it begins to brown a bit
  - Add garlic, give it a couple of minutes until you can smell it
  - Add ginger a few seconds, then lentils, water, cocount cream, cinnamon, bay leaf,
    coriander powder
  - Pressure cook for 20 mins
  - Open pressure cooker, remove from stove. Add salt and lemon juice, leave covered
    a few minutes
  - 'Seasoning: fry cumin and black mustard seeds, when they start sizziling add chilies.
    Add to dal and let rest a couple minutes'
  - Garnish with chopped coriander, toasted almond flakes
