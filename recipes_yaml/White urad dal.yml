directions:
  step:
  - Wash dal. If not using pressure cooker, soak 2 hours
  - Bring to boil with crushed chillies, ground coriander, turmeric
  - Meanwhile make a paste in mortar with garlic, ginger
  - Fry cumin in ghee, add onion, ginger paste, chillies, cook until onion go brown
  - Add onion paste to dal, season with salt and chopped coriander
