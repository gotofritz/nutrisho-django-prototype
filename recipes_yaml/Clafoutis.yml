cuisine: .french.classic
description: Classic French Cherry Dessert
directions:
  step:
  - Wash and rinse the cherries. In theory, they shouldn't be pitted.
  - Beat the egg as for an omlette, add a pinch of salt and then the sugar
  - Sift the flour over the mixture, mix until smooth
  - Melt the butter, let it cool a little, and add to the mixture. Thin with the milk.
  - Butter a baking dish, scatter the cheeries in it, and pour the mix over it. Sprinkle
    a few knob of butter on top
  - Bake 210° for 20 mins until it begins to brown
  - Sprinkle vanilla sugar and serve
