directions:
  step:
  - Boil cauliflower in salted water on high heat until al dente, 4m, then drain cool
    in cold water. Cut in small florets.
  - Start cooking the pasta, in the same water.
  - Fry the onion in olive on medium heat until wilted, 4m
  - Add pine nuts, and fry until slightly browned, 2m
  - Add the raisings and cauliflower and fry, 30s
  - Add saffron and lower heat. Keep on low simmer until pasta ready, adding water
    from pasta if it gets too dry
  - Heat some olive oil, add the anchovies (or blue cheese) and break with a fork
  - Add the bread crumbs, stirring.
  - When the pasta is ready drain, mix in the sauce, and sprinkle toasted breadcrums
    on it.
