cuisine: .chinese
description: Use available veg. The idea is that they are all the same size
directions:
    step:
    - soak dried mushrooms in hot water for 25m
    - remove stalks from mushrooms, boil them with the soaking water then set aside.
        keep water for 5m
    - stir fry carrots, broccoli, cauliflower for 20s
    - add mushroom water and cook covered until the water evaporates
    - add Asparagus, celery, zucchini, bak choi splashing water as needed for 30s
    - uncover and add 2 tbsp oil and mangetout, bamboo shots and stiry fry for 20s
    - add water, light soy sauce, sugar and mushrooms
    - dissolve cornstarch in water or stock and add
    - Finish off then season for 30s
