directions:
  step:
  - Lightly butter a rectangular loaf tin (20cm x 9cm x 7cm) then line the bottom
    with baking paper
  - Soft together flour, bicarbonate, baking powder, cinnamon
  - Beat the oil an sugar in a food processor until well creamed, then introduce the
    beaten egg yolks one by one, reserving the whites for later
  - Fold the beetroot into the mixture, then add lemon juice, raisins, seeds
  - Fold the flour and baking powder into the mixture
  - Beat the egg whites until almost stiff, and fold into the mix
  - "Pour the mixture into cake tin and bake for 50 - 55mins at 180\xB0. cover the\
    \ top with foil after 30 mins"
  - Mix the icing sugar with the liquid, brush over cake (it should dribble). Scatter
    with poppy seeds
