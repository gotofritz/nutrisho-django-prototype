directions:
  step:
  - 'MEATBALLS:'
  - Mix the breadcrumb with 2tbsp water and let stand for 10 mins
  - Mix the meat with lemon juice, most of the mint, egg, breadcrumb mixture. Season
    with salt and pepper.
  - 'For grown ups: dry roast spices then grind together with garlic and add mixture
    to meat'
  - Form into small meatballs, half of a 1/4 cup measuring spoon
  - Chill for a good 30 mins
  - 'SAUCE:'
  - Sauté the chopped onion in oil with sugarn, when caramelized add the olives and
    sauté some more.
  - Add tomatoes and seasonings and cook for 15 mins, mashing with a fork every so
    often
  - Quickly fry the meatballs on high heat to sear them, then drop them in the tomato
    sauce and cook for 10 mins
  - 'HARISSA:'
  - Dry roast spices, then let cool in mortar and grind
  - Sauté chopped veg until soft (not everyone uses pepper and onion), then blend.
    Store covered in oil in fridge
  - 'COUSCOUS:'
  - Mix the couscous with spring onions and mint, and pour over the hot stock mixed
    with harissa. Cover with a plate and stand for 5 mins.
  - Mix olive oil and lemon and serve
