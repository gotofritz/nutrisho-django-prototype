cuisine: .british
description: The caramelising of the honey in this soup gives it a great honeyed flavour
  without overpowering sweetness.
directions:
  '#text': '>







    >'
  step:
  - tie thyme, bay, cinnamon with a string
  - heat honey in large saucepan on medium heat until it bubbles and turns golden
  - add butter, parsnips and the bouquet garni low until parsnip is lightly browned,
    about 4m
  - add chicken stock, milk until until cooked, about 10 m
  - Remove bouquet garni and blend in a food processor until smooth.
  - Sieve, season, and crumble chestnuts over the top
