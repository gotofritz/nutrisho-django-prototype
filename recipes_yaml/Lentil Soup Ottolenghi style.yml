cuisine: .fusion.middle east
description: Serve with rice or roti
directions:
  step:
  - Soak lentils in water for 30 mins
  - Chop up the coriander stems, onions, ginger, garlic, and chilli coarsely in a
    food processor.
  - Put the mustard seeds in a pot on medium, when they begin to pop add oil and the
    onion mix.
  - Stir and cook for 10 mins on low heat
  - Add the spices and continue cooking for 5 mins, stirring
  - Add the lentil with their water, the wet ingredients, and season with salt. Simmer
    30 mins
  - Prepare the yoghurt garnish by mixing yogurt, olive oil, and cucumber in a bowl
  - Add the garnish ingredients to the soup, and a dollop of the yorgurt mix for each
    bowl
