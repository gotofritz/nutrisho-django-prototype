cuisine: .thai.quick
description: A generic thay curry
directions:
  step:
  - Heat the oil with a small amount of coconut milk mixed in, if using, then stir
    in the coconut paste
  - Add some soya sauce. For a non vegetarian curry also add sugar and fish sauce
  - Add the ingredients that need frying (potatoes, peppers, chichken, nuts) and sautè
    until scorched.
  - If using an egg, steam it over the rice
  - 'Add the rest of the coconut milk, and / or, the stock. Bear in mind: no coconut
    milk means a jungle curry, and these are hotter than those with coconut milk.'
  - Cook 10 mins to reduce the liquid
  - Meanwhile fry the meat, if using, in oil
  - Add the frozen veg, tofu, meat, if using, and cook another 5 mins
  - Add the eggt, if using, just before serving
