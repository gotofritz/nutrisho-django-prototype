directions:
  step:
  - Bring salted water to a boil in a large pot
  - Meanwhile in a skillet large enough to hold the completed pasta dish, sauté pancetta
    until crispy, then remove pan from heat
  - Cook pasta 2 mins less than package instructions.
  - Meanwhile, In a bowl, whisk egg yolks, cheese, and pepper to cookie-dough consistency
  - Stir a couple of spoonfuls of pasta water into eggs to temper it
  - Return bacon to medium-low heat. Add al dente pasta and drizzle water in spoonfuls,
    tossing until it's done.
  - Cook for 2-3 mins, then remove skillet from heat and add the egg mix.
  - Toss quickly to coat the pasta without scrambling the eggs
