directions:
  step:
  - Sprinkle the aubergines with salt and leave to drain for 30m, then wash and pat
    dry
  - dry roast cumin seeds, coriander seeds medium high for 1m
  - add to the dried chilies in a mortar, and grind until fine
  - Brush the aubergines with the olive oil and the spice mixture
  - Put under a grill 240° for 12m
  - mx together the yogurt, garlic, walnuts, coriander leaves, and drizzle over the
    warm aubergines
