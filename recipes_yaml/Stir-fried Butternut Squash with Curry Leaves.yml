directions:
    step:
    - Cut the squash in half lengthwise, peel it, and scrape out the seeds. Cut into
        bite-sized chunks.
    - Heat the oil in a large wok or frying pan over medium-high. Add ginger, and
        cook, stirring, for 1 minute. Add chilli, spices and curry leaves and cook
        for 1 minute. Add the squash, and stir until it is coated with the oil and
        spices. Season to taste with salt and sugar. Reduce heat to medium. Cover,
        and cook until squash is tender, about 25 minutes. You want the squash to
        caramelise slightly but be careful that the spices don't scorch and burn.
        Place in a serving dish, and squeeze the lime juice over. Sprinkle with sea
        salt and serve.
