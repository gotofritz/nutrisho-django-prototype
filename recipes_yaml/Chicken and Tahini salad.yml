cuisine: .chinese
description: Zhi Ma Jiang Ji. Served as a starter, suitable for pic nics
directions:
    step:
    - Boil chicken breast, 10-12 min. Take out and beat gently to separate the meat
        in shreds
    - Mix the tahini with the sugar, soy sauce, sesame seed oil. Add the cold water
    - Heat the oil, drop the chillies in, stir for 1 min, add to the sauce.
    - Mix the spring onions with the chicken, and dress. Serve warm or cold
