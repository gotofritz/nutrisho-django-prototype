cuisine: .italian
description: The breadcrumbs take center stage and hide the boring cauliflower taste.
directions:
    step:
    - Heat the stock, adding the cauliflower florets
    - Sauté the onion in a mixture of olive oil and butter for 5m
    - Stir in the rice until slightly toasted, about 2m
    - Sweat with white wine, then carry on the risotto as usual
    - After about 10 mins fish out the cauliflower florets from the stock and add
        them to the rice. Continue cooking the risotto breaking up the cauliflower
        bits as you stir it.
    - When the risotto is almost ready remove the pot from the fire, stir in the cheese
        or butter violently then cover the pot and leave to rest for a few minutes
        cheese
    - Mix together breadcrumbs, dried chilies for 20s
    - Sauté the anchovies filets, breaking them with a fork. in olive oil on high
        heat
    - Add the breadcrumb mixture, and stir until browned
    - Ladle the risotto on plates and sprinkle the breadcrumbs on top
