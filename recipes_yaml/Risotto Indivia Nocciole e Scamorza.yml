cuisine: null
description: A recipe from a Vercelli rice grower, done with brown risotto rice
directions:
  step:
  - Sautè the onion in butter. Add rice and stir for a few mins
  - Sweat with white wine
  - Add a couple of ladles of stock, salt, and stir in vigorously
  - Add the endive.
  - Carry on adding the stock one ladlef at the time, stirring in strongly, and letting
    it stand until absorbed
  - After 30 mins or so the risotto will be ready. It should be coocked through but
    still firm.
  - Turn off the heat, add the smoked cheese and parmesan, stirring vigorously, and
    let it stand covered for a few minutes.
  - Serve with the hazelnuts sprinkled over the top
