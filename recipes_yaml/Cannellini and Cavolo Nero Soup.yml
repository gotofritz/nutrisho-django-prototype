directions:
  step:
  - Soak the beans overnight, and cook 30 mins
  - "Saut\xE9 garlic and chili, then add the cooked beans"
  - Add the cavolo nero leaves
  - Slowly add in the stock, cook on low for 45 mins
  - Toast two slices of bread, rub garlic on them, and place them at the bottom of
    the bowls
  - Pour the soup over the bread
