cuisine: .spain.murcia
description: Patatas con Azafran. Great with fish, and a lemony alioli
directions:
    step:
    - Cook onion in abundant olive oil for 5 mins on medium, then another 10 on low
    - Add garlic and sweet paprika, bay and rosemary and cook another 5 mins
    - Put the potatoes wedges in a bowl, salt, and pour saffron water over it. Leave
        5 minutes
    - Add potates to the pan, pepper, and cook for 30 mins, occasionally scraping
        from bottom of the pan
