cuisine: .chinese.qinghai
description: Fengmi Niulijirou Hetaoren
directions:
  step:
  - Mix marinade ingredients and add meat
  - Deep fry for 2 min, then set aside
  - Deep fry the walnuts for 1 min, then set aside with beef
  - Mix the sauce ingredients in a bowl with salt
  - Remove oil, wipe wok, put 2 tbsp oil back in
  - Dook sauce mixture for 20 sec
  - Add meat and walnut
