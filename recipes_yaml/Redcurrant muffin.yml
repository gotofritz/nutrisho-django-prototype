directions:
  step:
  - Mix the sugar, egg yolks, oil, milk and lemon juice and zest together
  - Sieve the flour into it
  - Whisk the egg whites until stiff and fold into the cake mixture
  - Stir in the redcurrants
  - drop the mixture into greased bun or muffin tins
  - "Bake for 15-20 minutes at 180\xB0"
  - Cool on a wire rack, then dollop on a teaspoonful of creme fraiche and a few redcurrants
  - Dust the cakes with icing sugar before serving
