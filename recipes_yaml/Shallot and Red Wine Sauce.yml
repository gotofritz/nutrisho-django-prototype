cuisine: .french
description: Classic French steak sauce
directions:
  step:
    - "Saut\xE9 the shallots on high for 3 mins, stirring, and season."
    - Add garlic and rosemary, 3 more minutes
    - Pour in vinegar and cook until syrupy
    - Pour in wine until reduced by two thirds
    - Add stock and bring to boil, then lower heat and reduce by two thirds to around
      250 ml
    - Season, remove garlic and rosemary, and whisky in a knob of butter
    - Add steak juices before serving and pour over steak
