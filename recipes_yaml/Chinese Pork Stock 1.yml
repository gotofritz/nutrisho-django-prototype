cuisine: .chinese
description: Keeps for 3 days fresh, 2 months frozen
directions:
    step:
    - Blanch the pork by pouring boiling water over them to cover, bringing back to
        boil, then discarding the water
    - Cover pork again with cold water, bring to boil, skimming as it cooks.
    - Lower heat, simmer on low heat for 1 hours
    - Add remaining ingredients, simmer for 2 hours
    - Sieve, cool, and remove the fat from the top
