cuisine: .chinese.sichuan
description: Dong Jiang Yan Jiu Ji
directions:
    step:
    - mix ginger and rice wine, then sieve over chicken and put solids in cavity with
        spring onion. marinate 1h
    - spread the salt on dish, bake 20m ar 190C
    - mix fennel seeds and pepper with salt in dish
    - scoop half the salt, place chicken on top of remainder, rub other half on chicken.cover
        with tin foil and bake 45m
    - uncover and bake another 15 20m
    - shake salt away and serve
