cuisine: .india.classic
description: Toovar Palak Dal. This is a dal where the individual lentils are still
  separate from each other.
directions:
  step:
  - Cook the dal for 30 mins in not too much water with a dollop of butter
  - "15 mins or so before the dal is ready saut\xE8 cumin in oil / butter mixture\
    \ (or ghee), then add asafetida for a few seconds only"
  - Add chopped tomatoes, turmeric, chili and coriander powders, and salt, cook down
    3 mins
  - Add the chopped greens, cook until just tender (depends on the type of green)
  - When the dal is ready pour the chaunk into it, as well as the lemon juice. Cook
    a few minutes to mix in
  - Sprinkle a bit of nutmeg and chopped leaves before serving
