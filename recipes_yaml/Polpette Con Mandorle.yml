directions:
  '#text': '>









    >'
  step:
  - soak breadcrumbs in milk for 15m
  - add ground beef, egg, parsley, pecorino cheese and orm into croquettes the size
    of lipstick
  - sear the meatballs (dip in a deep frier if you have one) on high heat until seared,
    about 1m
  - lower heat and cook gently
  - saute onion in olive oil until translucent, about 6m
  - add passata and onions to meatballs, cook on medium heat for 10m
  - process almonds to a coarse powder
  - add to meatballs and increase heat to high, until it starts boiling, about 1m
