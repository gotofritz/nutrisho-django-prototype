directions:
    step:
    - 1. Skin the peppers either by charring them over a flame, or baking them.
    - 2. Sear the peppers briefly in a little olive oil over high fire, then set aside.
    - 3. Sprinkle over a couple of pinches of salt and two dashes of garlic oil, allow
        them to cool, and then cover the dish with cling film and leave to marinate
        in the fridge for two hours.
    - 4. Remove from fridge and slice thinly
    - 5. Fry half the chorizo in olive oil over high fire until they start to brown
        and seeping fat, then add half the peppers for 20 secs, stirring vigorously.
        Add the spirit, it will ignite, for 10 secs, then toss in half the parsley.
    - 6. Set aside and cook other batch the same way. Add 1st bach at very end and
        serve
