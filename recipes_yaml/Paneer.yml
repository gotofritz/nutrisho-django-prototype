directions:
  step:
  - bring milk to vigorous boil, stirring constantly to prevent scorching
  - lower heat, and when it settles add lemon juice
  - stir slowly, 15/20 secs
  - remove from fire, shake pan gently for a bit
  - set aside covered for 10 mins
  - drain in cheesecloth, keep pressed for a few hours
