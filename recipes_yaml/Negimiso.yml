cuisine: .japanese
description: This is one of those really useful and versatile sauces or pastes (the
  consistency just depends on how long you cook it down to evaporate the moisture)
  that is so easy to make that it’s really barely a recipe. It’s a basic standby in
  Japanese kitchens. As a loose sauce, it can be used in stir fries or as a sauce
  on meat dishes. As a stiffer paste, it makes a great onigiri filling. Cook it down
  more to make it quite dry (though it will still be clumpy, not totally dessicated
  like commercial furikake), and it becomes an interesting furikake. I’ve given 3
  variations for you to try here. The first is the most traditional, the second is
  low in sugar, and the third is alcohol-free.
directions:
  step:
  - Sauté spring onion in oil until transliucent, 5m
  - text: soak the kombu (and optional shitake) in water overnight, in a sealed container
      in the fridge
    title: For the stock
  - Put water in a pot and bring to simmer. Drain and use (you can cut up kombu and
    shitake and use them in stews etc)
  - text: combine dashi stock, miso, sugar, mirin in a bowl.
    title: Classic negimiso
  - Sautè the spring onions until soft
  - Add the liquid, and cook until thick and glossy. For onigiri you can cook it even
    more until thick and hard
