directions:
  '#text': '>'
  step:
  - Place the potatoes in a pot and cover with cold water. Cover and bring to a boil,
    then boil for 30-45 minutes or until the potatoes are tender when pierced with
    a knife tip. Drain the potatoes and leave to cool to room temperature.
  - Peel the potatoes and grate finely with a grater or through a potato ricer. Combine
    the grated potatoes with the flour, egg and pinch of salt. Work through the dough
    with your hands and let rest it for 5 minutes.
  - Wash the plums and dry them thoroughly. Take a small piece of the dough and press
    it between your palms to flatten it. Wrap each plum it the dough to a thickness
    of about 1 cm. Be careful to ensure that the dough stays smooth without any tears
    or scratches. Continue until you have wrapped all the plums.
  - Bring a large quantity of water to boil in a saucepan, then carefully slide the
    dumplings in the boiling water ensuring that they are all submerged. Cook them
    for approximately 10 minutes or until they all float to the surface. Gently remove
    the dumplings with a slotted spoon and divide them between 4 plates.
  - Combine the ground poppyseeds with the icing sugar. Melt the butter in a saucepan.
    Sprinkle the dumplings generously with the poppy seed-sugar mixture and drizzle
    them with melted butter. Serve warm and don't forget that there are pits in the
    plums!
