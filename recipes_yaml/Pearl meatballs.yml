directions:
  step:
  - mix meatballs 1 ingredients in food processor
  - add meatballs 2 ingredients in food processor
  - rinse rice under cold water, then pour boiling water over it, then rinse again.
    Spread over a plate.
  - make 2.5 cm meatballs, and roll over the rice to cover
  - put in oiled dish in steamer and steam hi fire, 20m
  - lower fire and steam 15m longer
