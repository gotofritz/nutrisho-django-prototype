cuisine: .indian.modern
description: I love celeriac in soups and salads but have never quite tried it Indian
    way. Actually have never thought about it. So decided to try it the simple dish
    that can never be messed up or flopped - dal and trust me it turned out to be
    absolutely delicious.
directions:
    step:
    - Wash the dals and soak for 10 mins
    - Mix with the celeriac and pressure cook for 30 mins
    - Sauté mustard seeds, when they splatter add cumin seeds, and chilies
    - Add onions until caramelized
    - Add the onion mixture to the dal, add sambar and salt
    - Cook for 10 mins more on low heat then serve
