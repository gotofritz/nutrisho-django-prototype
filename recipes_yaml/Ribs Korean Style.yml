directions:
    step:
    - Mix all the marinade ingredients except honey in a food processor
    - Marinade the meat and leave in fridge at least 4 hr
    - Shake excess marinade from ribs and put them on a baking tray. Keep the marinade
    - Bake 2.5 to 3 hrs, 160°
    - Mix the remaining marinade and honey in a pot, and reduce
    - Pour over one side of ribs, broil 5-10 mins
    - Cut individual ribs, arrange on plate, and sprinkle garnish on top
