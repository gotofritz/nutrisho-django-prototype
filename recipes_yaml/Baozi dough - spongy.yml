cuisine: .chinese
description: Cha shao bao
directions:
    step:
    - 'prepare starter: mix powders together, slowly stir water in, cover with cling
        film and rest 3 hours'
    - mix flour and baking powder into a bowl, make a well in the centger (3) add
        oil / melted lard if using (4) add starter and work into dough (5) add water
        and work into dough
    - roll dough into a log 50 cm long, cut 2.5 cm pieces (7) with each piece, roll
        into a ball, flatten on table, then roll out in 7,5 cm disks thicker at the
        center (8) place filling in center and twist tops (9) steam 8 m or so
