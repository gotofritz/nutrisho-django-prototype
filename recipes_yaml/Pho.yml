cuisine: .vietnam
description: Vietnamese Beef Noodle Soup
directions:
  step:
    - Halve the onion and ginger, brush with oil, and broil under a hot grill until
      charred, 10-15 mins
    - Boil bones vigorusly for 10 mins, discard water, clean pot, and bring to boil
      again.
    - Add charred veg, meat, and stock ingredients, and simmer for 1.5 hours skimming.
    - Sieve and adjust seasoning. Shred the meat if using.
    - Cook the rice noodles according to instruction, then split among bowls
    - Slice the raw meat, and place in bowl
    - Ladle the hot stock over them
    - Add the garnish ingredients.
    - Serve with hoisin and chilli sauce on the side
