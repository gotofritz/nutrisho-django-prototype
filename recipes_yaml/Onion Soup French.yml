cuisine: .france.traditional
description: Meat stock is essential (beef if you can, else chicken), and you'll also
  need 2 oven proof bowls
directions:
  step:
  - Sautè the onion with the sugar in the butter, on high fire, for roughly 8 mins,
    until translucent
  - Lower heat and cook slowly for 45 mins or more, stirring occasionally, until golden
    brown and mushy. Add a little water and scrape any burnt bits off the bottom if
    it all gets too dry and they stick
  - Add sherry (or chinese rice wine, or marsala wine), reduce until alcohol evaporates
  - Add stock, salt and pepper, and remaining soup ingredients. Simmer on medium for
    20 mins
  - Stir in finish off ingredients and turn off fire
  - Cut garlic clove in half and rub on toasts, then butter them
  - 'For each of the two oven proof bowls: layer a bit of soup of the bottom, then
    one toast, one quarter of the cheese, half the soup, another toast, cover with
    cheese'
  - Grill under a broiler until the cheese is brown in spots, and serve with garnish
