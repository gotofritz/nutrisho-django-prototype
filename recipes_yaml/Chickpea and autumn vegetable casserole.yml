cuisine: .british
description: Chickpeas are a great meaty convenience food to keep in the larder, either
    dried or canned. Chickpeas do vary in quality massively so the rule of thumb is
    generally you get what you pay for. Although this is a great vegetarian dish it
    can be enjoyed by anyone, even add some meat (such as chorizo) to it if you wish
    or simply serve it in the middle of the table as a side dish.
directions:
    step:
    - Put shallots, thyme, garlic, vegetable stock in a pan, season and bring to the
        boil and simmer until the shallots are tender, about 20m
    - Remove the shallots and garlic with a slotted spoon, add the swede, carrots
        and simmer until they are tender
    - add the chickpeas, shallots and garlic and continue simmering for for 5m
    - If you wish to thicken the liquid slightly, liquidise a small ladleful and add
        back to the casserole. Season, add the parsley and serve.
