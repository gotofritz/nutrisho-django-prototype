cuisine: .italia.cremona
description: Knuckles or similar would also work well
directions:
  step:
  - "Saut\xE8 stock ingredients for 3/4 mins in oil and butter, on high."
  - Add enough water to cover everything and 2 cm more, season, and cook 2 hrs normal
    pot / 30 mins in pressure cooker to make stock.
  - Pressure cook the beans in water for 30 mins, then discard the water.
  - Mix all the sauce ingredients in a food processor, season, and whiz to a sauce.
  - "Strain the stock. Discard the vegetables, and store the stock for another dish\
    \ (e.g., Ph\xF4)"
  - Tear the meat from the bone, in long strands if you can.
  - Mix beans and meat, dress with oil, salt, pepper and vinegar
  - Spread the sauce on a plate, add the meat mixture over it, and garnish with chopped
    spring onions
