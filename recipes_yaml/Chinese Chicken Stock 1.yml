directions:
    step:
    - Blanch the chicken pieces by pouring boiling water over them to cover, bringing
        back to boil, then discarding the water
    - Cover chicken again with cold water, bring to boil, skimming as it cooks.
    - Lower heat, add remaining ingredients, simmer on low heat for 1.5 hours
    - cool, and remove the fat from the top. You can use fat for frying if you want
