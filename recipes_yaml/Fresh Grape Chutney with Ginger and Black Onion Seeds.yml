cuisine: null
description: This is a really fresh and unusual chutney that pairs well with a creamy
    chicken curry. I also like it with sweet potato cakes fried in a bit of butter.
    Makes around 2 cups of chutney that will keep in the fridge for a few days.
directions:
    step:
    - Toast the black onion seeds in a dry frying pan over medium heat for 3-5 minutes
        until they begin to pop. Grind the seeds in a mortar and pestle.
    - Mix the ground seeds with the remaining ingredients and toss well to combine.
        Add sea salt and pepper to taste. Allow to sit for at least 30 minutes before
        serving to allow the flavours to develop.
