directions:
    step:
    - Blanch the beef bones by pouring boiling water over them to cover, bringing
        back to boil, then discarding the water
    - Cover bones again with cold water, bring to boil, skimming as it cooks.
    - Lower heat, add remaining ingredients, simmer on low heat for three hours
    - sieve and cook another hour
    - cool, and remove the fat from the top
