cuisine: .italian.sicilian
description: If made from scratch and from risotto leftovers, this is the classic
  recipe. There is a XIII century Bahgdad coockbook with a similar dish called naranjiya.
  They freeze well.
directions:
  '#text': '>








    >'
  step:
  - Put the rice ingredients in a pot, bring to boil, then lower heat and cover tightly
    until stock absorbed, 20 mins
  - Remove from fire, spoon in egg and cheese, then spread on platter to cool
  - "Make the filling: saut\xE8 onion for 7 mins"
  - "Add beef and rosemary, saut\xE9 until seared, then sweat with white wine until\
    \ evaporated."
  - Add passata or canned tomatoes broken with a fork, peas, and lower the heat (medium
    low for canned tomatoes, low for passata). Cook until quite thick then cool.
  - "Roll 1/12 of the rice into a ball, leaving an indentation. Fill it with the rag\xFA\
    \ and wrap the rice around it to close the ball. Roll ball in flour, then beatn\
    \ egg, then breadcrumb."
  - "Deep fry at 180\xB0C. Serve warm or room temperature"
