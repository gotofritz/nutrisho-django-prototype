directions:
  step:
  - Mix all the shortcrust pastry ingredients, and knead into a ball. Leave in the
    fridge, covered , for 30 mins.
  - Cover a tart base and blind bake at 170° for 30 mins
  - Bring the milk ingredients to the boil
  - Beat the egg yolk and sugar well
  - Sieve the flour into the egg mixture, then slowly add the boiled milk without
    the cinnamon
  - Put the milk and egg mixture back on the fire, at low heat, and ring back to boil
  - Turn off the fire and let it cool, mixing it every it so often
  - Fill the tart base with the cream, and stick the grapes in it
  - Cool and serve
