directions:
  step:
  - Sauté onion in olive oil on medium heat until soft, about 5m
  - 'IF MAKING OWN SPICE MIX: dry roast spice ingredients 4-5m then grind'
  - Raise heat, add cinnamon and cardamom to onion for a few seconds
  - Add chicken and potatoes until browned, about 5m
  - Blend tomatoes, garlic, water in a food processor
  - Add spice mix stirring well, then add spice mix
  - Add brow rice, turmeric, fresh chilies, and enough water to cover rice by one
    inch.
  - Close pressure cooker, build pressure up and cook 20 mins (or 10 mins on timer,
    leaving pot on stove to cool down naturally)
