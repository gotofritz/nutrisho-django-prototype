cuisine: null
description: Frijoles de la olla are sinmply cooked beans, and Frijoles Refritos are
  fried and used as acoompanyment
directions:
  step:
  - "To cook the beans: saut\xE9 onions fro 10 m on medium"
  - Add beans, 2L water, epazote and boil vigorously for 10 mins, then on medium for
    50. Or use a pressure cooker
  - Add salt, and cook another 15 m
  - "To refry the beans: saut\xE9 onion, 10 mins, then add the garlic for 2 mins"
  - Add 1/4 of the beans, drained, and mash them. Repeat until the beans are all mashed
    up
  - Add 1 cup of the beans liquid
  - Serve with cheese crumbled on top
