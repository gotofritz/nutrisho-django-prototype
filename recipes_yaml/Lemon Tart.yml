directions:
    step:
    - Whiz butter and sugar in a food processor, then add egg for 30 sec, then flour
        and for a few seconds until the dough just comes together, (add 1 tbsp cold
        water if the dough seems too dry). Knead lightly on floured surface then shape
        into a flat disc and chill for 30 minutes.
    - Heat ovetn 190°C. Roll the pastry out and line a 20cm loose-based tart ring.
        Leave the excess pastry hanging over the edge. Rest for 20 minutes in the
        fridge. Bake blind with foil and beans for 15 minutes, until the sides just
        begin to colour. Remove the beans and foil and bake for another 5 minutes
        or until the base is cooked and lightly golden.
    - Brush the base with the melted chocolate and cool. Lower oven to 110°C.
    - Whisk the eggs, yolks and sugar together in a bowl and stir in the cream. Finally,
        add the lemon juice. Strain the filling through a fine sieve into  a jug,
        pour half into the pastry case, then put the pastry case on the shelf and
        pour the rest in.
    - Bake for 50-60 minutes until the filling is almost set. It should have a slight
        wobble in the centre. Trim the pastry level with the top of the tin and leave
        it to cool completely. Dust with icing sugar and run a cook's blowtorch over
        the surface to give a brûlée effect.
