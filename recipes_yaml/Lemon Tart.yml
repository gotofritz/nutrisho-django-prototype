directions:
  '#text': '>'
  step:
  - "Whiz butter and\_sugar in a food processor, then add egg for 30 sec, then flour\
    \ and for a few\_seconds until the dough just comes together,\_(add 1 tbsp cold\
    \ water if the dough seems too\_dry). Knead lightly on floured surface then shape\
    \ into a flat disc and chill for\_30 minutes."
  - "Heat ovetn 190\xB0C. Roll\_the pastry out and line a 20cm\_loose-based tart ring.\
    \ Leave the\_excess pastry hanging over the edge. Rest\_for 20 minutes in the\
    \ fridge. Bake blind with foil and beans for 15 minutes, until the\_sides just\
    \ begin to colour. Remove the beans\_and foil and bake for another 5 minutes or\_\
    until the base is cooked and lightly golden."
  - "Brush the base with the melted chocolate\_and cool. Lower oven to 110\xB0C."
  - "Whisk the eggs, yolks and sugar together\_in a bowl and stir in the cream. Finally,\
    \ add\_the lemon juice. Strain the filling through a fine sieve into \_a jug,\
    \ pour half into the pastry\_case, then put the pastry case on the shelf and pour\
    \ the rest in."
  - "Bake for 50-60 minutes until the filling is\_almost set. It should have a slight\
    \ wobble in\_the centre. Trim the pastry level with the top\_of the tin and leave\
    \ it to cool completely.\_Dust with icing sugar and run a cook's\_blowtorch over\
    \ the surface to give a br\xFBl\xE9e effect."
