cuisine: .chinese
description: Fengmi Shanyao
directions:
    step:
    - Soak sweet potatoes for 10 mins in cold water, than drain and spread on kitchen
        towel
    - Dry roast the sesame seeds
    - Deep fry sweet potato sticks, 5 mins
    - Cook the sugar 4 mins in oil until melted
    - Carefully add water and bring to a boil, cook 1 min
    - Add the honey 1 min, then add the sweet potatoes. 2 min
    - Add cornstarch mixture and sesame seeds, and cook 2 mins
    - Serve hot
