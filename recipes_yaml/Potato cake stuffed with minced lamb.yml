cuisine: .iran
description: The patties can be kept in the fridge uncooked for up to two days, if
  coered in flour.
directions:
  step:
  - Boil the potatoes whole in salted water until soft but not mushy, then drain for
    10 mins and dry
  - Peel and mash while they are still warm
  - Mix in the flour and season
  - Sauté the onions in butter, then add the spices for 1 min
  - Add the lamb, stirring every so often, for 5 - 6 mins.
  - Mix in the pine nuts, tomatoes, parsley, water, and season, then let cool.
  - With dry hands covered in flour, split the dough into 4 balls. Ladle the filling
    over each, and fold over to create a patty which encloses the filling
  - Shallow fry carefully until brown, then dry on paper towels
  - Serve with a salad and a yogurt and crushed garlic mixture.
  - The uncooked patties can be kept in the fridge for up to two days if covered in
    flour
