cuisine: .chinese.beijing
description: Small wonton soup, Hun-Tun Tung
directions:
    step:
    - Mix flour and water with a chopstick, knead into ball, and let rest for 30 mins
    - Mince the prawns and pork very finely, add salt, and mix with the other filling
        ingredients
    - Roll out the dough thin, and cut into 10 cm squares. Place a small dollop of
        filling into each.
    - Lightly wet half the edges with your finger, marking a letter C, then fold the
        other half over and seal closed, pushing the air out.
    - Start folding in half again, but before folding join the two corners either
        side of the filling.
    - Boil in stock for 4 mins
    - In each bowl put some chopped spring onion, sesame seed oil, chopped coriander,
        and soy sauce
    - Split the wontons among the bowls, and pour the stock over them
