cuisine: .chinese.sizchuan
description: '*we used lettuce stem but also good would be green papaya, cucumber,
  carrot, lotus root, daikon radish or any other crunchy and slightly watery vegetable

  One 2 inch chunk of ginger root, peeled and minced superfine (''like mud'' as Feng
  would say)'
directions:
  step:
  - Mix the finely minced ginger with the salt, splash of boiling water and sesame
    oil and set aside while you chop the vegetables.
  - Peel your vegetables and slice off any rounded edges so that they sit nice and
    flat on your chopping board. Slice them first into thin slices, then carefully
    line up your slices and chop into fine matchsticks. Scatter on a plate.
  - Scoop out 2 tbsp of the wet ginger from your ginger/water mixture and place in
    a small bowl. Add the 2 tbsp of water, vinegar and salt and stir. Add the sesame
    oil and stir gently.
  - Pour over the vegetables and either leave for 20 minutes for the vegetables to
    soak up some of the liquid and 'pickle' slightly or eat straight away. This would
    also be a great dish to bring along for picnics.
