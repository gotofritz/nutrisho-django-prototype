cuisine: .thai
description: the secret to a good pad thai is the sauce which needs to be thick and
  slightly tart.I'd suggest making double the amount of the tamarind sauce so that
  you have enough left over in your fridge to make a second batch of pad thai when
  you are in a hurry. It also makes a great dipping sauce for any kind of vegetables,
  dumplings or spring rolls.
directions:
  step:
  - Soak tamarind pulp in boiling water for 20 min. Rub until thick , then strain,
    pressing out all liquid; discard solids
  - Simmer tamarind liquid with palm sugar, fish sauce, and chili paste until sugar
    dissolves and sauce thickens (3-5 min). Set aside
  - Soak dried rice noodles in warm water for ~15 min until pliable but still firm
    (rubber-band texture). Drain
  - Heat oil in a wok on medium-high. Stir-fry garlic, ginger, and tofu for 2 min
    until tofu is lightly browned and crisp
  - Add noodles and a ladle of tamarind sauce. Toss vigorously, adding a splash of
    water if needed to prevent sticking
  - When noodles are tender, push aside and scramble eggs. Mix through noodles. Add
    prawns, bean sprouts, radish, and peanuts; stir-fry 1-2 min until prawns are pink
    and cooked. Add more sauce if needed
  - Remove from heat. Toss through spring onion and coriander.
  - Divide into bowls and serve with lime wedges
