cuisine: .thai
description: the secret to a good pad thai is the sauce which needs to be thick and
  slightly tart.I'd suggest making double the amount of the tamarind sauce so that
  you have enough left over in your fridge to make a second batch of pad thai when
  you are in a hurry. It also makes a great dipping sauce for any kind of vegetables,
  dumplings or spring rolls.
directions:
  step:
  - To make the tamarind sauce, place the tamarind pulp in a small bowl and pour over
    the boiling water. Set aside for 20 minutes, then rub the pulp between your fingers
    until the texture of the water is thick - similar to ketchup.
  - Pour the tamarind and water through a fine mesh strainer with a bowl underneath
    to catch the liquid. Press down with a teaspoon on the tamarind fibres to extract
    as much flavour and liquid as possible, then discard the tamarind pulp.
  - Combine the tamarind water, palm sugar, fish sauce and chili paste in a small,
    heavy based saucepan on medium heat. Bring to a gentle simmer, stirring occasionally
    until all the palm sugar has dissolved. Continue to simmer for a further 3-5 minutes
    or until the sauce has thickened. Remove from the heat and set aside.
  - If using dried rice noodles, soak them in warm water for approximately 15 minutes
    or until pliable but not overly soft. Ideally with the texture of a rubber band.
    Drain and set aside.
  - Heat the oil in a wok over medium-high heat. Add the garlic, ginger and tofu and
    stir-fry for 2 minutes until the tofu is crispy and lightly browned.
  - Add the noodles and a ladleful of the tamarind sauce. Stir the noodles vigorously
    around in your wok to keep them from sticking together. Add a splash of water
    if necessary.
  - When the noodles are tender, push them to one side and add the eggs. Allow them
    to set slightly and then mix them through the noodles. Make a well in the centre
    of the noodles and add the prawns, bean sprouts, radish and peanuts. Stir vigourously
    for 1-2 minutes until the prawns have turned pink and are cooked through. Add
    a little more tamarind sauce if the noodles are too dry.
  - Turn off the heat and add the spring onion and coriander. Toss well to combine.
  - Serve the noodles in large wide bowls with the lime wedges.
