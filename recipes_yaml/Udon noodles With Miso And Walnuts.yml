directions:
  step:
  - Peel stripes off the aubergines, then cut into 2.5 cm slices and quarter each
    slice. Deep fry, then sprinkle with salt and leave to rest.
  - Cut the cucumber into 2 mm strips, and the spring onions in thin julienne, put
    in a bowl of cold water and chill
  - Make dashi by boiling kombu in 150 ml water for 5 mins
  - Sauté the shallots over low heat for 2 mins, then add ginger and garlic and cook
    for 5 mins
  - Mix in the walnuts and aubergines and set aside
  - Mix the dashi and the sauce ingredients, then add to the aubergine mix
  - Cook the noodles, and meanwhile reheat the sauce and thicken it slightly
  - Drain and dry the cucumber and spring onions
  - Pour the sauce over the noodles, and sprinkle spring onions and cucumber over
    them
