cuisine: .italian.sicilia.modern
description: From that chap that hates garlic
directions:
  step:
  - Soak the aubergines in salty water for 15 mins
  - Cook the tomato sauce on high for 20 mins, then pass through a food mill
  - Add some basil leaves and whizz in a food processor
  - Cook the sauce on low another 15 mins
  - Drain the aubergines and deep fry, then pat dry on kitchen paper
  - Mix together the aubergines, tomato sauce, and remaining ingredients
  - Serve with bread or cous cous
