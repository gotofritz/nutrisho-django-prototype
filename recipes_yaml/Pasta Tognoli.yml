cuisine: .indian.uttar pradesh
description: This is what passes for "carbonara" in the UK. Nothing to do with the
    real thing, but a simple studenty dish that has its uses. Named after a TV caricature
    of an Italian.
directions:
    step:
    - Boil a large pot of salted water and cook pasta in it as per packet instructions
    - While the pasta is cooking, sauté the bacon or ham in butter, 4 or 5 minutes
        until fairly crisp
    - Stir in the flour, it will stick to the bacon. Let it cook that way a couple
        of minutes, stirring well
    - Add the milk, season with salt and pepper to taste, bring it to a simmer
    - Add the frozen peas if using
    - Keep cooking on a medium simmer until thickened
    - when the pasta is ready, pour the sauce over it, mix it well, and serve
