directions:
    step:
    - dice potatoes 2.5 cm, chop the coriander, peel the ginger and chilli
    - sautè spices (not assafoetida) in ghee until they begin to brown 2m
    - add assafoetida if using a few secs
    - add the potatoes, sautè until browned, a few mins
    - add ground spices, chopped coriander, and stock or water
    - stir, put heat on medium, cover, cook until liquid reduced
    - uncover, add ghee, raise heat and stir fry create a crust
    - add garam masala if using, salt to taste, chopped herbs, and serve
