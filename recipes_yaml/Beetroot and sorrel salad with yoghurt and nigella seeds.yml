cuisine: null
description:
  "Beetroots are a great accompaniment for barbecues and buffets during
  the summer, and they also lend themselves to being gently spiced up, or in this
  case herbed and spiced.


  If you shop at farmers' markets, you will come across lots of varieties of beetroots
  these days as farmers are reviving the old coloured varieties. Try to buy them with
  the leaves, as you can blanch the leaves as I've done here, then toss them in with
  the beets. I made this dish with yellow beets, although you could use a mixture
  of yellows and reds, or just reds if you prefer."
directions:
  step:
    - Remove the leaves from the beetroot and give them a good wash. Cook the beets
      in their skins in boiling salted water for about an hour or until tender. Cook
      the leaves in fresh boiling salted water for 2-3 minutes until just tender, then
      drain. Once the beetroots are cool enough to handle, peel them by rubbing the
      skin off with your fingers, then cut them into quarters, depending on their size.
      Mix with the leaves.
    - Toss the beetroots and leaves with the vinegar and olive oil and season well.
      Arrange in a bowl and scatter or mix in the sorrel leaves. Then spoon the yoghurt
      on top, scattered with the nigella seeds.
