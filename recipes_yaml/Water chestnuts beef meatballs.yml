directions:
    step:
    - process all the mixture ingredients
    - put cornstarch in bowl, roll meatballs in it, tap off excess
    - press balls into disks
    - fry in 6mm oil, 2.5 m per side
    - sprinkle pepper and serve with chilli sauce
