directions:
  '#text': '>












    >'
  step:
  - slice the zucchini 3mm thick, then cut in strips lengthways and then across, to
    get 3mm dice
  - chop the onions
  - put salted water to boil
  - "melt the butter with oil, saut\xE8 the onions 5m on mid heat"
  - "add the zucchini and saut\xE8"
  - meanwhile crush the aniseed and mint in pestle
  - cook the fusilli as per normal
  - in a food processor blend the black beans and stock. season with salt and pepper
  - add the mint + aniseed blend (6) to the zucchini (5), stir a bit
  - add the beans (8) to the zucchini (9)
  - when the pasta is ready stir into the sauce and serve
