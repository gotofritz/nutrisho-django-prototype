cuisine: .vietnamese.modern
description: The meat is very thing
directions:
  step:
  - Heat sugar in a heavy bottomed saucepan over medium-high heat, swirling pan often,
    until sugar dissolves and turns to liquid caramel
  - Remove from heat and add boiling water
  - Bring back to fire, swirling gently until dissolved
  - Remove from fire and let cool
  - Mix in food processor with all other marinade ingredients
  - Pound chops thin, then put in a baking dish
  - Pour marinade over meat and chill overnight, covered
