directions:
    step:
    - Sauté carrots in the ghee, or butter and oil mixture, for a few minutes on high
        heat
    - Add ginger, then remaining curry ingredients. Bring to boil then lower heat
        and cover.
    - Cook covered 20-30 mins. Time depends on toughness of carrots. Add water as
        needed.
    - When almost done, increase heat, uncover and toss until all liquid has evaporated.
    - Remove from heat and toss in butter, chopped coriander, lemon juice, and nutmeg.
