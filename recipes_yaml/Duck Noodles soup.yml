cuisine: .chinese.beijing
description: Ya Mian Tang
directions:
    step:
    - soak 8 mushrooms 5m then drain
    - reduce the duck stock with soaked mushrooms (1), 1 tbsp rice wine, 2 tbsp soy
        sauce, 0.5 tsp salt, 20m
    - mix marinade ingredients, glaze over duck, stand on rack over greaseproof paper
        15m
    - roast duck at 200C for 8 - 12 mins (depending on whether breast / thigh) then
        rest 5m
    - cook noodels 2.5m, drain, rinse in hot water, drain again, then place in individual
        bowls
    - fish out mushrooms from soup, and place with noodles, coriander leaves, chopped
        spring onions, thinkly sliced duck
    - sive the stock over the bowls and serve
