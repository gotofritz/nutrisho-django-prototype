cuisine: .spain.murcia
description: Verduras De Murcia
directions:
  step:
  - Sprinkle the aubergine pieces with salt and let drain for half an hour, then dry
    with kitchen roll
  - "Toss with olive oil and bake in a baking tray for 25 mins at 230\xB0 until they\
    \ start to brown and are tender"
  - "Saut\xE8 onions and pine nuts for 10 mins on medium"
  - Add garlic and oregano and cook on slow until amber
  - Toss in the aubergines and increase heat, stirring quickly, for 2 mins
  - Add the vinegar, another 2 mins, then season with salt and pepper
ingredients:
  group:
    ingredient:
    - measurement: null
      name: aubergines
      preparation: peeled, cubed 2 cm
      quantity: '3'
    - measurement: medium
      name: onion
      preparation: chopped
      quantity: '1'
    - measurement: tbsp
      name: pine nuts
      preparation: null
      quantity: '3'
    - measurement: cloves
      name: garlic
      preparation: sliced thinly
      quantity: '2'
    - measurement: tsp
      name: oregano
      preparation: null
      quantity: '0.5'
    - measurement: tbsp
      name: balsamic vinegar
      preparation: or vinegar with a little sugar
      quantity: '1.5'
    name: null
  serves: '4'
source: Moro Cookbook 2
