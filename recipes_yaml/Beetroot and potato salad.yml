directions:
  step:
  - Put the beetroot in salted cold water and pressure cook 15m to 45m depending on
    size
  - Put in cold water and rub off the skin, then cut in wedges
  - Boil the potatoes, when ready cut in 2cm wedges too
  - Mix beetroot and potato in a bowl, add parsley, mint and spring onions
  - Mix all the dressing ingredients and dress the salad
