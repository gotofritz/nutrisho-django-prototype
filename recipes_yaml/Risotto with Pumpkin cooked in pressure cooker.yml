directions:
  step:
  - Coat the large punmpkin chunks with their marinade. Season and put on a baking
    tray
  - Coat the pumpkin dice with the other marinade. Put on a different baking tray
  - Bake both at 200°, stirring once. Take the dice out after 30 mins, and the chunks
    after 40 mins.
  - Whiz the large chunks with miso, broth until a smooth. Season
  - 'Start normal risotto in pressure cooker: sautè onions, add rice, sweat wine'
  - Put all broth in at once, close pressure cooker. Bring to pressure on low, then
    cook 5 mins.
  - Meanwhile, cook sage leaves in butter, then remove them and save them.
  - Release pressure immediately with cold water on lid. Stir risotto a bit to give
    it right consistency. Add puréed squash and butter and stir
  - Add grated cheese and diced squash, then season. Garnish with the fried sage leaves
