cuisine: null
description: Salsify is one of those old-fashioned ingredients that you don't see
    on menus any more. It is not the easiest of veg to prepare - which is one possible
    reason why it's out of vogue.
directions:
    step:
    - Pre-heat about 8cm of oil to 160-180C in a large, thick-bottomed saucepan or
        electric deep-fat fryer. Top and tail the salsify and peel thoroughly with
        a swivel peeler, ensuring all of the black skin is removed.
    - Squeeze the lemon juice into a pan of salted water and add the salsify (you
        may need to cut them in half).
    - Bring to the boil and simmer for 5-6 minutes, or until just tender, then drain
        and leave to cool, or run under the cold tap to cool down quicker. Cut the
        salsify into 2-3cm lengths and halve the pieces lengthways if they are thick.
    - Have three bowls ready, one with flour, seasoned, one with the egg, and the
        third with the breadcrumbs mixed with the Parmesan. Flour the salsify, shaking
        off any excess, then pass them through the egg and then through the breadcrumb
        mixture.
    - Deep-fry the salsify a handful or so at a time until nicely coloured and crisp
        and serve with your choice of sauce.
