cuisine: .chinese.yunnan
description: Dandan mian
directions:
    step:
    - cook noodles 3/4 m until barely tender, then drain, rinse under hot water, and
        leave to drain
    - meanwhile deep fry peanuts 1m, then let cool and chop
    - chop the spring onion and chili
    - mix the sauce ingredients in a bowl, then add the noodles and stir
    - divide into individual portions, sprinkle the peanuts and spring onions on top
