cuisine: ".per\xFA"
description: Peruvian street food
directions:
  step:
  - Boil the beans in water for 30 mins in pressure cooker (1.5h after overnight soaking
    if using a normal pot)
  - Drain and pass through a coarse sieve to remove skins.
  - Meanwhile simmer down milk until it becomes half the amount, about 250ml
  - Blend beans and reduced milk together to a smooth mixture
  - Add sugar, cinnamon, cloves to mixture and boil on medium for 25 - 30 mins until
    thick.
  - Cool then serve into individual bowls and refrigerate
  - Sprinkle with toasted sesame seeds before serving
ingredients:
  group:
    ingredient:
    - measurement: g
      name: red kidney beans
      preparation: soaked overnight unless pressure cooker is used
      quantity: '250'
    - measurement: ml
      name: milk
      preparation: or 250 ml evaporated milk
      quantity: '500'
    - measurement: g
      name: sugar
      preparation: null
      quantity: '200'
    - measurement: stick
      name: cinnamon
      preparation: null
      quantity: '1'
    - measurement: cloves
      name: null
      preparation: null
      quantity: '3'
    - measurement: tbdp
      name: sesame seeds
      preparation: toasted
      quantity: '2'
    name: null
  serves: '2'
source: "Cooking of Per\xFA"
tags:
- sweet
title: "Sweet Bean Pur\xE8 / Freiol Colado"
