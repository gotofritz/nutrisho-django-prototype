cuisine: .indian.uttar pradesh
description: A light lunch normally served with chapatis and a kachambar. For a more
    substantial one, serve with light soup and wafer
directions:
    step:
    - Sauté cumin seeds and ginger in ghee, then add curry leaves
    - After a few seconds add the cauliflower florets, turmeric, cayenne, and fresh
        herbs.
    - Stir fry on high for a few minutes.
    - Add fresh peas and liquid, bring to a simmer then cover and lower heat
    - Cook 15 to 20 mins until tender
    - Turn off fire and mix in salt, yogurt, and fresh herbs
