cuisine: null
description: Beetroot is one of my favourite chilled soups; it's got such a great
    flavour and colour, and always goes down well with dinner guests. I've added a
    bit of a Mediterranean twist here by frying cubes of halloumi like croutons and
    using white beetroot to garnish. You could use a selection of coloured beetroots.
directions:
    step:
    - Gently cook the onion in the oil in a covered pan for 2-3 minutes until soft.
        Add the vegetable stock, bring to the boil, season with a little salt and
        pepper and simmer for 30 minutes. Add the beetroot, remove from the heat and
        blend in a liquidiser until smooth, then strain through a fine meshed sieve
        and re-season if necessary. Cool the soup down, then refrigerate for a few
        hours until well chilled or put it into the freezer if you're in a rush.
    - Meanwhile, heat a little oil in, preferably, a non-stick frying pan and fry
        the pieces of halloumi on a fairly high heat for a few minutes, turning them
        occasionally until they are evenly coloured all over. Remove from the pan
        and drain on some kitchen paper.
    - Once the soup has chilled, check and re-season if necessary as the flavour changes
        a little once it has cooled down, then stir in the balsamic vinegar to taste.
    - To serve, cut the yellow beets into chunks or wedges. Pour the soup into large,
        chilled bowls or soup plates, arrange the beets in the middle and scatter
        the halloumi and mint leaves over; drizzle with olive oil.
