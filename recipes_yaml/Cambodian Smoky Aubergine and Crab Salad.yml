cuisine: .cambodian
description: 'The basis of nearly every Cambodian dish is a ''kroeung'' which is a
  kind of herbal paste made from smashing some peppercorns, herbs, and shallots in
  a mortar and pestle until it forms a paste. The combination of smoky aubergine,
  sweet crab meat and tangy lime and herbs makes for a really beautiful and refreshing
  salad that can be served with glass noodles or scooped into gem lettuce leaves and
  eaten with your hands.


  The only things to remember are to get your aubergines nice and charred to give
  them a good smoky flavour and to use the best quality crab meat that you can get
  your hands on. I like to use unpasteurised handpicked white crab meat from Portland
  Shellfish.'
directions:
  step:
  - Make the kroeung by placing the salt, peppercorns and sugar in a mortar and pestle.
    Pound the ingredients until the peppercorns are a coarse powder, then add the
    remaining ingredients and pound until it becomes a smooth paste.
  - Roast the aubergine on a barbecue, in the flame of a gas hob or under your oven
    grill until the skin is charred and wrinkled all over. Place the aubergine in
    a colander to cool slightly, then carefully peel off the skin. Place the aubergine
    flesh in a colander for 10 minutes to allow any excess water to drain away, then
    mash the aubergine with a fork to a coarse puree.
  - Add the crab meat and the kroeung to the aubergine puree and fluff it through
    with a fork until well mixed. Add the fish sauce, lime juice and herbs and toss
    well.
