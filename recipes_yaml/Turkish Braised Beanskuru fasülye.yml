cuisine: .turkish
description: This recipe is a great recipe for anyone wanting to improve their sense
    of tasting, balancing and adjusting flavours. The final step of tasting and adjusting
    the salt, pepper, chili, lemon and olive oil and teasing out the flavours of the
    herbs and tomato is a great exercise in learning to season.
directions:
    step:
    - Place the beans and water in a large soup pot and bring to a boil. Add the tomatoes,
        herbs, garlic, chili flakes, olive oil and pepper and reduce to a gentle simmer.
        Simmer uncovered for an hour or until the beans are tender, crushing the tomatoes
        halfway through the cooking time with a wooden spoon to encourage them to
        disintegrate into the beans.
    - When the beans are tender, crush the garlic cloves so that they melt into the
        beans. Increase the heat and simmer the beans until nearly all the water has
        evaporated and the beans have only a thick coating of sauce on them. Switch
        off the heat and allow to cool slightly.
    - Add the lemon juice, salt and olive oil and taste. The beans should taste peppery,
        spicy, and dense. Adjust the lemon juice, chili, salt, pepper and olive oil
        until the desired flavour is reached.
    - Serve warm in shallow bowls with fresh crusty bread.
