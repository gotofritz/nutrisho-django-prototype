cuisine: .chinese.hunan
description: Dong'an Ji
directions:
  step:
  - miz the sauce ingredients and set aside
  - mix marinade ingredients with chicken and stand at least 15 mins
  - deep fry chicken 1.5 m then set aside
  - pour off oil, wipe wok, put 2 tbsp back
  - stir fry ingredients 30 s,
  - add chicken, 30 s
  - pour sauce over 10 s, lower heat, 4 m
  - serve with salt and sichuan pepper
