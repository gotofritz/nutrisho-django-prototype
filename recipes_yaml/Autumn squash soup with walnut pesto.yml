cuisine: .european
description: There is an abundance of squashes and pumpkins on the market at the moment;
  the deep orange-fleshed varieties offer the best flavour and colour.
directions:
  '#text': '>'
  step:
  - 'For the pesto: put the walnuts, basil, garlic and salt in a liquidiser and coarsely
    blend. Add the cheese and blend again briefly, then transfer to a bowl.'
  - Gently cook the leek and onion in the butter in a thick-bottomed saucepan until
    soft. Add the squash and vegetable stock, bring to the boil, season with salt
    and pepper then simmer for 20 minutes.
  - Blend in a liquidiser until smooth, then strain through a fine-meshed sieve. Re-heat
    the soup and adjust the consistency with a little vegetable stock or water if
    necessary and re-season with salt and pepper. Serve with a spoonful of the pesto
    on top.
