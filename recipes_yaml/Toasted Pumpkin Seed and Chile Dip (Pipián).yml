cuisine: .mexican
description: 'Toasted over a traditional ''comal'' or in a dry frying pan until they
  pop, the seeds are then ground up and used to add an earthy, nutty flavour.


  Unlike many Mexican dishes which are unapologetically time consuming, this is fairly
  straightforward and quick to make. In Susana''s kitchen we had this on tostadas
  but it would make a great dip for vegetables, bread or used as a sandwich spread
  with grilled halloumi. This would make a tasty and interesting change from the jars
  of hummous that many of us keep in our fridges.'
directions:
  '#text': '>











    >'
  step:
  - dry roast pumpkin seeds on medium heat until puffed up and golden, about 5m
  - peel tomatoes
  - "pur\xE9 with jalape\xF1os chilies until smooth"
  - remove from stove, discard garlic, chop coarsely and set aside
  - "saut\xE9 onion in olive oil on medium heat until translucent, about 5m"
  - add garlic for 1m
  - "add tomato and chilies pure\xE9 and simmer until thickened, about 6-8m"
  - season with salt and pepper and let cool
  - blend pumpkin seeds until powder
  - "mix with tomato pur\xE9, water if needed and coriander leaves"
