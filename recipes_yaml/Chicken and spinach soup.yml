cuisine: .chinese
description: Qing Tang Ji Bocai
directions:
  '#text': '>'
  step:
  - bring the stock ingredient to quick boil, then simmer 35 m
  - combine the marinate ingredients leave until stock is ready
  - fish out chicken legs from stock and re-use
  - cook the marinated breasts a few minutes
  - lift out meat from soup and split into bowls, together with spinach and ginger
  - sieve the stock into the bowls, add salt and pepper
