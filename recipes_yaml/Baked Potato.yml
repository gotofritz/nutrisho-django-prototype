cuisine: .europe.uk
description: Do it without cheese for vegans
directions:
  step:
  - Heat oven to 210°C
  - Soak them in water with a 0.5 tsp bicarbonate for 15 to cleanse them.
  - Rub the skins with a brush and dry them. Pierce them with a fork
  - Rub them with olive oil and sprinkle generously with salt. Very generously
  - Bake them 45 - 60 mins. No need for foil
  - Take them out and cut them in half lengthways, without completely separating the
    two halves.
  - Add big knob of butter
  - Add salt and pepper. Break the flesh tof the potatoes a bit with a fork and mix
    with the seasoning
  - 'Optional: add handful of grated cheese, mix again'
  - Put the baked beans in a cup, warm them up a bit, then spoon them over the potates
