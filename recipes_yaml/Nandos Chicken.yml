cuisine: null
description: It has, in fact, absolutely zero connections with Nando's. Cooking time
  depend on size of pieces
directions:
  step:
  - Put all the marinade ingredients in a food processor and whiz to a paste
  - Put the chicken in a ziplock bag, and pour the marinade over it. Close and massage
    the bag to spread the marinade evenly
  - Rest between 2 and 24 hours in the fridge
  - '<u>AIRFRYER</u>: Run the preheat cycle, then spray the basket with oil, place
    the chicken pieces in the basket, and cook on the chicken cycle'
  - '<u>OVEN</u>: Preheat to 190°, then cook the thighs for 20-25 mins. Turn the pieces
    over, and give them another 10 mins'
