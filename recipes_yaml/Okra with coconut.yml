directions:
    step:
    - Wash the okra, dry well (maybe in oven), cut in disks
    - fry in ghee the cumin and black mustard seeds,
    - when done add the assafoetida and immediately after the okra
    - reduced the heat, add cayenne, turmeric, coconut, 20 mins, adding water if it's
        getting too dry
    - season with salt and serve
