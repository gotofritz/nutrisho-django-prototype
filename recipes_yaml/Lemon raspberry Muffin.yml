directions:
  step:
  - Grease and line muffin tray
  - Melt butter in microwave and cool
  - Flour, sugar, salt baking powder, zest stirred in large bowl
  - Pour lemon juice into measuring cup, add milk till there is 1 cup
  - Beat egg and add to lemon
  - Add butter to lemon
  - Mix flour mixture with milk/egg/butter concoction
  - Add raspberries
  - Spoon mixture into muffin cups
  - "bake for 25 mins at 205\xB0"
