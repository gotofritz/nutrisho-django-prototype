cuisine: .western
description: Lovely nutty + fruity
directions:
  step:
  - Line the base and side of a 23cm cake tin.
  - 'If using vanilla pod: cut in half lengthways, scrape middle into milk, drop the
    pod in the milk, and simmer for a few minutes.'
  - 'If using whole almonds: blanch a few minutes in boiling water, cool, then peel.'
  - Put in food processor with walnuts, and grind.
  - Add sugar, walnut oil, butter, and mix on slow
  - Add egg one at the time, slowly
  - Add remaining dry ingredients and vanilla milk (minus the pod) to the mixture
  - Pour mixture in cake tin. Push in the apricot halves, skin down
  - Bake 70-80 mins at 170°
  - Sieve icing sugar into lemon juice, beat, and when cake is ready brush over cake.
  - Sprinkle lavender flowers and leave to cool
