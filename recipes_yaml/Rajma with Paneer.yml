directions:
  '#text': '>









    >'
  step:
  - soak the beans overnight then replace water, mix together all ingredients and
    cook until ready, 1.5 to 3 hrs
  - "Mash 180 ml of the beans to a pur\xE8and reduce the cooking water to a 360 ml"
  - crush the spices together, add the ginger and keep crushing. Add the remaining
    ingredients, and make into a paste
  - meanwhile peel the tomatoes and dice them
  - cube the paneer or halloumi, and (deep) fry it in very hot oil
  - fry the spices, in ghee 1-2 mins, add the tomatoes, 10 mins
  - add everything else - beans (3) reduced water (4) fried paneers (8), 15 mins
  - mix chopped coriander and serve
