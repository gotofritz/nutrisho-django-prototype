directions:
    step:
    - Place the sake or plum wine in a small saucepan and simmer gently over medium
        head until reduced by half. Combine with the lemon juice and zest, vinegar,
        and olive oil and whisk to combine.
    - Meanwhile, place the hazelnuts in a dry frying pan over low-medium heat and
        toast, shaking the pan occasionally for 4-5 minutes or until fragrant and
        nutty smelling.
