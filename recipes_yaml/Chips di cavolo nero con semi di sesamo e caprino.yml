cuisine: .med.italy
description: Easy chips of cavolo nero with sesame seeds and goat cheese, prepared in the microwave oven.
directions:
  step:
    - Wash and dry the cavolo nero leaves well, then pat them dry.
    - Season with olive oil and salt, place between two sheets of microwave-safe paper and cook at 600 W for 1 minute, then at maximum power for another 30 seconds until crispy. Sprinkle with sesame seeds.
    - Mix the goat cheese with a little olive oil and grated lemon zest.
    - Serve the sesame-coated chips with goat cheese dollops and coarsely ground pink pepper.
