cuisine: .spanish
description: Pay attention to the way of splitting the potatoes by turning your knife
  sideways. This creates a jagged edge which will help your potatoes to lose more
  starch making this recipe even thicker and more delicious.
directions:
  '#text': '>








    >'
  step:
  - rinse and dry the pork ribs
  - season with salt and pepper
  - "saut\xE9 ribs, then set aside in olive oil on high heat"
  - "saut\xE9 without stirring the potatoes on high heat until brown, about 4m"
  - season and simmer gently on medium low for 10m
  - add and bring to simmer the onion, chorizo, bay leaf, smoked paprika, water on
    medium low for 5m
  - add ribs and simmer gently on low heat until sauce is thick, about 60m
