cuisine: .british
description: Good as xmas presents
directions:
    step:
    - Beat butter and sugar together until smooth
    - Stir in the flour to get a smooth paste. Turn on to a work surface and gentl
        rollo out until the paste is 1cm thick
    - Cut onto fingers or rounds and place onto baking tray covered with paper. Sprinkle
        with icing sugar and chill in the fridge for 20 mins
    - Bake at 190° for 15 20 mins.
    - Cool on a wire rack
