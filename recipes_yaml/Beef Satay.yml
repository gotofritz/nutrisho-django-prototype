cuisine: .asia.singapore
description: Make the skewers quite thin
directions:
  step:
    - If broiling in the oven, soak the bamboo skewers in water for 30 mins
    - Rub the beef strips with marinade. Leave for 30 mins to overnight in the fridge or freezer. The last 30 mins should be at room temperature
    - Put all the sauce ingredients EXCEPT the lime juice in a pot, and cook on medium until it thickens. Don't let it boil.
    - When the sauce is thick enough add lime juice to it
    - If broiling, set grill/broiler at 180°
    - Take the beef strips out of the marinade but keep any remaining liquid.
    - Thread the beef pieces with the skewers and cook on a hot plate for 6 mins or under broiler. Baste with the marinade liquid
    - Serve with sauce
