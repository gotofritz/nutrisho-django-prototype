cuisine: .med.italy
description: North Italian staple, changed for maximum umami. The pork sausage is not traditional, but can add proteins.
directions:
  step:
    - If NOT using pressure cooker, put all the stock ingredients in a pot, bring to boil then simmer very low on the side
    - Slice the mushrooms and sauté them in a separate pot in an oil + butter mixture, until the liquid is evaporated, 5-6mins
    - Add the aromatics to the mushrooms and keep stirring until they are wilted, 3-4mins
    - Add the risotto rice to the mushrooms and stir fry to toast it, 2mins
    - If using, add the wine mix to the risotto and mushrooms and stir constantly until evaporated, 3-4m
    - "<u>PRESSURE COOKER</u>: add the pressure cooker stock ingredients, close and bring to pressure. Then cook 4 mins"
    - "<u>NORMAL POT</u>: Add salt and a ladleful of stock from the other pot to the risotto, mix it gently and frequently until it's all absorbed by the risotto"
    - Then add a smaller ladleful of stock, stir it in and until absorbed
    - And again and again, for roughly 20 mins (depends on the amount of rice and how strong the heat is). When ready it should be soft enough to eat but not porridge like
    - "<u>BOTH</u>: Remove from heat, add the mantecatura ingredients and stir carefully but vigorously for a 30 secs"
    - Cover and let it rest a couple of minutes, then serve

