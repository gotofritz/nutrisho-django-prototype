directions:
  step:
  - Steam the sweet potato then drain in a colander for one hour
  - Whisk the sauce ingredients until smooth then set aside
  - Mix all the fritter ingredients by hand in a bowl
  - With we hands, knead into walnut sized balls, then flatten into 5 cm to 1 cm cakes
  - Fry in butter, carefully until you get a nice crust, 6 minutes, turning as necessary
  - Dry on paper towels and serve hot or cold with the sauce
