cuisine: .moroccan
description: Lovely smell
directions:
  step:
  - Mix the fennel seeds, salt and flour in a bowl
  - Dissolve the yeast into the water, then add the honey
  - Add the yeast to the flour
  - Add the nilk, slowly
  - Knead into a dough, for about 5 minutes. It should be slightly tacky but smooth
    and elastic.
  - Rest covered with a cloth for 1 hour
  - Divide into 4 balls, rool into 1.5 mm thick flatbreads
  - Place on an oiled oven tray, pinch 12 times with your fingers, and brush with
    egg glaze mix
  - Bake at 230° for 15-20 mins
