cuisine: .italian.sicilian
description: There are many variations. Not all the options here go together - either
  raisins, or sausage, or mozzarella.
directions:
  '#text': '>












    >'
  step:
  - dissolve fresh yeast in warm water for 5m. Add flour bit by bit and knead for
    10m
  - rest in greased bowl, covered in kitchen towel until doubled in size, about 2h
  - "saut\xE9 garlic in olive oil hot until just golden, about 1m"
  - "saut\xE9 spinach until just wilted, about 3m. Drain, squeeze well keeping the\
    \ water, and chop corasely"
  - soak raisins, if using, in spinach water for 10m
  - drain and add to chopped spinach
  - add chili powder if using, black olives, mozzarella if using
  - "If using sausage, saut\xE9 onion in olive oil med for 4m, add sausage until seared,\
    \ about 2m. then set aside."
  - Mix all the fillings together in a bowl
  - Roll out dough as thin as possible, smear oil over it, lay the stuffing over it.
    Start rolling, smearing more oil between layers of dough
  - "Bake until ready 190\xB0 for 35m"
