cuisine: .indian.punjab
description: Chole Kulcha is an Indian classic. This is the Kulcha part
directions:
  step:
  - Make a dough with all the ingredients and let it rest covered for 2 hours
  - Mix the stuffing ingredients well, add salt
  - Divide into small balls, flatten them wide and put a spoonful of stuffin in the
    middle. Fold doug over stuffing
  - Sautè briefly then bake 20 mins or so
