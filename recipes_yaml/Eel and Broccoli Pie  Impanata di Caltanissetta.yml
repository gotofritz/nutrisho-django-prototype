cuisine: .italian.sicilian
description: A Christmas dish. The original is made with two (or three) impanatas
    layered inside each other.
directions:
    step:
    - dissolve fresh yeast in warm water for 5m
    - add flour bit by bit and knead for 10m
    - rest in greased bowl, covered in kitchen towel until doubled in size, about
        2h
    - sauté onion in olive oil med for 10m. Add eel, tomatoes on low heat for 10m
    - put anchovy fillets in a skillet
    - add onion, caciocavallo cheese, half the black olives
    - lay broccoli on top
    - drizzle olive oil on top
    - add black olives on top
    - add salt
    - drizzle red wine on top
    - cover and simmer without stirring on low heat for 12m
    - Drain and mix with the tomatoes
    - Roll out the dough in a disk, ladle out the drained fillings, fold like a calzone,
        and puncture.
    - Bake until ready 190° for 35m
