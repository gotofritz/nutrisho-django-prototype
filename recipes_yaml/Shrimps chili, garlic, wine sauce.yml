cuisine: .chinese.beijing
description: Jiu Suan La Jiao xiaren
directions:
  '#text': '>'
  step:
  - sprinkle salt on shrimps and stand 10 m (2) make batter by beating eggs well then
    adding starch (3) dip shrimps in batter and deep fry
  - remove oil, wipe wok, return 1 tbsp of oil in it. very hot (5) stir fry garlic
    and chili 20s (6) add rice wine, sugar, soy sauce, reduce 40 s (7) add cornstarch
    mix, 90 s (8) salt to taste and cooked shrimps
  - serve with chili oil and chopped spring onion greens
