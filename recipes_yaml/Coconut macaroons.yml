directions:
    step:
    - Beat the egg whites until they are stiff.
    - Add the sugar gradually.
    - Mix the ground hazelnut and grated coconut, then add to the egg mixture.
    - On a baking tray covered with grease proof paper, form into little balls with
        a teaspoon (or use a pastry bag)
    - Bake 150° for 15-20 mins
