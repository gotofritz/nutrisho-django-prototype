cuisine: .indian.kerala
description: Best described as South Indian comfort food, sambhar is a kind of thickened,
    spicy vegetable and lentil broth that is served with various rice and semolina
    preparations such as upma, pongal and as a dip for idli and dosas. A good sambhar
    should sing with ginger and feel comforting and nourishing. I prefer to make sambhar
    the Keralan way which is thicker while the people of Tamil Nadu favour a thinner,
    more watery sambhar. Sambhar only improves with age so any leftovers will taste
    even better the next day.
directions:
    step:
    - Rinse the dal well, drain it and place in a pot with the water and turmeric.
        Bring the dal to a boil, then partially cover and reduce the temperature to
        a simmer. Simmer the dal for an hour or until it is tender.
    - Warm a wide frying pan on medium heat and add the spices, coconut, and chilies.
        Stir the mixture constantly for 5 minutes until the coconut has become dry
        and has a toasted, golden colour. Place the mixture in a mortar and pestle
        and grind to a powder.
    - Heat the oil in a large pot on medium heat. Add the mustard seeds and curry
        leaves and cook for a minute until the seeds begin to pop. Add the onion and
        carrots and saute for 5 minutes stirring occasionally until the onion is soft.
        Add the aubergine, okra and salt and cook for a further 5 minutes. Add the
        dal mixture, the ground coconut and spice mixture, and the 300 mls of water
        and bring to a simmer. Simmer partially covered for 30 minutes or until the
        vegetables are tender and the mixture is thickened but still slightly soupy.
    - Meanwhile, make the tamarind water. Place the tamarind pulp in a small bowl
        and pour over the boiling water. Set aside for 20 minutes, then rub the pulp
        between your fingers until the texture of the water is thick - similar to
        ketchup.
    - Pour the tamarind and water through a fine mesh strainer with a bowl underneath
        to catch the liquid. Press down on the tamarind fibres to extract as much
        flavour and liquid as possible, then discard the tamarind pulp.
    - Stir the tamarind water into the sambhar. Check the consistency of your sambhar,
        if it is too soupy and you prefer it thicker simmer it for a further 5-10
        minutes until it is thickened.
    - Remove the sambhar from the heat allow it to cool slightly before serving. Serve
        the sambhar in shallow bowls to accompany rice, idli, dosas or other grains.
