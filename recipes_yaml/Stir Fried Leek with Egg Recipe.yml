directions:
    step:
    - 1. Crack egg in a bowl, add soy sauce,,stir and mix well(make sure egg white
        and egg yolk mix evenly).
    - 2. Clean leek, drain well, chop
    - 3. Heat oil in a wok over high heat,slip egg liquid,change heat to low. Sway
        egg making the liquid spread on the bottom of the wok evenly.Stir into blocks
        when the liquid becomes solid.
    - 4. Add five species powder,the rest salt, leek section,stir fry 2mins,or until
        leek becomes soft.
    - 5. Turn off heat,arrange in a plate,serve.
