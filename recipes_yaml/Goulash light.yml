cuisine: .hungary
description: A light, easy version of the Hungarian-American recipe
directions:
    step:
    - In large pressure cooker sauté the vegetables in generous butter and oil until
        wilted, 10 mins
    - Turn up heat, and start adding meat a bit at the time to scorch it, and stir
    - Lower heat and leave 5 mins
    - Add water, caraway seeds, and pressure cook 30 mins (depending on toughness
        of meat)
    - Prepare a slurry by mixing the flour, paprika and a bit of water
    - Open the pressure cooker. Add the slurry, tomato, water, parsely and bay leaf
        tied together, potato, to the stew and cook another 20 mins
    - Before serving warm up the butter and add paprika, stir a bit and add to soup
