directions:
    step:
    - Tip in the peas and simmer for another 5 minutes or until tender (frozen peas
        will only need a couple of minutes once they come back to a simmer). Add the
        lovage and immediately take off the heat.
    - Whiz the mixture in a blender until smooth, then taste. Adjust the seasoning
        and blend in some more lovage if you think the soup needs it. Pass through
        a sieve if you wish (some blenders do a better job than others). Serve hot
        or cold.
