cuisine: .british.traditional
description: Classic light sponge cake, normally done with self raising flour but
    this is without.
directions:
    step:
    - Grease a 20 cm baking tin. Sprinkle a bit of flour over it and shake it, to
        ensure the flour covers the tin evenly. Once covered, shake off excess flour
        over the sink.
    - Beat the eggs
    - Cream together the sugar and butter at room temperature, then add the beaten
        egg.
    - Mix the flour, baking powder, and salt, and sift into the mixture, mixing as
        you add it.
    - Spoon the cake mixture into the greased baking tin, and bake at 180° for 20
        mins
    - Cool over a rack, then slice in half and fill with jam and whipped cream
