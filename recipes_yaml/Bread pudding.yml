cuisine: null
description: I've been a big fan of bread pudding since I was a kid. It was commonly
  found in local bakers and in my gran's larder.
directions:
  step:
  - Bring milk, cream, sugar, vanilla pod cut lengthways and seeds scraped to boil
  - Switch off heat and let cool
  - Butter the bread, and stack into oven dish
  - Beat the eggs and add them to milk mixture.
  - Pour milk mixture over bread in oven dish. Put dish in fridge overnight
  - Put little chocolate chips or sultanas into the pudding
  - Put oven dish into large baking tray. Fill baking tray with hot water, to make
    a bain maire
  - Bake 40 mins at 175°
