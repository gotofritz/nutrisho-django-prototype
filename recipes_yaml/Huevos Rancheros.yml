directions:
  '#text': '>










    >'
  step:
  - grill tomatoes, chilies, about 10 cm away from a hot grill until blistered, then
    turn, about 6m
  - Cool the vegetables, then coarsely chop them in a food processor with their juices
  - "saut\xE9 onion in oil on medium heat until brown, about 10m"
  - Increase heat, when hot add tomato chili mixture, until it sizzles, about 5m
  - Add chicken stock, gently simmer until thick (but not too thick), about 15m
  - Season
  - Meanwhile prepare or reheat the tortillas, and fry the eggs sunny side up eggs
    in oil
  - Place two of the tortillas on each plate, then slide the eggs on them.
  - Spoon the sauce over the eggs, garnish with coriander, onion, mexican cheese
