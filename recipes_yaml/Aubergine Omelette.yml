cuisine: .iranian
description: Kuku is an Iranian omelette. Barberries (zeresh) are extremely sharp
  berries, and can be replaced with lemon juice.
directions:
  step:
  - Sauté the onion on medium low until soft
  - Add the aubergines and cook for another 10 mins, then cool
  - Beat together the egg mix, season, and when smooth add the aubergines and barberries
    or lemon juice
  - Bake in a greased 22 cm sponge cake tin, lined with greasedproof paper, for 30-40
    mins at 190°
  - Serve warm or cold. Keeps for two days in the fridge
