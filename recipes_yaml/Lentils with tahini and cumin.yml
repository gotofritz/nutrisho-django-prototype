cuisine: .vegetarian
description: This sustaining meal-on-a-plate is a little bit like hummus, though much
  easier and quicker to prepare. With warm flatbread, I could eat this every day.
  Serves two as a main, or four as a starter.
directions:
  step:
  - Cook the lentils for 15 - 20 mins in boiling water
  - Sauté garlic and cumin in a butter and oil mixture, on medium high, for a minute
    or so
  - Add tomatoes, coriander, and the cooked lentils. Cook, stirring, for 2 mins
  - Add tahini, lemon juice, water, salt and a good grind of black pepper. Turn down
    the heat to medium and cook gently, stirring, for a few minutes more, until hot
    and thickened.
  - Roughly mash the lentils with a potato masher, so that some are broken up and
    you get a thick, porridge consistency.
  - Spread out the lentils on a flat platter, scatter on the sliced onion, the remaining
    coriander and a final drizzle of olive oil. Serve warm with poached eggs on top.
