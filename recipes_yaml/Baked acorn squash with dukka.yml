cuisine: null
description: A great veg starter, but also a great side dish with roast chicken, lamb
    or sausages. Serves four as a side dish.
directions:
    step:
    - Preheat the oven to 180C/350F/gas mark 4. To make the dukka, warm the cumin
        and coriander in a small pan over a medium heat until they just begin to release
        their fragrance, then bash using a pestle and mortar until broken up but not
        too fine. Put the sesame seeds into the spice pan and warm until just golden.
        Add these to the spice mix, along with the hazelnuts, chilli and salt. Bash
        again until the nuts are broken up into small pieces, then stir in the mint.
    - Peel the squash, cut it into thick wedges and remove the fibres and seeds. Tip
        the squash into a bowl with the olive oil and toss until well covered. Add
        three to four tablespoons of dukka and toss again. Tip into a roasting tin
        and bake for 35-45 minutes, until soft and fragrant. Just before serving,
        sprinkle over a little more of the dukka.
