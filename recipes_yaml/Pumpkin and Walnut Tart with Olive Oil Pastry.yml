cuisine: .jewish.thessaloniki
description: From Thessaloniki, an area with large Jewish population
directions:
  step:
    - Bring the water, salt, and oil to boil.
    - Remove from heat and work in the flour until you have a stiff dough.
    - Knead on a floured surface for about 10 mins, then split into two balls and leave
      to rest, covered, for 30 mins.
    - Cook the pumpkin in water, in a pot or microwave.
    - In a pot add the remaining filling ingredients and a bit more water. Cook for
      a short while until all amalgamated.
    - Grease two pastry tins with olive oil. Roll the pastry and line the tins with
      it. Prick with a fork.
    - "Spoon the filling into the pastry and bake 180\xB0 for 30 mins or so."
