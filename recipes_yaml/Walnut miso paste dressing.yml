cuisine: .japanese
description: Just mix a little bit with boiled vegetables
directions:
  step:
  - Dry roast the walnuts until you can smell them
  - 'OPTIONAL: put them in a paper towel and rub them to remove most of the skin'
  - Whizz in a food processor until fine
  - Mix in the remaining ingredients
  - Store in fridge for up to a week
