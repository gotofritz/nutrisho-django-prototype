      preparation: null
      quantity: '1'
    - measurement: tbsp
      name: mirin
      preparation: or sake and more sugar
      quantity: '1'
    - measurement: tsp
      name: sugar
      preparation: null
      quantity: '1'
    name: null
  serves: '8'
