cuisine: .british
description: Old fashioned, plain British cake
directions:
  step:
  - Beat the butter with the caster sugar until light and creamy
  - Add the eggs one by one, beating each in well
  - Fold in your ground almonds, poppy seeds, the lemon zest and juice and the sifted
    flour.
  - Spoon the mix into the prepared cake tin
  - "Bake at 180\xB0 40 minutes or until lightly golden"
  - Make your lemon syrup by heating the sugar and lemon juice in a pan until the
    sugar has dissolved.
  - While your cake is still warm, make lots of little holes in the top with a cocktail
    stick and pour your syrup over
  - Sift the icing sugar into a bowl and add the lemon zest and juice, stirring until
    smooth
  - When your cake is almost cool, put it on a serving plate and pour the icing carefully
    over the top
