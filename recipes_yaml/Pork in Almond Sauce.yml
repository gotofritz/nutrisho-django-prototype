cuisine: .spain.andalusia
description: Main or tapas. This is an Andalusian version
directions:
  step:
  - Fry almond and bread in olive oil, until golden, 3 m
  - Remove from oil with slotted spoon, set aside on kitchen paper
  - Sautè the pork in the same oil a little
  - Add all meat ingredients, season, and simmer for about 1 hr
  - Take onion and tomato and 4 tbsp sauce from pot and put in foot processor
  - Add fried bread, 4 cloves garlic and whizz
  - Add back to meat, season and cook for another 20 m, adding water if too dry
