cuisine: .spain.andalusia
description: Main or tapas. This is an Andalusian version
directions:
  step:
  - Fry almond and bread in olive oil, until golden, 3 m
  - Remove from oil with slotted spoon, set aside on kitchen paper
  - "Saut\xE8 the pork in the same oil a little"
  - Add all meat ingredients, season, and simmer for about 1 hr
  - Take onion and tomato and 4 tbsp sauce from pot and put in foot processor
  - Add fried bread, 4 cloves garlic and whizz
  - Add back to meat, season and cook for another 20 m, adding water if too dry
ingredients:
  group:
  - ingredient:
    - measurement: g
      name: almonds
      preparation: not peeled
      quantity: '50'
    - measurement: g
      name: white bread
      preparation: no crust, roughly diced
      quantity: '50'
    - measurement: cloves
      name: garlic
      preparation: peeled
      quantity: '4'
    name: Sauce
  - ingredient:
    - measurement: kg
      name: pork shoulder
      preparation: diced 2cm
      quantity: '1'
    - measurement: head
      name: garlic
      preparation: cut in half widthways
      quantity: '1'
    - measurement: tsp
      name: sweet paprika
      preparation: null
      quantity: '1'
    - measurement: small
      name: onions
      preparation: halved
      quantity: '2'
    - measurement: large
      name: tomato
      preparation: halved
      quantity: '1'
    - measurement: leaves
      name: bay
      preparation: null
      quantity: '2'
    - measurement: ml
      name: white wine
      preparation: null
      quantity: '400'
    name: Meat
  serves: '4'
source: Moro 2
tags:
