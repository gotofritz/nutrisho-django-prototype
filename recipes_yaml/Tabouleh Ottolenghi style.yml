cuisine: .middle east.lebanon.traditional
description: This is a parsely salad, which should be prepared by chopping with a
  knife and not with a food processor
directions:
  step:
  - Wash the bulgur under the tap, then pour into a bowl
  - Dice the tomatoes 0.5 cm and add to the bulgur with the juices
  - Add the remaining ingredients, season and mix
  - Serve at room temperature
