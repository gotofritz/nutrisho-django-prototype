cuisine: .usa.traditional
description: Only works on grills
directions:
  step:
  - Purè marinade ingredients in food processor
  - Put chicken in a bowl, cover with half the marinade, stir and cover in cling filmd
  - Chill 2 hours
  - Dry the chicken with paper towels so that it doesn't drip, then grill
  - Use the other half of the marinade to baste as it cooks, 35 mins (or depending
    on chunks sizes)
