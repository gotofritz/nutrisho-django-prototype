cuisine: .chinese
description: Ant climbing a tree / Mayi shang shu
directions:
    step:
    - soak the fungus, 30m (2) put noodles in pot, pour boiling water over it, steep
        10 m (3) coarsely mince pork, then marinade 10 m
    - chop drained mushrroms, spring onions
    - stir fry pork, mushrooms for 1 m (6) add spring onions, 80ml water, bean sauce,
        20 s (7) lower heat, 3 m (8) add noodles, sichuan pepper, chili oil to taste,
        2 m
