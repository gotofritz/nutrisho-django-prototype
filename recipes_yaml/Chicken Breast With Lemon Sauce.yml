cuisine: .chinese.sichuan
description: Kipurou Ningmengjiang
directions:
  step:
  - cut chicken in strips and marinade at least 20 m, turning occasionally
  - coat the chicken with first lot of cornstarch
  - make batter with other cornstarch and remaining ingredients (use water if too
    thick)
  - coat chicken and deep fry in really hot oil, 5m
  - remove oil, wipe wok, pour back 2 tbsp oil
  - put sauce ingredients minus cornstarch into wok, bring to boil, then reduce, 30s
  - add cornstarch, 30 s
  - pour over chicken and serve
