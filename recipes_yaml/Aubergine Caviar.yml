directions:
    step:
    - Preheat the oven to 170C. Prick the aubergines all over with a fork and place
        in the oven. Roast for 30 minutes or until very tender.
    - Place the aubergines in a colander and leave to cool. When the aubergines are
        cool enough to handle, tear them open and scoop out the flesh with a spoon.
        Discard the skins and place the flesh in a colander for 20 minutes to allow
        some of the watery juices to drain.
    - Warm the olive oil in a large sauté pan over medium heat. Add the tomato paste
        and cumin and sauté until dark-coloured. Add the shallot and aubergine pulp
        and continue to sauté until almost dry and very little liquid remains. Blend
        in a food processor until smooth and add the cold butter. Season well to taste
        with the salt and pepper.
