directions:
    step:
    - boil green lentils for 15m
    - add broccoli for 5m
    - whizz until smooth
    - sauté carrot, onions in olive oil medium high
    - sweat white wine until evaporated, about 2m
    - add the purée, season and simmer on low heat
    - cook in abundant salted water linguine
    - mix with sauce and serve
