directions:
  step:
  - combine chicken breast, egg white, cornstartch and let stand, 10m
  - squeeze the ginger through a muslin into the ginger, rice wine. Keep 1 tsp of
    the ginger
  - Deep fry the chicken, then stir fry with the dried mushrooms, 20s
  - Add hoisin sauce, yellow bean paste, stir until warm, serve.
