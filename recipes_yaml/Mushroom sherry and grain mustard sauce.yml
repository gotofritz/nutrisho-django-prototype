cuisine: .british
description: Steak sauce from Gordon Ramsay
directions:
  step:
  - Sauté the mushrooms, garlic and thyme, stirring
  - Pour in 100 ml sherry and reduce, 3 minutes
  - Add the vinegar and reduce a few seconds more
  - Add 50 ml sherry and stock, bring to boil, simmer for 3 minuts
  - Renove garlic and thyme, and mix in crème fraîche and mustard
  - Add parsley and steak juices before ladling over a steak
