directions:
    step:
    - preheat oveh 200°C
    - tie up pork loin with 2 or 3 pieces of string, any way, then season and roll
        in the fennel seeds
    - fry the meat on stove in butter + olive oil until golden, couple of mins
    - add the garlic, herbs, fennel, wine, cover cook loosely with some wet greaseproof
        paper and cook in oven until a meat thermometer in meet shows 66°C, about
        1hr
    - remove meat and rest on a plate, then away from heat stir in butter and make
        gravy, scraping bits off the bottom
