directions:
  step:
  - deep fry chicken, potatoes, and shallots separately, pat dry
  - put the chicken in a pan and just cover with coconut milk, and bring to boil
  - add cardamom pods, peanuts, bay leaves, 10 mins
  - add the potatoes an onions
  - in another pot cook coconut cream and curry paste, low heat, 10 m. use juice from
    (4) if it gets too dry
  - when dry, add sugar until caramelized
  - add fish sauce and tamarind water
  - add (7) to (4), add the pineapple / apple juice, and serve
