cuisine: .mexico.traditional
description: A mexican lent recipe. Original seem to include cream / condensed milk
directions:
    step:
    - Oven 180°
    - 'If using dried chickpeas, soak overnight (optional if using pressure cooker)
        and boil: 1hr in normal pot if soaked or pressure cooker unsoaked, 30mins
        pressure cooker if soaked'
    - Drain chickpeas, rub them in colander to remove skin
    - Whiz in food processor
    - Beat eggs in a bowl, mix in remaining ingredients and chickpea paste
    - Pour into a greased and lined baking tin, bake 1.5h at 180°
    - Cool 10 minutes in tin, then remove and sprinkle cinnamon sugar and let cool
        completely
