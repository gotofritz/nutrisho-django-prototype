directions:
  step:
  - Cream sugar and butter in a bowl, then mix in peanut butter until smooth
  - Sift over the flour and knead into a ball. Rest in the fridge, covered in cling
    film, for 15 mins
  - Roll out the dough and cut 24 biscuits. Put on baking tray and chill 15 mins
  - Bake at 170° for 12 - 15 mins.
  - Cool for 5 minutes, the place in a rack until room temperature
  - For the caramel, heat sugar and caramel until boiling and golden
  - Remove from heat and add butter, then cream
  - Simmer for another minute then add the peanuts and let cool
  - USe the caramel to create biscuit sandwiches
  - Melt the chocolate in a bowl over boiling water, then drizzle over the biscuits
