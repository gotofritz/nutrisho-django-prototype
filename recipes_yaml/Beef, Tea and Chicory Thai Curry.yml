cuisine: .thai
description: Originally made with cassia leaves, which need blanchin 3-5 times from
  a cold start. Go well with pickled red shallots, steamed eggs, and grilled fish
directions:
  '#text': '>







    >'
  step:
  - Make curry paste by putting all ingredients one by one in mortar, or food processor
  - Grill the beef until rare on both sides and set aside
  - Reduce coconut cream, 5 or 6 mins stirring regularly, then add 3 tbsp curry paste,
    6/7 mins.
  - Add the palm sugar, a few minutes until darkened, and the fish sauce, a few more
    minutes
  - Add the coconut milk / stock, and the tea.
  - Slice the beef, ginger, and chicory. and add to the curry with lime leaves
