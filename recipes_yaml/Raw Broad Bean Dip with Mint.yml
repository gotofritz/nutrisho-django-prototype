cuisine: null
description: This vibrant-coloured dip is a delicious and interesting way to eat broad
  beans. It can be served either as a dip or spread, or it can be loosened by adding
  more olive oil and used as a raw, pesto-like sauce for pasta.
directions:
  '#text': '>'
  step:
  - Shell the beans and then peel off the white skin on each bean by digging your
    thumbnail or the tip of a sharp knife into each bean to break the skin and then
    peel it off.
  - Place the beans and garlic in the bowl of a food processor or a mortar and pestle
    and process to a coarse puree. Scrape into a bowl and fold in the parmesan, lemon
    juice and zest, mint and olive oil. If you want a thick coarse dip or spread use
    less oil - if you want to use it as a sauce for pasta - use a little more. Add
    salt and pepper to taste and serve.
