directions:
    step:
    - 'for acid butter: take butter out of friedge a couple of ours before hand cut
        onions in small chunks, and reduce in the liquids at very low fire until halved
        discard onion, mix 2 tsp of mixture into butter until creamy'
    - 'stock: put ingrendients in pot, bring to boil, the salt lightly and simmer
        at very low temperature until tasty'
    - hard boil eggs, then sieve yolks to create a dust. Use whites for another dish
    - cook the asparagus 5-10 mins in the stock (if feasible), or water, then take
        out and chill
    - cut tip off asparagus and put aside, and puré stalks into a cream
    - 'prepare risotto as per normal: on high fire sauté onion in butter, stir in
        rice, add wine and when evaporated add asparagus cream, then ladle in warm
        stock bit by bit. Salt when almost ready.'
    - fluff up with butter (or acid butter if using) and parmesan, add asparagus tips
        and leave covered a couple of mins away from fire
    - serve with the egg yolks
