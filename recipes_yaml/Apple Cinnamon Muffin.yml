directions:
  step:
  - In a mixing bowl, whisk together the flours and dry ingredients
  - Beat in the wet ingredients and brown sugar/agave until smooth
  - Add more apple juice a tablespoon at a time, as needed to make a smooth batter
  - Stir in chopped fresh apple
  - Spoon the batter into twelve muffin cups. Sprinkle with raw sugar, if desired,
    for a crunchy top
  - Bake in the center of an oven preheated to 180° until firm and golden - about
    20 to 25 minutes or so
  - Test with a wooden pick if you need to. Remove the muffins from the pan and cool
    on a wire rack
