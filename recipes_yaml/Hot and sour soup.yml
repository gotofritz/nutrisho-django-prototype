cuisine: .chinese.sichuan
description: Suan La Tang
directions:
  step:
  - marinate meat 10 m
  - cover bean curd in water 10 m
  - drain mushrooms, keep 250 ml of water, sieved and julienne mushrooms and add to
    it
  - add stock, bamboo shots, ginger, marinated meat, dark soy sauce, vinegar, chili
    oil, salt , pepper
  - bring to boil and simmer 2 m
  - stir in cornstartch mixture 2 m
  - stir in drained bean curd and squid, 1 m
  - add egg in thin stream, then remove from fire and let stand 20 s, then stir lightly
  - add garnish and serve
