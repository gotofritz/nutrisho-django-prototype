cuisine: .italian
description: The percentage of stock and passata can vary - you can make it with no
  passata or no stock, or any ratio of the two
directions:
  step:
  - soak cannellini beans overnight, then change water and cook with a pinch of bicarbonate
    10 mins high heat and 40 mins medium low
  - sauté the onions in olive oil at medium-high heat until caramelized, like hot
    dog onions, 10m. Add rosemary or other herbs if using
  - Meanwhile cook the pasta as normal
  - if using bacon / sausage, add and saute another 3 mins, and add chilli powder
    for last 30 secs. Otherwise add chopped chilies 3m
  - sweat with white wine if using, 2 mins then add a third of the beans and mash
    with a fork, then add the remaining beans and the passata if using
  - keep cooking adding a bit of pasta water every so often to keep liquid, or stock
    if using
  - when the pasta is ready season sauce with salt and pepper and add pasta to it.
    Sprinkle teared basil leaves on it and serve
