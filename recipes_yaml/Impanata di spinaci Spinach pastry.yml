directions:
    step:
    - dissolve in 320 ml water, warm, 5m
    - add flour bit by bit and knead, 10m
    - rest in greased bowl, covered in kitchen towel until doubled in size, 2h
    - sauté in 2 tbs oil, olive on hot until just golden, 1m
    - sauté until just wilted, 3m
    - Drain, squeeze well keeping the water, and chop corasely
    - (if using) soak in spinach water, 10m
    - drain and add to chopped spinach
    - add chili powder if using
    - add olives, mozzarella if using
    - If using sausage, sauté in 2 tbs oil, olive on med, 4m
    - add until until seared, 2
    - Mix all the fillings together in a bowl
    - Roll out dough as thin as possible, smear oil over it, lay the stuffing over
        it. Start rolling, smearing more oil between layers of dough
    - Bake until ready on 190°, 35m
