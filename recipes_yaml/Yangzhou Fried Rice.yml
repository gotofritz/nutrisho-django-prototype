directions:
  '#text': '>







    >'
  step:
  - soak 3 tbsp dried shrimps in 125 ml boiling water for 10 m, then drain keeping
    the water
  - add 440ml water to prawn water if using or 500ml water if not, and cook 330g rice
    in it for 16m
  - blanch 90 g corn kernel and 75 g peans for 2 m
  - fry 2 beaten eggs without stirring until lightly set, then break up with spatula
    and set aside
  - 'stir fry, high heat: 90 g diced ham or bacon, 60 g diced onion 1 chili, then
    set aside'
  - when rice is ready, stir fry shrimps, ham, egg, veg, 1 tbp soy sauce then add
    the rice and cook until done
