cuisine: null
description: Black beluga lentils are similar to Puy lentils but they are grown in
  the cool climate of America's Northern plains. Some lentils tend to go murky when
  cooked but these beauties keep their remarkable satin-black colour.
directions:
  step: Gently cook the onion, ginger, garlic, chilli and spices in the butter for
    3-4 minutes, add the vegetable stock and lentils, season, bring to the boil and
    simmer for 40 minutes or until the lentils are soft. Blend about one-third of
    the soup in a liquidiser until smooth and return to the pan. Adjust the seasoning
    if necessary and add the coriander. Serve with half a spoonful of yoghurt on top.
