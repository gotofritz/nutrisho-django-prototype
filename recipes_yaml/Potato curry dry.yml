directions:
    step:
    - dice potatoes 1.5 cm, chop the coriander, peel the ginger and chilli
    - sautè spices (not assafoetida) in ghee until they begin to brown 2m
    - add assafoetida if using a few secs
    - add the potatoes, sautè until browned, a few mins
    - add ground spices, and sprinkle stock or water
    - stir, put heat on low, cover, cook stirring only once or twice for 15 m
    - uncover, add garam masala if using, salt to taste, chopped herbs, and serve
