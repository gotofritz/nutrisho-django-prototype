directions:
    step:
    - Pressure cook dal 8 mins with turmeric
    - Add salt and whisk well
    - Make the spice paste in mortar
    - Fry onion and cumin seeds for a couple of mins
    - Add paste, spices for a few seconds, then remaining veg for a couple of minutes
    - Add dal and water, cook on low a few mins
