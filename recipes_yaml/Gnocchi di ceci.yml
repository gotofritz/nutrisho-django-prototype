cuisine: .italian
description: Chickpea gnocchi with wild mushrooms
directions:
    step:
    - boil the chickpeas until cooked, then put in a blender with a bit of the water
    - add the boiled potatoes to the chickpeas
    - add the flour and 1 egg yolk, make into a dough
    - roll out into tubes, cut into small pieces, use a forc to make gnocchi
    - sautè onion, garlic, rosemary and bay leaves
    - add the wild mushrooms and sautè
    - boil water with sage in it for 10 mins, then cook the gnocchi in it
    - toss in sauce, add a bit raw olive oil, serve
