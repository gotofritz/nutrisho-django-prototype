directions:
  step:
  - Mix all ingredients together and knead into a smooth dough
  - Form into individual walnut sized balls
  - Place on a baking tray lined with greaseproof paper and lightly flatten with a
    fork
  - "Bake 10 mins at 180\xB0"
  - Cool on a wire rack for 10 mins
  - Dust with icing sugar
