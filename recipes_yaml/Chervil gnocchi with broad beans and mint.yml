directions:
  '#text': '>'
  step:
  - Preheat the oven to 200C/400F/Gas6. Put a small pan of water on to boil, ready
    to test the gnocchi. Bake the potatoes, unpeeled and whole, on a bed of rock salt
    for about an hour. While still hot, scoop out the insides from the skin and press
    through a sieve. Set aside to cool. When the potato feels warm, rather than hot,
    mix in the chervil, egg, flour, nutmeg and salt. Knead into a fairly firm dough,
    adding more flour if necessary. To test the consistency, pull off a small piece
    and blanch in the boiling water for 4-5 minutes until it floats. If it breaks
    up, add a little more flour to stiffen the dough. Roll the dough into two sausage
    shapes, about 2cm/3/4-inch in diameter. Roll through flour and cut into 2.5cm/1-inch
    pieces that look a bit like little pillows. Pinch each one lightly in the middle.
    Set aside in the refrigerator.
  - To make the broad bean and mint sauce, blanch the beans in a saucepan of lightly
    salted boiling water for four minutes and refresh under cold running water. Drain,
    then squeeze all the bright green beans out of their grey-green skin.
  - Bring a large saucepan of lightly salted cold water to the boil. Heat the olive
    oil in a large heavy-based saucepan and fry the chilli and garlic over a low heat
    for 3-4 minutes. Throw in the skinless broad beans and mix well. Turn up the heat
    and pour in the wine, stirring vigorously. Let the wine evaporate before adding
    the butter and lemon juice and rind. As soon as the butter has melted, pour the
    stock into the sauce, whisking well to blend and emulsify. Season to taste.
  - Drop the gnocchi into the boiling water and cook for abut 2-4 minutes until they
    float to the surface. Drain and stir into the sauce, giving the gnocchi a chance
    to absorb the flavours. Check the seasoning and adjust if necessary.
  - Serve immediately with Parmesan, a sprinkling of mint and a drizzle of extra-virgin
    olive oil.
