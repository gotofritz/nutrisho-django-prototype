directions:
    step:
    - Heat the oven to 160°C fan (180°C/gas 4). Grease muffin tin.
    - Beat the eggs in a large bowl, then add the carrots, oil, sugar, and walnuts.
        Mix well.
    - In a separate bowl, combine the flours, baking powder with the cinnamon.
    - Gently stir the two mixtures together until half combined.
    - Heat milk (40 seconds in Microwave) Add to cake mix Do not overmix.
    - Pour the mixture into the cake tin and bake for 15-20 minutes.
