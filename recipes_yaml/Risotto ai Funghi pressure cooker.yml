cuisine: .med.italy
description: North Italian staple, changed for maximum umami. The pork sausage is
  not traditional, but can add proteins.
directions:
  step:
  - Slice the mushrooms and sauté them in a separate pot in an oil + butter mixture,
    until the liquid is evaporated, 5-6mins
  - Add the aromatics to the mushrooms and keep stirring until they are wilted, 3-4mins
  - Add the risotto rice to the mushrooms and stir fry to toast it, 2mins
  - If using, add the wine mix to the risotto and mushrooms and stir constantly until
    evaporated, 3-4m
  - Add the pressure cooker stock ingredients, close and bring to pressure. Then cook
    4 mins
  - Remove from heat, add the mantecatura ingredients and stir carefully but vigorously
    for a 30 secs
  - Cover and let it rest a couple of minutes, then serve
