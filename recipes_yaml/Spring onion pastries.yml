cuisine: .chinese
description: You Yuan
directions:
  step:
  - Sift flour into a bowl, make a well in the middle, and pour 250ml boiling water
  - Work quickly into a dough
  - Make a ball and brush lightly with sesame oil. Rest covered 5m
  - Knead some more until rubbery, rub with more sesame oil, place in plastic bag
    1hr
  - Roll into a log 25 cm long and split into 6
  - Roll each into a very thin 18 cm disk, rub with sesame oil, sprinkle salt, add
    3 chopped spring onions each
  - Roll into a cigar, twist into a tight coil, the flatten into a 13cm disk
  - Shallow fry 3m on each side
