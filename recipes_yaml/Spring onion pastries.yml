cuisine: .chinese
description: You Yuan
directions:
    step:
    - sift 315g flour into a bowl, make a well in the middle, and pour 250ml boiling
        water
    - work quickly into a dough
    - make a ball and brush lightly with sesame oil. rest covered 5m
    - knead some more until rubbery, rub with more sesame oil, place in plastic bag
        60m
    - roll into a log 25 cm long and split into 6
    - roll each into a very thin 18 cm disk, rub with sesame oil, sprinkle salt, 3
        chopped spring onions each
    - roll into a cigar
    - twist into a tight coil
    - flatten coil into a 13cm disk
    - shallo fry 3m oin each side
