directions:
  step:
  - Sauté the garlic for 2 mins in olive oil, on medium heat.
  - Add the remaining ingredients and cook on low for 50 mins or so until the barley
    is tender but still al dente. Add water from tine to time to keep it moise
  - Put in bowls and scatter the garnish ingredients on top
