cuisine: .chinese
description: Zhiima Lianzi Qiu, typical Moon Festival
directions:
    step:
    - Make a dough on slightly oiled surface, and knead into a 40 cm long log, and
        then into 15 balls 2.5 cm large
    - Roll out into 6 cm disks.
    - Divide lotus paste into 15 and rol into little balls, and place on center of
        disk. Draw dough around lotus paste to form a ball.
    - Spread sesame sees on a plate and roll the balls over them to coat them
    - Deep fry the balls 165° for 2.5 mins
