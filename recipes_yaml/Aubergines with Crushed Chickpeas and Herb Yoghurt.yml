cuisine: .mediterranean.modern
description: Ottolenghi side dish / starter
directions:
    step:
    - Oven 250°
    - 'If using dried chickpeas, soak overnight (optional if using pressure cooker)
        and boil: 1hr in normal pot if soaked or pressure cooker unsoaked, 30mins
        pressure cooker if soaked. Keep cooking liquid'
    - Mix aubergine marinade in bowl, toss aubergines in it to coat, then spread in
        one layer on lined baking tray. Put a tray with water at bottom of oven to
        keep moisture, and bake aubergines 40 mins. Let cool
    - Mix chickpea ingredients with 2 tbsp chickpea cooking water, salt and pepper.
        Mash roughly with potato masher to a paste, adding more cooking liquid as
        needed
    - Whiz the yoghurt ingredients, salt and pepper. It should be just runny
    - Layer chickpeas on plate, put chickpea paste on top, and drizzle yoghurt dressing
