directions:
  '#text': '>









    >'
  step:
  - Preheat oven to 175C, lightly brush a 9 inch springform pan with olive oil.
  - Warm the milk and stir in the honey to dissolve. Whisk together the olive oil,
    orange zest, and egg yolks
  - Combine the toasted pine nuts, flour, baking powder and salt in a bowl. Add to
    the milk mixture (2) and stir well to make a batter.
  - Whip the egg whites using a hand mixer to soft peaks and fold the egg whites through
    the batter using a spatula.
  - Pour half the batter into the pan, scatter with the rosemary, add the other half
    of the batter, and drizzle with a little olive oil.
  - Place the cake in the oven and bake for 30-35 minutes until the cake is set and
    a toothpick inserted into the centre comes out clean.
  - Allow to cool for 10 minutes, then turn out and cool on a rack.
  - Dust with icing sugar and serve with a dollop of creme fraiche.
