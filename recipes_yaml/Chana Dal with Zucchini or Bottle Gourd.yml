cuisine: .indian.uttar pradesh
description: Louki Chana Dal. Can also be done with yellow split peas
directions:
  step:
  - 'NORMAL POT: Soak dal 5 hours, then drain and rinse'
  - 'NORMAL POT: bring to boil dal and water over high heat, and cook for 10 mins,
    skimming'
  - 'NORMAL POT: Lower heat and add ginger, coriander, turmeric, and ghee to water
    and dal, and cook on low heat for 1.5 hrs with a tight fitting lid'
  - 'PRESSURE COOKER: mix all dal ingredients in a pot and cook for 20 mins. Put the
    steamer in the pot to stop dal from exploding'
  - "While the dal is cooking, saut\xE8 the zucchini chunks with added salt, on high\
    \ heat in oil and butter, in a covered pot, shaking vigorously for 8-10 mins,\
    \ until charred and cooked through"
  - Remove from heat and mix in garama masala and chopped chillies
  - When the dal is cooked, add a bit more butter and reheat the zucchini. When the
    butter is melted add the cumin seeds, and when they sizzle add assafoetida and
    curry leaves.
  - Pour after a couple of seconds into the dal
  - Add lemon juice, salt, and chopped herbs, let stand a covered a couple of minutes,
    and serve
