directions:
    step:
    - Sautè the onion for a couple of minutes, then add salt and the veg and carry
        on sautéing for 7-8 mins
    - Add the quinoa, lemon zest, stock
    - Cook until the water has been absorbed and the quinoa is cooked
    - 'OPTIONAL: cook some mince in oil on the side, and add it to the cooked dish'
