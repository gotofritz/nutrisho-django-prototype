cuisine: .chinese.beijing
description: Siche Bai Ji Sela
directions:
    step:
    - put chicken ingredients in cavity, marinate in fridge 1 hr
    - tie chicken, making a handle
    - boil water, dip chicken 5 times, 1 m each, then lift out
    - drain
    - fill a pot with cold water and ice cube, then dip chicken in it 1 m
    - make a pot for re-boiling chicke, do the 5 time dipping again, this time afterwards
        leave in and bring to boil
    - remove pot from heat but leave chicken in, 25 30 m. Test if cooked by inserting
        skewer in tights, no coloured juoices should come out
    - remove and leave to cool
    - mix sald ingredients, rubbing them in together, and stand 20 m
    - make dressing by mixing all ingredients
    - only use the breast of the chicken. shred with your finger in thin strands then
        coat in sesame oil
    - serve over the salad with the dressing on top
