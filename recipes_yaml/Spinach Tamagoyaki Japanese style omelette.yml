        -   measurement: tsp
            name: soy sauce
            preparation: null
            quantity: '0.25'
        -   measurement: pinch
            name: sugar
            preparation: null
            quantity: null
        -   measurement: tbsp
            name: oil, veg
            preparation: null
            quantity: '0.25'
        name: Egg
    serves: 1
