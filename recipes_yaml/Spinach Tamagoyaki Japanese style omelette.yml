            name: onion
            preparation: chopped finely
            quantity: '0.25'
        -   measurement: clove
            name: garlic
            preparation: chopped finely
            quantity: '0.12'
        name: Spinach
    -   ingredient:
        -   measurement: large
            name: eggs
            preparation: null
