directions:
  step:
  - Preheat the oven temperature to 160C.
  - Place the pistachios in a food processor and process until finely ground. Add
    the remaining ingredients and process until smooth.
  - Pour the batter into a prepared 8 inch cake tin and bake for 35-45 minutes or
    until a skewer inserted into the centre of the cake comes out clean. Remove the
    cake and allow to cool for 10 minutes, then turn out onto a rack and cool to room
    temperature.
  - Cut the cake into wedges and serve with a dollop of the creme fraiche.
