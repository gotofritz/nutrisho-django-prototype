directions:
    step:
    - Combine the initial dough ingredients in blender and mix until smooth
    - Add the remaining ingredients and finish off
    - Line a steamer with heavily greased parchment paper, and pour mix inside
    - Steam for 30 mins over simmering pot, then cool for 5 mins and serve
