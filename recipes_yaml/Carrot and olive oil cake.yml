directions:
  step:
  - Beat the eggs and add olive oil and sugar. Stir until well mixed
  - In another bowl sift the flour and dry ingredients, make a well in the middle
  - Add the egg mixture to the well in the sifted flour, mixing well
  - Add the walnuts and carrots
  - Line a 24 cm cake tin with baking paper, grease lightly and dust with flour.
  - Pour in the cake mixture
  - "Bake for 80 mins at 170\xB0, then cool in the tin"
  - Mix the butter, vanilla, and mascarpone
  - Add the icing sugar gradually
  - Use the mixture to ice the cake
