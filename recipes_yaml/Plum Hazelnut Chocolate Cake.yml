cuisine: .british
description: Moist
directions:
  step:
  - Butter and line the base of a 20cm cake tin
  - Beat the sugar, butter, flour, ground hazelnuts, eggs and baking powder with a
    wooden spoon, until smooth and light
  - Stir in che chopped plums and chocolate
  - Tip into the cake tin and smooth the top
  - Scatter halved plums and the hazelnuts over mixture, and push in gently
  - Bake for 40-50 mins at 180°, then turn out and cool on a wire rack
  - Heat the jelly and brush over the cake
