directions:
  step:
  - heat the oil in an ovenproof frying pan over a medium heat, add the chicory, cut-side
    down, and and add half of the orange juice and zest. Cook for 2-3 minutes, or
    until softened, then transfer to the oven for 4-5 minutes, or until tender.
  - 6. Heat a chargrill pan over a medium heat, add the braised chicory and grill
    for 1-2 minutes, or golden-brown grill marks appear. (Retain the cooking juices
    in the frying pan.)
  - 7. Return the chicory to the frying pan, add the remaining orange zest and another
    tablespoon of orange juice and fry for a further 1-2 minutes, stirring well to
    coat the chicory.
  - 8. Place the orange segments and the watercress into a bowl and mix well to combine.
  - 9. In a separate bowl, whisk together the mustard, one tablespoon of the reserved
    orange juice, the white wine vinegar and the olive oil until well combined. Season,
    to taste, with salt and freshly ground black pepper.
