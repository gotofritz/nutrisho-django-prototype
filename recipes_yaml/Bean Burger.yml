directions:
  step:
  - Boil the potatoes, take out
  - In the same water boil the broad beans 5 mins, take out and skin
  - Mash potatoes and half the black beans, then add broad beans and remaining black
    beans
  - Sautè onion and pepper until soft
  - Add garlic and chillies and cook a further 3 mins
  - Remove from fire, stir in paprika
  - Dry roast the spices and add to mash
  - Add sautèd veg to mash, togheter with lime juice and chopped coriander
  - Form patties and chill 30 mins
  - Roll in corn meal and fry
