cuisine: .chinese
description: Chempi Niurou
directions:
    step:
    - Mix beef steak, ginger, sugar, dark soy sauce in a bowl, and let stand in the
        fridge for at least 20m
    - soak dried tangerine peel in hot water then drain for 20m
    - quickly stir fry the onions, then set aside in oil for 40s
    - quickly stir fry beef, then set aside for 90s
    - Add oil then stir fry the tangerine peel, fresh chilies, szichuan pepper, and
        quickly set aside in oil for 90s
    - Put onion and beef back in, add hoisin sauce, bean paste, light soy sauce for
        40s
    - Add the tangerine peel mix then serve for 20s
