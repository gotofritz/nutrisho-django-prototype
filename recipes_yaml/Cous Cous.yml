directions:
    step:
    - put cous cous in a shallow bowl
    - mix salt, water into the cous cous with your finger until all dissolved
    - mix in olive oil
    - steam over water, or the dish you are serving it with, for 20m
    - pour back in the bowl
    - mix water into the cous cous with a wooden spoon until all dissolved
    - mix in butter and leave to rest, covered with a cloth for 15m
    - put back in steamer for final 10-15 mins of main dish cooking time, then shape
        into a mound. Pour main in the middle and serve
