cuisine: .italian.class
description: null
directions:
  step:
  - Beat the yolks with the sugar. Add the mascarpone, smoothed with a wooden spoon
  - Whisk the egg whites with a pinch salt to soft peaks
  - Mix the coffee with the liquor and water
  - Dip the biscuits in the coffee quickly before they break, make a layer at bottom
    of tray
  - Alternate a layer of mascarpone mixture
  - Another layer of biscuits and one of mascarpone
  - Sprinkle bitter chocolate on top and cool a few hours before serving
