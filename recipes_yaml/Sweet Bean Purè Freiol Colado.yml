cuisine: .perú
description: Peruvian street food
directions:
  step:
  - Boil the beans in water for 30 mins in pressure cooker (1.5h after overnight soaking
    if using a normal pot)
  - Drain and pass through a coarse sieve to remove skins.
  - Meanwhile simmer down milk until it becomes half the amount, about 250ml
  - Blend beans and reduced milk together to a smooth mixture
  - Add sugar, cinnamon, cloves to mixture and boil on medium for 25 - 30 mins until
    thick.
  - Cool then serve into individual bowls and refrigerate
  - Sprinkle with toasted sesame seeds before serving
