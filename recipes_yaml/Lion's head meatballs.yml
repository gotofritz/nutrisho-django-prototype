cuisine: .chinese.yangzhou
description: Shizi Tou
directions:
  '#text': '>'
  step:
  - mince meat, then add remaining ingredients and process
  - form into 4 meatballs
  - make a paste with cornstarch and soy sauce, a bit water if required, and coat
    meatballs with it - keep rest
  - deep fry meatballs 2/3 m, then remove
  - fry pak choi in same oil until wilted
  - place in pirex dish, put meatballs on top, pour remaining ingredients, cover in
    foil
  - steam 40 miuntes, turning meatballs over halfway - alternatively cook normally
    on stove
  - when cooked, pour stock in heated wok with remaining paste (3), and reudce, 2m
  - season with salt and pepper and pour over meatballs
