cuisine: .middle east.syria
description: Almost a mediterannean dahl
directions:
    step:
    - Deep fry the onions in veg oil, until brown, then drain and dry off the oil
    - Fry garlic and cumin in olive oil until golden
    - Stir in coriander stalks and lentils, half the caramelized onion, water
    - Bring to boil and simmer gently for 40-60 mins
    - Add in coriander leaves, olive oil, squeeze of lemon, salt and pepper.
    - Serve with remaining caramelized onion on top
