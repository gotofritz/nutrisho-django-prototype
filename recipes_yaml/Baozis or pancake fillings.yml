cuisine: .chinese
description: Jiaozi
directions:
  '#text': '>'
  step:
  - process meat
  - add ginger, oil, soy sauce
  - add water slowly
  - add rest but do not blend too much
  - marinate pork in soy sauce
  - steam sausages 5 m then chopped
  - dissolve starch in stock
  - stir fry pork, celery ginger garlic, 1m
  - add sausage, bamboo shots, mushrooms, hoisin sauce, dark soy sauce, spring onion,
    cornstarch mixture, 20 sec
  - move to bowl and add coriander
  - dice pork
  - cook with other ingredients over medium heat for 1 m, then let stand
  - 'make baozis: line steamer with cabbage leaves, steam 7 m'
  - make pancakes
  - serve with soy sauce
