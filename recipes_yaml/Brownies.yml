cuisine: null
description: Can add 50g dried figs soaked in water. Discard the water and add to
    brownies in step 6
directions:
    step:
    - non stick baking tray - grease and line with paper
    - Preheat oven 180 C or 160 C on fan
    - Chop almonds roughly and toast in oven on baking sheet for 8 mins exactly
    - Melt chocolate and butter in bowl over a saucepan of boiling water
    - Sift flour, baking powder and salt together
    - Add flour mixture, beaten eggs, toasted almonds and sugar stir mixture till
        all combined
    - Pour mixture into cake tin
    - Bake in oven for 15-20 mins
