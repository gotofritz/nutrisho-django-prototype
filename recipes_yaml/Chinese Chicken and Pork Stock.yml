cuisine: .chinese
description: Keeps for 3 days fresh, 2 months frozen
directions:
  '#text': '>'
  step:
  - null
  - Blanch the chicken and pork pieces by pouring boiling water over them to cover,
    bringing back to boil, then discarding the water
  - Cover meat again with cold water, bring to boil, skimming as it cooks.
  - Lower heat, add remaining ingredients, simmer on low heat for 1.5 hours
  - Remove chicken bones, add remaining ingredients, simmer for 2 hrs
  - cool, and remove the fat from the top.
