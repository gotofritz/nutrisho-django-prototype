directions:
  '#text': '>













    >'
  step:
  - soak chickpeas in water overnight in the fridge, to prevent fermenting
  - after soaking, change the chickpeas water, add pinch bicarbonate, and cook for
    1h, then drain
  - peel the tomatoes
  - chop onion, garlic clove, parsley
  - "saut\xE8 gently in oil 1m, covered"
  - dice (1cm) potato and add, 3m
  - slice fennel thinly and add, 3m
  - chop the peeled tomatoes
  - add the tomaotes, stir a bit
  - add the fregola / quinoa, stir fry to coat with oil
  - add the chickpeas and water / stock, salt and pepper
  - cook until pasta / quinoa cooked, 10-15 mins
