directions:
    step:
    - Cook the polenta for 45 minutes. It should be a bit runny
    - Pour into a greased baking dish
    - Mix all the other ingredients with a fork in a bowl, tip over the polenta, and
        slightly push them in.
    - Bake at 210° for 15 mins
