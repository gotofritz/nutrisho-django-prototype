directions:
  step:
  - marinade beef in bowl at least 20m
  - in a bowl mix stock, rice wine, soy sauce, cornstartch, sugar
  - stir fry celery, spring onions, ginger 30 sec the put aside
  - stir fry meat 1 m
  - put veg back in, 20 s
  - pour sauce on top, 30 s
