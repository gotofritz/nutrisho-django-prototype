directions:
    step:
    - Preheat oven to 200 C or 190 for fan ovens.
    - Boil or steam broccoli until tender
    - Mix yoghurt, oil & egg
    - Add broccoli and roughly crumble in blue cheese.
    - In food processor and pulse in short bursts until no large pieces of broccoli
        left.
    - Put flour & salt in a big bowl and mix together with a fork.
    - Pour in the liquid mixture and begin to fold together.
    - If you think the mixture looks too dry add the extra milk and fold JUST enough
        to combine.
    - Spoon in mixture to muffin tray
    - Bake for 12/15 minutes
    - Let the muffins cool in the pans for 2-3 minutes before tipping out.
