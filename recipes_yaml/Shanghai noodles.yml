cuisine: .chinese.shanghai
description: Shanghai Mian
directions:
  '#text': '>













    >'
  step:
  - mix all marinade ingredients, until sugar dissolves and add thinly sliced pork.
    Stand at least 10 m
  - bring a half filled pot to a boil, add the noodles and bring back to boil. Add
    250ml water and bring back to boil, then add 125 ml water and bring back to boil
  - when noodles are barely tender drain, rinse in hot water and drain
  - chop all garlic, julienne spring onion, separate white and green of cabbage and
    slice thinly separately
  - sieve pork but keep liquid
  - stir fry (hi heat) pork, 40 s, then set aside
  - add garlic, spring onion, white part of cabbage, 30 s
  - meanwhile put seame oil on medium low fire
  - add pork, marinade, green part of cabbage, 20 s
  - add noodles and cornstarch, 40 s
  - fry garlic in sesame oil, 15 s
  - serve noodles with sesame oil / garlic mix poured on top
