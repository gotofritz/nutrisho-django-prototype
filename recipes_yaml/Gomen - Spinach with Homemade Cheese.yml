cuisine: .iranian
description: This is one of the most delicious ways I know to eat spinach. Spicy,
  buttery and nutty, I could eat endless bowls full of gomen without tiring.
directions:
  '#text': '>








    >'
  step:
  - grind dried chilies, black mustard seeds, salt to a fine powder
  - warm yogurt on low heat until it curdles
  - remove from heat and let cool, then tip in colander to drain and leave in fridge
  - cook spinach in pot, covered, on medium heat until wilted
  - remove lid and keep cooking until water evaporates
  - add olive oil, salt and keep cooking until slightly dried
  - Tip into a bowl and add cheese broken with a fork, mit'mita, and butter
