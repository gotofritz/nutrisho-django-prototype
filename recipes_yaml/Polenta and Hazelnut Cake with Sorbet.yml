directions:
  step:
  - Boil water, honey, sugar until dissolved, then cool
  - Blend fruit, alcohol with syrup, then freeze in air tight container
  - Whisk together eggs, sugar
  - Melt together olive oil, butter, then add to the egg and sugar
  - Grind the hazelnuts in a food processor until fine then add to the mixture
  - Add baking powder, flour, polenta to the mixture
  - Add vanilla pods to the mixture
  - Put mixture in oiled 23 cm and bake 175° for 25 m
  - Let cool in the tin, then dust with icing sugar and serve with sorbet
