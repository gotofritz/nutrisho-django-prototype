directions:
  step:
  - Soak the beans overnight then cook with a bay leaf and an onion.
  - Drain and discard the onion and bay leaf.
  - "Saut\xE9 the herbs and garlic in olive oil at low heat"
  - "Add the beans, and saut\xE9 on high for 4 mins until mushy."
  - Season with salt and pepper, remove herbs and garlic, and whizz in a food processor.
  - Steam the fennel, or boil in salty water, for 15 mins.
  - Drain and chop finely with a knife.
  - Add the beans, eggs, bread crumbs, and cream.
  - Mix and form into croquettes. IF they are to soft and sticky put in the fridge.
  - Pass the croquettes in beaten egg, then cover in breadcrumbs.
  - Deep fry in veg oil and pat with kitchen paper before serving
