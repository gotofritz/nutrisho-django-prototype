directions:
    step:
    - Fry the onion until soft and slightly browned
    - Mix the onion with the remaining ingredients, salt and pepper, without working
        them too much
    - Form into 12 patties, with a dimple in the middle. Chill 1 hour
    - Cook 3 minutes on one side, then turn and then from 4 (rare) to 7 minutes (well
        done) on the other side
    - Remove from fire. While the rest a bit, toast bread on barbecue
