directions:
  step:
  - Melt the butter
  - Add to the remaining ingredients in food processor and whiz
  - Leave in fridge overnight (or at least an hour)
  - To cook, coat hot pan with butter with a brush
  - Swirl around to cover, then flip after 30 seconds or so
