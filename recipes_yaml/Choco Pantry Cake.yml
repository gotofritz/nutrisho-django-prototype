cuisine: .british
description: Super easy
directions:
  step:
  - Grease and line a 20cm cake tin
  - Melt butter and chocolate for 30 secs in microwave
  - Add jam, sugar, salt, and eggs
  - Soft flour and baking powder
  - Mix all the above together
  - Bake at 180° for 40-50 mins
  - Take out and cool
