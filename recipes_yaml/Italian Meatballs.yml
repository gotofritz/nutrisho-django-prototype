cuisine: .med.italy
description: Italian staple
directions:
  step:
  - Mix Meatball ingredients in a bowl by hand, no need for food processor. Add breacrumbs
    last, you may not need them all. Mixture should be fairly solid yet still pliable
  - Divide mixture in 3 equal lumps. Divide each lump in half, and each half in half
    again. That should give you 3 x 4 = 12 lumps
  - Shape into meatballs, chill (2hr in fridge or 10/15m in freezer)
  - Meanwhile whiz Sauce Base ingredients in small food processor
  - Sauté Sauce Base in abundant olive oil on medium heat, 3-4 m
  - Add the meatballs, sauté gently shaking constantly to prevent sticking, until
    browned (4-5 m)
  - Add the white wine and let it evaporate
  - Whiz the remaining Sauce ingredients in small food processor
  - Add Sauce ingredients to pan, cover, cook on medium-low for 15 mins
  - If the sauce looks too dry while cooking, add a bit of water
  - Serve with nice bread to scoop up the sauce with
