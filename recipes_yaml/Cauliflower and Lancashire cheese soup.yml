cuisine: null
description: A creamy cauliflower soup makes a great winter warmer and a strongly
    flavoured, crumbly white cheese, such as a Lancashire, gives it that nice savoury
    finishing edge. I've added some crispy croutons here to give extra texture to
    this silky-smooth soup.
directions:
    step:
    - Cook the onion and leeks on high, for 4-5 minutes, until they are soft.
    - Add the cauliflower for a couple of minutes.
    - Add the stock and milk, season with salt and pepper, bring to the boil.
    - Simmer on medium for 35 minutes, or until the cauliflower is soft.
    - Meanwhile put the grated cheese in the bowl.
    - Blend the soup in a liquidiser. Strain through a fine-meshed sieve over the
        grated cheese in the bowl. Season again if necessary.
    - Meanwhile, heat the olive oil in a heavy-based frying pan and cook the croutons
        on a medium heat for 3-4 minutes, turning every so often until golden.
    - Transfer to some kitchen paper, season and toss the rest of the cheese with
        them while they are still hot.
