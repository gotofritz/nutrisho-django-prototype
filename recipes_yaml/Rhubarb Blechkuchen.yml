cuisine: .german
description: Nigella's version thereof
directions:
    step:
    - Mix the dry dough ingredients.
    - Beat the eggs and add to the wet dough ingredients.
    - Mix wet and dry mixtures, and knead into a dough, adding a little flour if necessary.
    - Work in the butter, and knead for 10 mins.
    - Let raise, covered, for 1 / 1.25 hours, or overnight in fridge
    - Stretch to cover a 30 x 20 cm pan - let it rest 10 mins in the middle, then
        stretch again and let it raise 15/20 mins
    - Beat cream and egg together, add nutmeg, and brush mixture over dough
    - To make the crumble mix the cold butter with flour, then mix in the sugar with
        a fork.
    - Stir the chopped rhubarb with sugar and allspice, and immediately tip over egg-washed
        dough. Then sprinkle the crumble over that.
    - Bake 15 mins at 200°C, then 15 mins more at 175°C.
    - Once cooked let rest 15 mins in tray before serving
