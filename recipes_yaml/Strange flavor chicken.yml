directions:
    step:
    - steam chicken 25 m
    - menwhile, beat together all sauce ingredients in a bowl
    - cool chicken for 5 m, then brush with soy sauce, and cool another 20 m uncivered
    - deep fry chicken 2m, then cool to room temperature
    - rip / cut chicken flesh + skin, pile on plate, pour sauce on top
