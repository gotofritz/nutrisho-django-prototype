directions:
    step:
    - Mix salt with aubergines, put them in a colander with a weight on it for an
        hour
    - Dissolve the sugar in vinegar
    - Remove filaments from celery stalks and cut them in 1cm pieces
    - Pit the olives and cut in half
    - Sautè onion, add tomato and purè, cook on medium 10m
    - Season with salt and pepper, add celery, capers, olives, pine nuts, vinegar
    - Cook until well mixed and dense, 10m
    - Rinse the aubergines and fry with zucchini and peppers in a separate pot for
        20m, with a couple of tbs water and seasoning
    - Mix with the sauce, cook another 5 mins
    - Let cool and mix basil
