cuisine: .fusion.spain
description: British roast lamb done up the fashionable Moro way
directions:
  step:
  - Make 10 / 12 small incisions in the lamb and push the garlic an rosemary sprigs
    in them. Put the lamb in a baking tray
  - Mix the coating ingredients together, and pour over the lamb
  - "Bake 30 mins at 230\xB0"
  - Add the white wine, and roast for another half hour, adding water if too dry
  - Remove and let rest for 20 mins
  - Remove the fat from the tray, the put over the hob on medium. Add the wine and
    scrape any juices off the bottom. Season with salt and pepper
  - Slice the lamb and pour the stock over it
