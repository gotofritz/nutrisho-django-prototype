directions:
    step:
    - Melt the honey ingredients in a small pot, then simmer for 2m
    - Cool, then add lemon juice and oil
    - Mix in the onions and tofu
    - Break the nori and scatter over tofu mix
    - Cook the soba noodles for 4-5 mins in unsalted boiling water then cool under
        the tap.
    - Mix in with the tofu and serve
