directions:
  step:
  - 'optional: soak barley 4h'
  - simmer 50g barley 1hr in 1L of water (less if pre-soaked)
  - when tender, drain and cool
  - mix marinade ingredients and rub it on beef. Leave 2hr
  - make dressing by mixing ingredients and seasoning with salt and pepper
  - rub olive oil over beef and cook on very hot dry griddle until medium rare
  - set aside 1m to cool
  - cut into thin slices against the grain
  - mix everything in a bowl
