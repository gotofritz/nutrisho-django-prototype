directions:
    step:
    - bring water for blanching to boil
    - Cut beef into thin strips, 4 x 1 cm or thereabout
    - mix with marinade ingredients in a bowl, and stand for 20m
    - cut asparagus on the diagonal, 1.5 cm long, and blanch 1 m in boiling water,
        then immediately dip in chilled water
    - chop spring onion
    - rinse noodles in cold water
    - stir fry beef 30 s then set aside
    - stir fry noodles, 1m, the lay on serving plate
    - put sauce ingredients in wok and reduce 1m
    - add asparagus and beef 30s
    - spoon over noodles, and sprinkle spring onions on top
