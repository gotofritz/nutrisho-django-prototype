cuisine: .chinese.cantonese
description: Do shi pau gu
directions:
  '#text': '>'
  step:
  - Marinate pork in shallow dish in fridge up to 4 hours
  - braise in oven, turning occasionally, 1.5 hr at 160C, covered
  - uncover, raise heat to 190C, another 20m
  - skim fat and serve
  - 'optional: to make a thicker sauce, pour juices into hot wok, add half cornstarch
    mixture, bring to boil, cook 2m adding remaining half as required'
