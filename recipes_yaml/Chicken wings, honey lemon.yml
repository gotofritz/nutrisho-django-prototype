cuisine: .european.modern
description: Served with Lentil Feta Salad
directions:
  step:
  - "Sprinkle the chicken wings on a baking dish, sprinkle with salt and roast 30\
    \ mins at 200\xB0"
  - Mix the sauce ingredients in a bowl until the honey has dissolved
  - Mix in the chicken wings, coat well
  - Roast for another 20 mins
  - Garnish with parsley and lemon wedges
