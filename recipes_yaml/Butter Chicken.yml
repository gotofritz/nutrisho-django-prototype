cuisine: .asia.india
description: Classic dish
directions:
  step:
  - Mix all the marinade ingredients in a small blender, mix the chicken with it,
    and refrigerate 2hrs to overnight
  - Set the broiler / grill to 180° C
  - Blend the spices in spice mill or pestle and mortar, set aside
  - Process the aromatic ingredients except the onion in the same spice mill, set
    aside
  - Sauté the onion in a mixture of veg oil and butter for 6mins
  - Add the aromatics mix for 2mins, then remove from heat
  - Add the spices and mix well, then add the tomatoes, mix again, and put back on
    the stove
  - Season with salt and cook on medium heat
  - Layer the chicken pieces on tray and put under the broiler/grill for 7mins, then
    turn them and grill another 8 mins
  - Add the butter and cream to the sauce and blend it all with an immersion blender.
  - Mix in the chicken pieces and cook a couple more minutes
