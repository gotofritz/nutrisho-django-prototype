cuisine: .german.kalingrad.traditional
description: East Prussian (=Kalingrad) dish of medieval origin
directions:
    step:
    - Put the broth ingredients in a dutch oven and simmer without boiling
    - Mix the meatball ingredients in a food processor with salt and pepper
    - Form into delicate meatballs the size of golf balls
    - Roll the balls in some flour, then drop into the broth without crowding them
    - Cook 15 mins without boiling, then take out with a slotted spoon and keep warm.
        Remove bay leaf
    - Meanwhile boil the potatoes, they should keep their shape but be soft enough
        to mash with a fork
    - Add the sauce ingredients to the soup, heat through but do not boil. The sauce
        is soupy
    - Serve Klopse with potatoes and generous sauce, covered in chopped parsley. Normally
        you mash the potatoes with a fork to soak up the sauce
