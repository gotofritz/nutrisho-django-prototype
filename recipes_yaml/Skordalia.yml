cuisine: .greek
description: Served in generous globs alongside barbecued lamb or fish, skordalia
  is what you will lick from your fingers and scrape from the bowl.
directions:
  step:
  - To make the skordalia, soak the bread in water for 5 minutes. Using your hands
    squeeze as much water out of the bread as possible.
  - Using a mortar and pestle or a food processor, process or pound the bread, garlic
    and vinegar to a thick paste.
  - Slowly, in a thin stream, pour in the olive oil while mixing in with a wooden
    spoon or whisk until it has all been incorporated and the sauce becomes thick
    and emulsified. Set aside until ready to eat.
  - Serve in thick globs alongside roast lamb or fish.
ingredients:
  group:
    ingredient:
    - measurement: slices
      name: bread
      preparation: thick slices of crusty peasant-style bread
      quantity: '3'
    - measurement: cloves
      name: garlic
      preparation: peeled
      quantity: '3'
    - measurement: Tbsp
      name: red wine vinegar
      preparation: null
      quantity: '2'
    - measurement: Tbsp
