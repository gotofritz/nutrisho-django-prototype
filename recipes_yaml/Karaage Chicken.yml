cuisine: .asia.japan
description: Korean staple originally from Japan who got the idea from China, but
  only became a staple when they could import large quantity of chicken from the US
directions:
  step:
  - Cut chicken in pieces roughly the size of a ping pong ball, keeping skin on if
    any
  - Whiz all the Marinade ingredients in the small food processor
  - Remove blade, add the chicken pieces and coat meat with marinade. Tip into bowl
  - Let it rest 2hr to overnight in the fridge. Remove from fridge 30 m before using
  - Heat oil to 160° - 170°C
  - Drain chicken from marinade, but keep the liquid
  - Add corn starch to marinate and work into a paste. Roll chicken pieces in it
  - When oil is hot enough deep fry in batches, roughly 2m per batch
  - Take out, let it rest a few minutes, then fry again for 2m
