cuisine: .italian
description: The secret to fluffy and light potato gnocchi is to bake the potatoes
    instead of boiling them. Boiling potatoes in water causes them to absorb moisture
    which means that you'll have to use more flour in the dough which can make it
    heavy and dense.
directions:
    step:
    - Pierce the potatoes all over with a fork and place in the oven. Bake the potatoes
        until soft when pierced with a knife or skewer, approximately one hour. Remove
        from the oven and let the potatoes cool.
    - Peel the potatoes and press them through a potato ricer into a large mixing
        bowl. Add the flour, 2 tablespoons of the olive oil, the egg, and nutmeg.
        Season with salt and pepper. Mix by hand until the dough binds together, but
        be careful not overwork it or it will become gluey.
    - Divide the dough into 5 or 6 balls, and roll each ball out on a lightly floured
        worksurface into a long snake about 1/2 inch in diameter. Cut each length
        into 1-inch segments, and set aside.
    - Bring a large pot of salted water to a boil, and add the gnocchi in batches.
        Cook until they float to the surface, then remove them with a slotted spoon.
    - Meanwhile heat the remaining oil in a large nonstick sauté pan over medium heat.
        Add gnocchi in batches, and cook until golden brown, 2 to 3 minutes per side.
        Remove from the pan, and repeat with remaining gnocchi. Serve immediately.
