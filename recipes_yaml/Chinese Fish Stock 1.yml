directions:
    step:
    - Remove gills from fish head. Wash all the fish bits.
    - Sauté the ingredients in oil over medium heat for 5 mins then sweat with rice
        wine.
    - Add water and seasonings and bring to boil, skimming every so often.
    - Cook 20 mins on low, then sieve
