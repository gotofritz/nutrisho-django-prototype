cuisine: .spain.asturias
description: Tarta De Manzans from the Asturias
directions:
  step:
  - Mix the dough ingredients in a food processor. Knead into a ball and leave to
    rest in the fridge, covered, 30 mins.
  - Roll the dough on a buttered 30 cm loose bottom tart tin. Prick with a fork.
  - Slice the apples into thin rings. Arrange on the pastry.
  - Pour over the lemon juice and bake 200° for 30 mins or so.
  - Let cool slightly then grate cinnamon.
  - Warm some apricot jam in a pot, and when it's gone a bit fluid glaze the cake
    with it, using a brush.
  - Leave to cool.
