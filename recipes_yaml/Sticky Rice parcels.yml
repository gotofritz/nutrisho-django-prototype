cuisine: .chinese
description: Nou Mi Ji
directions:
  '#text': '>'
  step:
  - soak rice in water for 1 hour, then drain
  - soak lotus leaves in water for 1h
  - soak mushrooms 30 m
  - pour 1L boiling water on rice and leave to cool
  - drain mushrooms, then chop
  - steam sausage 5 m, then let cool and slice
  - cut chicken into cubes 1cm, chop sproing pnions
  - drain rice, add mushroom (4), sausage (5), shrimp, chicken, peanut, spring onions,
    soy sauce, oil
  - drain leaves, fold in half and cut away thick stem
  - make little rectangular parcels, place seams down in steamer and steam 40 m
