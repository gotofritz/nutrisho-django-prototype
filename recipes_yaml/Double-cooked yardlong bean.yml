cuisine: .chinese
description: I always order this in my local Sichuan restaurant in Bethnal Green Road
  in east London, Gourmet San. It's a great accompaniment to meat or fish. The yardlong
  bean is also known as the long-podded cowpea, asparagus bean, snake bean, or Chinese
  long bean - but if you can't find yardlong beans then just use green beans. You
  can buy the preserved mustard cabbage in vacuum packs in Chinese supermarkets.
directions:
  step:
  - Mix pork belly, light soy sauce, rice wine, sesame oil and marinade at least for
    20m
  - fry yardlong beans, for 4m, until tender, then set aside
  - sitr fry chilies with the pork high heat
  - add pickled cabbage, spring onions for 20s
  - add light soy sauce, sugar, rice wine, water and stir in briefly before serving
