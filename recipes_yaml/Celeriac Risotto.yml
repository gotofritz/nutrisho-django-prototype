cuisine: Italian
description: An unusual risotto with celeriac, enriched with cooked pears and toasted
  seeds.
directions:
  step:
  - Place the pears upright in a small saucepan with the other ingredients and a pinch
    of salt, add enough water to cover them halfway
  - Cook over low heat for 40 minutes until very tender
  - Cook the diced celery root with a pinch of salt for 20-25 minutes on low heat
  - Blend the celery root with the cooking liquids
  - Toast pumpkin and sunflower seeds in a dry pan for 1 minute, then add 1 tablespoon
    of soy sauce. Let the liquid evaporate and remove from heat
  - Prepare the risotto, plain just sweating with wine and cooking with salted boiling
    water
  - Remove from heat, add the celery root cream, butter and cheese. Gently mix and
    serve in bowls
  - Garnish the risotto with pear wedges and toasted seeds
