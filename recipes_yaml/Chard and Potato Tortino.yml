cuisine: .italian
description: Wholesome side dish
directions:
    step:
    - Separate the green from the whites
    - Cook the whites with the potatoes, salt, a couple of drops of olive oil, and
        a couple of drops of soya sauce for 15 mins
    - Add the greens, for another 5 mins
    - Chope the chard, toss them with some olive oil, salt and pepper, and layer a
        baking tray with them
    - Mash the potatoes, mix them with the parmesan
    - Layer the mashed potatoes at the top of the baking tray
    - Grill at 200° for 10 mins
