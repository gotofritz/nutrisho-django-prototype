directions:
  step:
  - fry the leeks in butter for a few minutes (2) add gammon, vegetables, thyme, toss
    (3) add the flour, keep tossing (4) increase the heat, pour the cider, bring to
    boil, season (5) cook 35 mins
  - mix the pastry ingredients in a bowl, make a dough, roll out 1cm thick (7) lay
    over the pot, cook another 30 mins
