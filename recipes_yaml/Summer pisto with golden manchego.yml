cuisine: Spanish
description: A vibrant and flavorful dish combining roasted vegetables with crispy cheese and a runny fried egg.
directions:
  step:
    - Heat 60ml of olive oil in a sauté pan or shallow casserole and fry diced aubergine for 10 minutes until lightly colored and oil is released.
    - Add red onion and fry for 5 minutes until softened, then add garlic, courgettes, and red pepper; fry for another 5 minutes.
    - Add cherry tomatoes, lemon zest, and sherry vinegar; season well and simmer gently for 15-20 minutes until tomatoes soften and release juice.
    - While the pisto cooks, dust manchego cubes in flour, dip in beaten egg, and coat with panko breadcrumbs.
    - Heat 300ml of oil to 170°C and fry the cheese cubes until golden and crisp, about 1 minute; drain on kitchen towel.
    - In a non-stick pan, fry the eggs until edges are crispy and yolks are cooked to preference.
    - Spoon the pisto into bowls, sprinkle with parsley, top with crispy cheese, drizzle with honey, and finish with a fried egg.
