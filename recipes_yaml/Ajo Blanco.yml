cuisine: .spain.andalusia
description: The classic chilled soup from Malaga. Sometimes served with raisins or
    melon instead of grapes
directions:
    step:
    - Grind the almonds in a food processor as fine as possible.
    - Add 5 tbsp of the water and run again until you get a smooth paste
    - Squeeze water off the bread and add, along with the garlic.÷
    - Add the olive oil, and then the rest of the water slowly until you have a soup
        the consistency of single cream.
    - Remove from food processor, add vinegar and season with salt and pepper
    - Chill for at least an hour
    - Share the grapes among the bowls when you serve
