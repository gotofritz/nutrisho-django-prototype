cuisine: .indian
description: Parathas - flatbreads that have been stuffed with a savoury filling -
    are like India's answer to the sandwich. These parathas contain a nutty, spiced
    roast cauliflower filling and are one of my favourite kind of parathas to make.
directions:
    step:
    - Preheat the oven to 190 C
    - Toast the spices for the stuffing by placing them in a dry frying pan over medium-low
        heat. Shaking the pan frequently, toast the spices for 3-4 minutes or until
        fragrant. Grind the spices to a fine powder in a spice grinder or a mortar
        and pestle.
    - Place the spices, cauliflower, garlic, honey, oil and salt in a roasting tin
        and toss well to mix. Place in the oven and roast for 20-30 minutes, stirring
        occasionally until the cauliflower is nutty and browned. Remove from the oven
        and leave to cool, then stir in the amchoor powder and coriander.
    - While the cauliflower is roasting, make the dough by combining the flour, milk,
        yoghurt, butter and salt in a large mixing bowl. Stir it with a wooden spoon
        until it comes together as a dough, then turn the dough out onto a lightly
        floured worksurface and knead for 10 minutes until the dough is smooth and
        elastic. Divide the dough into 6 balls of equal size, cover them in cling
        film and set them aside to rest in the fridge for 30 minutes.
    - Working with one ball of dough at a time, take a ball of dough and flatten it
        out to a thickness of about 1/2 an inch using either your hands or a rolling
        pin. Spread 2-3 tablespoons of the filling onto the dough leaving a margin
        of about an inch on all sides.
    - Gather the edges of the dough towards the centre and press down gently but firmly
        with your hands to seal in the filling and reseal the edges of the dough.
        Flatten the dough out gently with your hands being careful not to break the
        dough and spill the filling, until it is approximately 1/2 inch thick. Repeat
        with all the dough balls, layering them between sheets of parchment paper
        to keep them from sticking to each other until you are ready to cook them.
    - Heat a large frying pan on medium high heat and add approximately 1 tbsp of
        oil. Swirl the oil around to coat the base. Add one of the parathas and cook
        it for approximately 4-5 minutes per side until it is nice and golden and
        crisp on both sides and the filling is heated through.
    - Cut each paratha into quarters and serve immediately.
