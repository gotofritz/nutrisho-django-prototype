directions:
    step:
    - Cook the chickpeas for an hour or two with some onion and garlic, then drain
        and discard the vegetable
    - Mix the salad ingredients in a bowl, then spread on a paper lined baking tray
        and bake 15-25 mins at 220°
    - Mix the dressing ingredients in a bowl, thinning with water as required.
    - Put the baked ingredients in a bowl, season, and pour the dressing on top
