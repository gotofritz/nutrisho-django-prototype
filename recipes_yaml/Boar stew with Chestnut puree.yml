cuisine: .italian.modern
description: Expensive but apparently lovely meat stew
directions:
    step:
    - Wrap the meat in lard, add the remaining ingredients, and marinate for a couple
        of days, turning every now and then
    - Remove the lard, onion and thyme from the marinade, keeping the wine. Dry the
        meat.
    - Blanch the orange zest julienne a couple of mins
    - Sear the meat in a saucepot with little or no oil, remove and place in a casserole
        pot
    - Add more oil and butter, then sauté the onion, carrots, and celery, salt and
        pepper for 5 mins
    - Add the wine from the marinade and reduce 20 mins or so
    - Pour over the meat, add lemon and orange juice, sugar, stock, liquor, salt and
        pepper
    - Bake 20 mins at 200°, rotating every so often
    - Meanwhile bring to boil the puré ingredients, then simmer for 20 mins and mash
