cuisine: .indian
description: Louki Tamatar Tarkari
directions:
  step:
  - In the mortar, make a paste with chopped green chilies, grated ginger, crushed
    nuts, coriander seeds, cumin seeds, fennel seeds. When crushed, dilute with water.
    Or just use a food processor.
  - Make a cross cut at the bottom of the tomatoes, soak in boiling water a couple
    of minutes, then rinse in fresh water and peel.
  - Fry the spice paste in ghee or oil / butter mixture over medium high heat until
    it dries out a bit.
  - Chop the tomatoes and add them to the spices. Cook 3-4 mins
  - Add the zucchini, turmeric, salt, and first lot of chopped coriander and lower
    heat. Cook on low heat 10 - 15 mins, stirring occasionally and adding water if
    it gets too dry.
  - Add remaining chopped herbs and serve
