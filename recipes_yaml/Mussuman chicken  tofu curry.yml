directions:
    step:
    - deep fry chicken / tofu, potatoes, and shallots separately, pat dry
    - put the chicken / tofu in a pan and just cover with coconut milk, and bring
        to boil
    - add cardamom pods, peanuts, bay leaves, 10 mins
    - add the potatoes an onions
    - in another pot cook coconut cream and curry paste, low heat, 10 m. use juice
        from (4) if it gets too dry
    - when dry, add sugar until caramelized
    - add fish sauce and tamarind water
    - add (7) to (4), add the pinea[[le / apple juice, and serve
