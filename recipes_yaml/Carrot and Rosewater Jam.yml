cuisine: .iranian
description: Eat with fresh bread spread with salted butter or feta cheese.
directions:
  step:
  - Bring to boil carrots in water, then reduce and cook uncovered 35 m, until mixture
    is almost completely dry and sticky.
  - Bring to boil sugar in water, whisking a few times to encourage the sugar to dissolve
    then crumble saffron in, and pour the mixture over the carrots.
  - Simmer on low hear for further 40 minutes until fat bubbles of air form on the
    surface as it cooks. Add rosewater for last 10 minutes. Remove the carrots from
    the heat and allow to cool
  - Dry roast cardamom pods 3-4 minutes, crack them open and crush the black seeds
    to a fine powder, discarding the green husks. Stir into the jam to cool completely.
  - When cool, place the jam in sterilised jars or store in bowls tightly covered
    in cling film in the fridge.
