cuisine: .italian.classic
description: From Nigella
directions:
  step:
  - Mix flour, yeast, salt in  bowl.
  - Mix olive oil and water
  - Add water mix to flour mix. Make a dough
  - Cover bowl with cling film, leave 1hr to rise
  - Punch down and leave to rest 10 mins
  - Press out and leave to rise 25 mins
  - Bake for 10 mins with no topping
  - Add topping and bake another 10 mins
