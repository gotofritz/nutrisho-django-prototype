cuisine: .serbian
description: "Ka\u010Damak. A kind of Serbian twist on porridge, ka\u010Damak is delicious\
  \ served with buttermilk or salty, feta-like cheese crumbled on top."
directions:
  '#text': '>'
  step:
  - Bring the water to a simmer in a large pot or saucepan. Whisk in the polenta in
    a slow, steady stream and then stir constantly until the water returns to a simmer.
  - Reduce the heat until the polenta only bubbles (and eventually splutters as it
    thickens) very occasionally, the heat should be on the gentlest of flames. Stir
    regularly and cook for an hour until the polenta is thick, but still stirable.
    Add a splash of water as needed if the polenta becomes stiff.
  - Before serving, stir in the salt and butter and mix through. Drizzle generously
    with buttermilk and serve warm.
