directions:
  step:
  - Put all the marinade ingredients in the small spice mill and blend to a paste
  - Cut the meat into small, roughly postage stamp sized pieces, and put in a ziplock
    back. Pour the marinade over it and close the back. Massage the bag so that it
    spreads evenly
  - Rest 2 to 24 hours in the fridge
  - When ready to cook, put all the sauce ingredients except the lime juice in a pot
    and boil down, on medium, stirring from time to time. 10-15m
  - Swewer the meat pieces, threading enough meat pieces to fill a 20 cm skewer
  - Preheat the airfryer to 205°
  - Cook the skewers in batches at 205° for 6-7 mins
  - Mix the lime juice with the peanut sauce and serve on the side
