directions:
    step:
    - Slowly mix the flour and water, season with salt and pepper and add parsley
        / fennel seeds if using. Whisk until mixed well
    - Put on stove on high, bring to boil mixing continuosly, then lower heat and
        cook 20 mins mixing occasioanlly. It should have the consistency of polenta
    - Pour in empty plastic bottle with top cut off, and leave in fridge overnight.
    - Cut in thin slices and deep fry at 180°
