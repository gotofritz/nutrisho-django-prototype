cuisine: .spain.traditional
description: Classic ancestor of creme brulé
directions:
    step:
    - Flavour the milk by simmering all the ingredients together for a few minutes.
        Sieve and keep the milk
    - Beat together egg, sugar, cornstarch
    - Slowly add the milk.
    - Slowly simmer mixture, stirring constantly, until it begins to thicken
    - Pour in individual ramekins and cool in fridge
    - To serve, sprinkle sugar on top and caramelize under a broiler. You can also
        serve cold without the caramelizing.
