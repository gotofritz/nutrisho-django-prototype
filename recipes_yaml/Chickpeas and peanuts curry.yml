cuisine: .fusion.asia
description: The chickpeas are from souther india, the peanuts in soya from Malaysia
directions:
  step:
    - Boil the chickpeas for an hour
    - Boil the peanuts and other ingredients for three hours, then drain
    - "Sauté the mustard and coriander seeds"
    - Add the chickpeas, peanuts, and remaining spices. Cook for 5 mins
    - Remove from fire and add grated coconut, lemon juice, coriander leaves, and season.
