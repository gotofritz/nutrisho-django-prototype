cuisine: .german.classic
description: Classic German meatballs, almost burgers
directions:
  step:
  - Soak breadcrumbs in milk, 10 mins. You should get a thick mixture. If too runny,
    drain before using
  - Whiz the tomatoes and remaining sauce base ingredients in food processor, then
    put in large pot over low heat
  - Rinse food processor and whiz the onion, and the rest of the 1st bach ingredients
    until you get an evenly mixed sludge
  - Add one by one the meat, breadcrumbs, salt and pepper, egg
  - To shape the meatballs, use a measuring cup (1/4 cup seems a good size) to scoop
    out the meat. Have a bowl of warm water to rinse the measuring cup between each
    meatballs
  - Sear them 2m on each side in large pan (no oil if using non stick), then drop
    into pot with sauce
  - Raise heat and simmer fricadellen between 10m and 30m. Put serving dish in warm
    oven
  - Remove the meatballs from sauce and keep them warm
  - Sieve sauce, wipe pot quickly, put back on fire and melt butter
  - Add sugar and flour, stir until melted 3m. Add vinegar 1m
  - Add part of the sieved sauce, cook until thickened
