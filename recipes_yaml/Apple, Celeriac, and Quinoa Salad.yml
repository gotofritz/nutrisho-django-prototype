directions:
  step:
  - Cook the quinoa for 10 mins in water, then drain and cool in cold water
  - Mix the vinegar, sugar and salt in a bowl, then add the onion and rub in the liquid
  - Add the oil and leave to marinade
  - Mix the celeriac and apple julienne with the lemon juice
  - Add the onion marinade, the quinoa, and seasonings to the celeriac and apple
