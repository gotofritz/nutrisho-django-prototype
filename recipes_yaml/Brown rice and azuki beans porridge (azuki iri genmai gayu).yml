cuisine: .japan
description: A japanese pick me up. Needs a topping (called a furkake)
directions:
  step:
  - Use anything between a 1:5 and a 1:8 ration of rice to water volume.
  - Put all the ingredients in a pressure cooker with salt, and cook for 30 mins.
  - Add the topping just before serving
