cuisine: .europe.germany
description: Fleischlos nach Omas Rezept
directions:
  step:
  - Warm oil in a pot on medium high heat
  - Add the onions and sauté 3-4 minutes, stirring often
  - Add the coarsely chopped suppenbund, and stir. Cook 3-4 minutes
  - Add the coarsely chopped potatoes and carry on another 2-3 minutes
  - Add the stock and salt and pepper
  - 'Optional: add the bay leaves, cloves and nutmeg'
  - Cook 15-20 minutes
  - 'To test if ready: try to break the vegetables with a fork, if they break easily
    they are ready'
  - Use a food processor / immersion blender to blend the soup
