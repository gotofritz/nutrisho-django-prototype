cuisine: .indian.punjab
description: Chole Kulcha is an Indian classic. this is the Chole (chickpea) part
directions:
  step:
  - Lightly roast masala seeds. When fragrant, add the powders for a few seconds.
    Cool down, then grind. Store up to 3 months
  - Pressure cook the chickpeas for 45 minutes with the spices and salt. After cooking
    drain, and keep the water
  - Sauté seeds, add ginger, shortly after assafoetida and 2 secs later onions. Cook
    a few minutes
  - Add the tomates and cook until the liquid has evaporated
  - Add 2 tsp of the spice mix. Stir in well then ad a bit of water and dry it out.
    Add water again and dry it out again
  - Add in the chickpeas. Stir vigorously
  - Add amchoor and garam masala, mix, and add in enough cooking water to just cover
    chickpeas. Reduce
