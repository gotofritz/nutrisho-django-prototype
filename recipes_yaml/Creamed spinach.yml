cuisine: null
description: Creamed spinach is a delicious and comforting accompaniment to a piece
  of simply grilled meat.
directions:
  step:
  - Bring a pan of salted water to the boil and cook the spinach for 2-3 minutes until
    tender then drain in a colander, refresh under a cold tap and squeeze out any
    excess water.
  - Blend in a food processor - as smooth or as coarse as you wish. You can get the
    spinach to this stage in advance, then finish it at the last minute.
  - Simmer the cream in a saucepan until it's reduced by about half, then stir in
    the spinach, season and cook on a low heat for a minute or so, stirring every
    so often until the spinach is hot. Serve immediately.
