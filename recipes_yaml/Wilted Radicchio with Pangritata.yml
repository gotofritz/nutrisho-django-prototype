cuisine: null
description: The pangritata is a toasted garlic, herb and breadcrumb mixture which
  was originally known Southern Italy as 'poor man's parmesan' where it was used instead
  of parmesan cheese as a topping for pasta during learner times.
directions:
  '#text': '>'
  step:
  - Combine the breadcrumbs and herbs and mix well.
  - "In a frying pan, heat the olive oil on medium heat. Add the garlic and saut\xE9\
    \ for 30 seconds until fragrant. Add the breadcrumbs and toss well until they\
    \ absorb the oil and garlic. Continue to cook over medium heat until the breadcrumb\
    \ mixture has turned a golden brown colour."
  - Wash the radicchio heads and slice an inch off the bottoms off each to remove
    the root and separate all the leaves. Pat dry with a paper towel.
  - "In a deep, wide saut\xE9 pan, heat the olive oil on medium-high. Add the radicchio\
    \ leaves and toss with tongs until coated with the oil. Continue to cook, shaking\
    \ the pan at regular intervals until all the leaves have darkened and wilted slightly."
  - Add the pangritata to the pan containing the radicchio and toss well to mix. Remove
    to a large serving dish and add salt and pepper to taste. Serve warm.
