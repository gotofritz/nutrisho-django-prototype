    >'
  step:
  - Combine sugar, butter, egg, water in food processor and whizz. Slowly add flour
    and baking powder, on pusle, to make a dough
  - Form 18 balls, 2.5 cm diameter
  - "Deep fry at 150\xB0 for 2.5 / 3 mins, pushing under as you do"
  - Drain on paper towels and sprinkle sugar on top
