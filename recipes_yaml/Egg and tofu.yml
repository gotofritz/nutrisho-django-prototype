cuisine: .chinese
description: Feicui La Doufu - this is good with spring onion pastries
directions:
  '#text': '>'
  step:
  - whisk egg mixture, set aside
  - chop veg for stir fry finely
  - make wok very hot, add oil
  - stir fry veg with salt, 2m
  - chop garlic, chilli, start choping the coriander
  - add stir fry saiuce ingredients 20 s
  - add egg mixture (1), 15 s
  - lower heat, 1m
  - dice the tofu 1cm, finish chopping coriander
  - add tofu, coriander, ground pepper, 2m
  - serve
