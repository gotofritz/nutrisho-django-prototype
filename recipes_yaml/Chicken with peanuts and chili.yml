cuisine: .chinese.sichuan
description: Chengdu Ji
directions:
  '#text': '>'
  step:
  - dice chicken, same size as peanuts
  - marinade chicken 15 m at least
  - dice bamboo shots, bell pepper, same size as peanuts, and cut spring onions
  - deep fry peanuts, 1m then set aside
  - deep fry chicken, 1m then set aside
  - remove oil, wipe wok, put 2 tbsp back in
  - stir fry vegetables, 40 s
  - add sauces, 10 s
  - add chicken 30 s
  - add cornstarch mixture, until thick, 30 s
  - stir in peanutes (4), salt and pepper nad serve
