cuisine: .chinese
description: 'Shuang jiao niu rou: A delicious, colourful dish that leaves your guests
    wanting more!'
directions:
    step:
    - Mix together fillet beef, rice wine, light soy sauce, cornstarch, cold water
        with your finger and marinade for 20m
    - stir fry fresh chilies with the meat in oil high heat until it begins to change
        colour, about 2m
    - add spring onions, garlic and carry on for 20s
    - add red pepper, green pepper and keep on stirring briskly for 2m
    - sprinkle light soy sauce, salt, sugar over and carry on stir frying for 2m
