directions:
  step:
  - Preheat the oven to 175C and lightly brush the bottom and sides of a 9 inch springform
    pan with olive oil.
  - Place the flour, baking powder, salt and cornmeal in a bowl and stir to combine.
    In a separate bowl whisk together the olive oil, sugar, lemon zest and eggs. Stir
    in the milk and whisk to combine.
  - Add the dry ingredients to the wet ingredients and stir well to make a batter.
    Pour half the batter into the pan and layer with half the plums over top. Pour
    the remaining batter into the pan and top with the second half of the plums.
  - Place the cake in the oven and bake for 30-35 minutes until the cake is set and
    a toothpick inserted into the centre comes out clean. Allow to cool for 10 minutes,
    then turn out and cool on a rack.
  - Serve with a dollop of creme fraiche.
