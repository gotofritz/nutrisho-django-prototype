cuisine: .indian.maharashtra
description: Gobhi Tamatar Sabji
directions:
  step:
  - Make a cross cut at the bottom of the tomatoes, soak in boiling water a couple
    of minutes, then rinse in fresh water and peel. Cut into eights
  - Melt the ghee or oil / butter mixture over medium high heat. Fry the grated ginger,
    chopped chilies, cumin seeds, mustard seeds until the mustard seeds begin to pop.
  - Stir in cauliflower, ground coriander, turmeric, salt and stir a coupe of minutes
  - Add the tomatoes, lower heat and cook with a tight fitting lid for 15 - 20 mins,
    shaking the pan occasionally. The moisture in the tomatoes should be enough to
    cook the cauliflowers.
  - Remove the lid and increase the heat. Toss the cauliflower over high heat for
    a minute or so. Sprinkle garam masala and chopped herbs, and serve
