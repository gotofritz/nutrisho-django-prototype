directions:
  '#text': '>










    >'
  step:
  - Stir fry broccoli for 20 s
  - Add water and salt, cover, cook 2m
  - Uncover and remove broccoli
  - Keep 125 ml water and mix with soy sauce and cornstarch
  - Beat egg whites
  - Heat oil in wok and thicken sauce 1m
  - Remove wok from fire
  - Strain egg whites through sieve high above wok, to create ribbons. Don't move
    for 30 s
  - Season, pour over broccoli, and serve
