directions:
    step:
    - Take the 10 sprigs of tarragon and lay them on a chopping board. Take a large
        knife and lay it flat on its side on top of your tarragon and hit the blade
        gently with your fist several times to bruise the tarragon underneath.
    - You'll know you are doing it right if you can smell the tarragon strongly after
        hitting it - bruising breaks some of the cell fibres in the tarragon allowing
        it to release its oils better into your sugar syrup.
    - Make the tarragon syrup by placing the water, sugar and tarragon in a pot. Bring
        the mixture to a boil, whisking occasionally to dissolve the sugar. Reduce
        to a simmer and cook for about 25 minutes until the mixture is reduced and
        slightly thickened. Set aside and allow to cool, then strain into a jug and
        set aside.
    - Place the lemon juice and water in a large pitcher with and stir in the tarragon
        syrup to taste. Add lots of ice and a few sprigs of tarragon to garnish.
