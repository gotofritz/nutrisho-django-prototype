cuisine: .korean
description: This traditional Korean porridge is a delicious and fun way to use up
    those pumpkins and squashes that are appearing in abundance in many people's vegetable
    box schemes. Known in Korean as 'hobakjuk', this porridge is a little like a Chinese
    congee and contains tiny rice flour dumplings that are fun and easy to make. I
    prefer to make this porridge on the salty side, but if you prefer you can omit
    the mushrooms and sesame oil and add some sugar or honey and a little cinnamon
    instead. This porridge makes a great warming dinner while the wind howls outside
    and can also be served for breakfast.
directions:
    step:
    - Place the pumpkin or squash halves in a roasting dish and drizzle with the olive
        oil. Season generously with salt and pepper and cover the dish tightly with
        foil. Place in the oven and roast until the pumpkin is tender - this will
        take between 30 and 60 minutes depending on the variety of pumpkin you are
        using.
    - Allow the pumpkin to cool slightly, then scrape the flesh out using a spoon
        and place in a soup pot. Meanwhile soak the mushrooms in the boiling water
        for 15 minutes, then remove the mushrooms and finely chop. Add the mushrooms
        and the soaking liquid to the pumpkin and stir through with a wooden spoon
        or a potato masher until the pumpkin flesh is smooth.
    - Meanwhile, make the dumplings by placing the flour and salt in a bowl and stirring
        until mixed. Using a pair of chopsticks, stir in the boiling water and mix
        well. Knead the mixture in the bowl with your hands until it comes together
        as a firm dough. Wrap the dough in cling film and leave to rest for 10 minutes.
    - Place the dough back in the mixing bowl and add a splash of water if it feels
        dry and knead again until it feels smooth and slightly gelatinous in texture.
    - Grab cherry sized pieces of the dough and roll each one between your palms until
        you have a smooth round dumpling. Place the dumplings on a plate and continue
        until you have used up all the dough.
    - Bring the pumpkin porridge to a boil and add a little extra water if it seems
        too thick. Add the dumplings and cook them in the porridge for 10 minutes
        or until they are tender but still slightly chewy at the centre. Taste and
        season the porridge well with salt and pepper.
    - To serve, ladle the porridge into bowls and drizzle with a little sesame oil.
        Scatter the sesame seeds and pine nuts overtop and add a little extra salt
        and pepper overtop. Serve warm.
