directions:
  step:
  - Cook the noodles according to packet instructions, then drain and cool.
  - Drizzle with a dash of sesame oil and toss through to prevent the noodles from
    sticking to each other.
  - Place the chicken strips in a bowl and season with a dash of dark soy sauce, the
    five-spice powder and chilli sauce. Mix well, then lightly dust the chicken strips
    with the cornflour.
  - Stir fry chicken on high 3-4 minutes
  - Add the red pepper for 1 min, then bean sprouts and spring onion for 30 secs.
  - Stir in the cooked noodles, season with the light soy sauce, a dash of sesame
    oil and freshly ground black pepper.
  - Pile the noodles onto a serving plate and serve immediately.
