directions:
    step:
    - soak wheat berries for 8 days, changing water daily
    - Drain and cook for 15 mins, barely covered in water, then drain on low heat
    - Boil wheat in milk, cinnamon, lemon zest, pinch of salt on low heat until all
        liquid is absorbed, 2h
    - Discard the lemon zest and spread on a plate to cool
    - Mix ricotta, sugar, cinnamon powder, lemon zest, orange blossom water, candied
        peels in a bowl
    - Add the egg yolks one at the time, and add the wheat
    - Beat the egg whites to snowy peaks and add
    - Sieve the flour, dry yeast, then make a well
    - Add butter, egg yolks, sugar one at the time and mix, with cold hands as quickly
        as possible. Leave to raise for 30m
    - Roll out in two discs - one to line a 24cm baking tray, which you'll then fill
        with the filling, and from the other obtain 7 1cm strips which you'll criss
        cross on top
    - Bake 1.5 hours at 180°
