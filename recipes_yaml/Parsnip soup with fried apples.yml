cuisine: null
description: The sweetness of the fried apples combines wonderfully with the spicy
  parsnips in this easy soup. Serves four.
directions:
  step:
  - dry roast cumin and mustard seeds, 1 min, then grind and combine with the turmeric
    and garam masala.
  - Melt 25g butter and sauté onionsm about 10 minutes. Then add the ginger for one
    more minute.
  - Tip in the parsnips, sauté for another 5 minutes, then stir in the spices, ensuring
    everything is well coated, 1/2 mins
  - Pour over the stock, bring to a simmer, partially cover and cook until the parsnips
    are tender, about 20 minutes
  - Blitz in a food processor or with a stick blender until smooth
  - return to the pan and season with salt and pepper. If it's too thick, thin with
    a little more stock or water. Keep warm while you prepare the apples.
  - Melt the knob of butter in a frying pan over a medium-high heat until it starts
    to sizzle. Add the apple slices and sauté until they take on some colour. Ladle
    soup into warmed bowls and serve with apple slices on top.
