directions:
    step:
    - Grill the whole peppers in the oven at 180°/200°, until skins are charred (some
        10 mins or so)
    - Take out of the oven and put in a plastic bag, then tie it shut. The steam build
        up will help with peeling
    - Warm up the stock and keep in a pot on low fire
    - Sauté shallots in olive oil on high heat, 3m
    - Add rice, and keep stirring for about 1m
    - Add apple pieces, and sweat with white wine until evaporated, about 3m
    - When the mixture is dry and beginning to toast turn heat to medium and stir
        in a couple of ladefuls of stock and salt
    - 'From now on the cycle goes: when liquid is almost all absorbed stir rice vigorously
        for a few seconds; then stir in a small ladelful of stock, mix well and leave
        it to be absorbed. Repeat for roughly 20 mins'
    - Meanwhile peel the peppers under running water, and chop together with the other
        ingredients
    - When the rice is be soft but still chewy, turn off fire, add the chopped olives,
        peppers, coriander, olive oil and pepper. Stir in vigorously
    - Cover and stand a couple of minutes before serving
