cuisine: .italian.quick
description: A quick and easy version of the famous sauce
directions:
    step:
    - Sautè the chopped vegetables in olive oil and butter in the pressure cooker
        for a few minutes untile wilted
    - Add bacon and give it another couple of minutes
    - Add the mince, cook it until browned, stirringly costantly
    - Add the tomates. If it's not passata but cans, blend with the immersion blender
        first
    - Add the milk, salt and pepper, and close the pressure cooker
    - Close the pressure cooker and start heating the pasta water
    - By the time the pasta water has boiled and the pasta cooked, it should be ready.
        But it can cook for longer if need be
