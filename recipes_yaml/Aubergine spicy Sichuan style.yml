directions:
  step:
  - slice aubergines lengthways 2cm thick 4 cm long
  - deep fry in oil 3m
  - 'if using tofu: cut in 4cm sticks, optionaly roll in cornstarch, deep fry too'
  - chop garlic, ginger, slice chillies in rings
  - heat stock so it's warm
  - discard oil, except for 1 tbsp, then stir fry garlic, ginger, chilies a fes sc
  - add the chilli bean paste and aubergines and tofu if using
  - add host stock (5) and bring to boil; then heat down and 3m
  - add soy sauce, vinegar, sugar, few secs
  - add cornstarch to thicken sauce
  - garnish with chopped spring onion
