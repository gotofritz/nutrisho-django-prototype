description: WORK IN PROGRESS
directions:
  '#text': '>









    >'
  step:
  - "melt the butter in olive oil, saut\xE8 the onions in it for a few mintes"
  - when they begin to wilt add the blueberries, wine, star anise, and sugar, mashing
    up with a fork, and reduce
  - beat the eggs, add the other ingredients
  - when the fruity thing is ready, remove to fire for cooling, then add to egg mixture
  - meanwhile bring the water and oil to a boil, add the buckwheat, lower heat and
    cover
  - when the buckwheat is ready, fluff up with a fork, then set aside to cool
  - when cool, add to the egg mixture
  - heat some oil, when very hot pour the egg mixture in and make the omelet
