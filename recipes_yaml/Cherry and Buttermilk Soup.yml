directions:
  step:
  - Place the cherries in a pot with the cinnamon bark and water. Bring the cherries
    to a simmer and cook them for 5 minutes or until they are soft and starting to
    fall apart. Remove from the heat and set aside to cool completely.
  - Remove the cinnamon bark and discard. Place the cooked cherry mixture in a blender
    or food processor and puree until smooth. Tip the mixture into a bowl and whisk
    in the 300 mls of cold buttermilk.
  - Place the mixture in the fridge and chill well.
  - Ladle the soup into 4 bowls and top each with a small dollop of creme fraiche.
    Serve immediately.
