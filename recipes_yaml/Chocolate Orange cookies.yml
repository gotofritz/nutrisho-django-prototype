description: It might be worth buying an extra Chocolate Orange to use for this particularly
    Christmassy recipe, as Xanthe says that in her experience people tend to be rather
    territorial with theirs during the festive season. The cookies in these photos
    have spread a bit, giving them a square appearance - in this case it was because
    the butter was softer than usual.
