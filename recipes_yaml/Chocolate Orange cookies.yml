cuisine: null
description: It might be worth buying an extra Chocolate Orange to use for this particularly
  Christmassy recipe, as Xanthe says that in her experience people tend to be rather
  territorial with theirs during the festive season. The cookies in these photos have
  spread a bit, giving them a square appearance - in this case it was because the
  butter was softer than usual.
directions:
  '#text': '>'
  step: Preheat the oven to 180C/gas mark 4. Mix the flour, cocoa powder, bicarbonate
    of soda and salt in a small bowl. In a large bowl, cream the butter and sugars
    together, add the eggs and vanilla extract; fold in flour mixture. Take spoonfuls
    of it, push a segment of Chocolate Orange into each, roll in a ball and place
    each one 2 inches apart on an un-greased baking sheet; bake for 10-12 minutes.
