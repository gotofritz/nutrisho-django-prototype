directions:
  step:
  - Caramelize the sugar in a heavy pan on medium. While doing that lightly brush
    water over on the pan's walls above the sugar level, to keep it moist. Tilt the
    pan instead of stirring
  - Add the vanilla pods cut in half, and their seeds, scraped out, and the ginger.
  - Add water slowly and stir
  - Bring back to boil, then add the rum and remove from heat.
