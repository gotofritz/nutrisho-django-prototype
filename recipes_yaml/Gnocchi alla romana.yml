directions:
  '#text': '>







    >'
  step:
  - Put the milk, butter, nutmeg in a large pot, season with salt, and bring to boil
    on low fire
  - Slowly add the semolina, stirring vigorously to avoid lumps, then cook slowly
    for 10m
  - Away from the fire mix in the egg yolks, parmesan cheese, butter. Spread mixture
    over greaseproof paper, put another sheet on top, and gently roll the mixture
    to 1 cm thickness
  - Cool in the fridge for 30m
  - Grease a baking dish, use a glass to cut disks from the mixture, place the disks
    in the baking dish slightly overlapping.
  - "Scatter the fontina cheese, parmesan over the gnocchi and and bake at 200\xB0\
    \ for 20m"
