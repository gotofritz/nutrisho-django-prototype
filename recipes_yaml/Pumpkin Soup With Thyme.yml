directions:
    step:
    - 'Oven: 200°'
    - Mix olive oil, thyme and chilli in a bowl and rub all over pumpkin, including
        peel
    - Put pumpkin halves in oven face down, roast half an hour or so, then turn
    - Sauté onions and leeks in butter, slowly, for at least 20 mins
    - Take pumpkin out of oven, scoop out flesh and add to onions
    - Add stock, salt and pepper, and remaining ingredients. Bring to boil and simmer
        10 mins
    - Pour into food processor. Add lemon
    - Melt butter until brown; add thyme then add to food processor
    - Sieve and serve
