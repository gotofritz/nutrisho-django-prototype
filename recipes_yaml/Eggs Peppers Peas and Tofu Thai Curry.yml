directions:
    step:
    - Soak tamarind in boiling water for half an hour or so
    - Make curry paste by putting all ingredients one by one in mortar, or food processor
    - Deep fry the tofu, drain on paper towels
    - If you are cooking rice, steam the eggs over it. Otherwise just hard boil normally.
    - Reduce coconut cream, 5 or 6 mins stirring regularly, then add 3 tbsp curry
        paste, 7 mins or so.
    - Add the palm sugar, a few minutes until darkened, and the sieved tamarind water
        and fish sauce / fermented beans, a few more minutes
    - In another pan mix a bit of the coconut milk with the oil. When hot fry the
        peppers in it for 5 mins or so.
    - Pour the peppers and reduced coconut milk into the cream sauce with the peas,
        tofu, kaffir lime leaves, and soya sauce. Cook 10 minutes until done.
