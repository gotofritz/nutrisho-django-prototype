cuisine: .fusion.british
description: Serve with bread for a light lunch
directions:
    step:
    - Mix the yogurt dressing ingredients in a bowl
    - Char the cherry tomatoes still on the vine fror 4 mins on a hot pan
    - Cook the potato ingredients for 20 mins in oil, stirring occasionally.
    - Stir in the sugar and garlic and season.
    - Spread the mixture to cover the pan, and crack the eggs in, without breaking
        the yolk. Cook for 3 mins
    - Drizzle the tahini over the egg whites, cover, and cook 2 more minutes
    - Pour the yogurt dressing over the mixture, avoiding the yolks, and sprinkle
        coriander
    - Put the tomatoes over, and drizzle some oil
