directions:
  step:
  - text: Mix marinade in a bowl, toss pumpkin in, arrange on a tray and bake at 200°
      for 15 mins
    title: Pumpkin
  - text: use a light stock, or make one yourself by simply simmering the stock ingredients
      for half an hour
    title: Stock
  - Either way keep it in a pot on low fire
  - text: Sauté shallots and leeks in olive oil / butter mixture on high heat, 3m
    title: Risotto
  - Add sausage, broken with a fork; alternatively, pancetta
  - Add rosemary and rice, and keep stirring for about 1m
  - Sweat with white wine until evaporated, about 3m
  - When the mixture is dry and beginning to toast turn heat to medium and stir in
    a couple of ladefuls of stock, miso paste and salt
  - 'From now on the cycle goes: when liquid is almost all absorbed stir rice vigorously
    for a few seconds; then stir in a small ladelful of stock, mix well and leave
    it to be absorbed. Repeat for roughly 20 mins'
  - 10 minutes in, add the pumpkin
  - When the rice is be soft but still chewy, turn off fire, add butter and stir in
    vigorously
  - Cover and stand a couple of minutes before serving
