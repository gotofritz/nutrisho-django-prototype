directions:
  step:
  - Soak the chickpeas overnight, then cook 10 mins vigorously and 40 on medium, or
    in a pressure cooker
  - Soak the tamarind in 140 ml of the chickpea water, then sieve forcing as much
    of the tamarind flesh through as you can
  - Sauté the onion for 4 mins, then add the garlic, ginger and chilli, for 3 mins
  - Add the spices for another 2 mins
  - Add the tomatoes and coriander stalks and cook vigorously until dark
  - Mix the drained chickpeas with the tamarind liquid and the tomatoes, then cover
    with some of the reserved liquid and cook on medium for 30 mins
  - Serve garnished with coriander leaves
