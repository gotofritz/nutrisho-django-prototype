cuisine: .europe.germany
description: Please pronounce it with a Schwäbisch accent
directions:
  step:
    - Cook the lentils in water with an onion according to the packet's instructions (typically 20-40min)
    - Drain the lentils but keep the water. Discard the onion
    - In a new pot, heat the oil on medium heat.
    - Add the flour at once, and keep stirring until it gets a bit brown and more dense, 4-5 mins
    - Add the lentil water, and mix well
    - Add the seasonings, mix well
    - Add add the lentils and cook until the liquid is quite dense
    - Meanwhile warm up the spätzle in a pan with some butter
    - "Optional: warm up some wurst"
    - Serve spätzle with lentils and wurst
