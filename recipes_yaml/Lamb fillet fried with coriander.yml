cuisine: .chinese.beijing
description: Qingsun Xiangcai Yangrou
directions:
    step:
    - combine meat and marinade in a bowl, at least 20m
    - stir fry garlic 10s, then remove
    - stir fry lamb, 1.5 m, then add bamboo shots, spring onions, garlic, 30 s
    - add soy sauce, after it sizzles add cornstarch mixture, 30 s
    - season with salt, pepper, chopped coriander
