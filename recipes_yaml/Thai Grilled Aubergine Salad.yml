cuisine: .thai
description: This is a very typical Thai salad known as 'laap' which is a finely chopped
  salad usually made with chicken or pork. It is also delicious made with grilled
  aubergines which are perfect for soaking up the sour and salty dressing. Long Chinese
  aubergines are perfect for this, but the larger Mediterranean aubergines will also
  work fine. You just need to slice them into rounds before grilling.
directions:
  step:
  - Preheat a barbecue or your oven grill. Prick the aubergines all over with a fork
    and place them on a grill tray in the oven about 5 inches from the heat. Alternatively
    place them on your barbecue. Turn the aubergines over occasionally and grill until
    they are well softened and browned, approximately 10-15 minutes. Set aside to
    cool slightly.
  - Meanwhile, place the rice in a wok or dry frying pan over medium heat. Toast the
    rice until golden, then grind in a good processor or a mortar and pestle until
    coarse.
  - Slice the aubergines in half and scrape out the flesh, discarding the charred
    skins. Place the aubergine pulp in a bowl and mash lightly with a fork. Stir in
    the remaining ingredients except for the toasted, ground rice and mix well. Sprinkle
    with the ground rice and serve.
