directions:
  step:
  - Sautè garlic in olive oil, then add fennel seeds powder and fennel slices.
  - Season and add cover. Cook on low for 20 mins
  - Sautè chopped onions in olive oil
  - When translucent add rice and stir a few minutes. Sweat with wine.
  - When evaporated add first ladle of broth. Keep stirring and adding broth as needed.
  - After 10 minutes add the fennel. Carry on cooking until end, ladeling broth and
    stirring
  - Mix in the butter, cheese, lemon zest and juice, stir in vigorously and let rest
    covered a few minutes
  - Serve with a dusting of chilli powder and fennel tops, with grated parmesan on
    the side
