directions:
    step:
    - mix all the marinade ingredients, then mix in the lamb, (2) leave overnight
        in fridge
    - stir fry the onion 3 mins, in mixed oils, then remove (4) stir fry marinated
        lamb, 1m, then remove (5) add stock, cornstartch mix to empty wok, 1m (6)
        add lamb and onions back in, then pepper (7) serve with sesame seeds and chili
        on top
