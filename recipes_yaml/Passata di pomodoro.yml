directions:
    step:
    - sautè the onions at medium high temperature until well wilted
    - add the tomatoes and cook for a minute or so
    - add the peeled tomatoes, pour some water in the tin to wash it and add the tomatoey
        water to the pot too
    - add all the other ingredients, and cook on medium fire for 40m / 1 hour .
    - pass through a food mill
