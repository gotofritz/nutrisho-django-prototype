directions:
  step:
  - blanch the spinach, then cool and dry, squuezing out excess water, and chop corasely
  - crush the spices
  - melt the ghee, fry the chillies, ginger and crushed spices (2) for a few mins
  - add the spinach for a few minutes, and salt
  - 'prepare the chaunk: melt the ghee, fry the cashew nuts, then add currants until
    plump, then remove from fire and add garam masale'
  - mix with cooked spinach (4) and add lemon juice
