cuisine: .chinese.modern
description: Chao Tu-dou Si
directions:
    step:
    - Wash the potatoes under running water to remove excess starch
    - Sauté the spring onion on high for a few secs, then add the sichuan pepper stirring
        briskly, then the potatoes
    - Season with salt and toss for a couple of minutes
    - Add the vinegar and oil
    - Serve hot
