cuisine: .indian.bengal
description: Bandhgobhi Mong Tarkaru
directions:
    step:
    - soak the beans in water with bicarbonate at least 4 hours
    - discard the water, boil for 1 hour until teneder
    - sautè the chillies, ginger and seeds in ghee
    - when browned add the assofoetida and curry leaves then a few seconds later add
        the cabbage
    - add the spices and salt, cook 20 mins - your choice whether you want them cruncy
        or well done
    - when the cabbage are cooked add the bans, lemon and molasses
