cuisine: .indian
description: Baigan Moong Dal
directions:
    step:
    - sort the dal but do not wash it. dry roast it until reddish, then wash
    - add to water and half the ghee, bring to boil, skimming
    - when you got rid of most of the scum, add ginger and lower heat, cover, let
        run for 40 m
    - make a paste and rub it on the aubergines, and set aside,
    - melt the ghee, then fry the seeds, chillies,
    - when ready add the assafoetida and then the aubergines straight after
    - fry for 7 minutes
    - add the fried eggplant to the dal, so that by the time they are soft the dal
        is ready
    - beat with a whisk, add the serving ingrediens
