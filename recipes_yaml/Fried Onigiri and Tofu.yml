cuisine: .japanese
description: Onigiri are classic bento box fodder of rice triangles, here they are
  fried with negimiso. The same applied to tofu. They are two separate snacks, don't
  eat together.
directions:
  step:
  - 'NEGIMISO YAKI ONIGIRI (fried rice triangles): cook the rice in a rice cooker.'
  - Sprinkle your hand with salt and form into a triangle while still hot. They freeze
    weell
  - Smear negimiso onto one side of triangle.
  - Put the onigiri negimiso side down on the pan, and cook a few seconds
  - Place on a nori square, shiny side of nori down, and fold the corners to wrap
    the triangle. The nori should stick to the rice.
  - NEGIMISO YAKI DOFU (fried tofu)
  - Cut the tofu into bite size square slices, and dry roast both sides until you
    can see some charring.
  - Spread negimiso on one side, and dry fry on the negimiso side for a few of seconds
  - Eat with plain rice
