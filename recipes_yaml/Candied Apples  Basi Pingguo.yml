cuisine: .chinese
description: At least 1500 years old
directions:
    step:
    - Cute apples in 1cm wedges, then soak in slightly salted water for 10m. Pat dry
        and leave on a tray.
    - Make batter by beating eagg, adding flour, then corn starch and water
    - dip apple into batter, deep fry 1.5m then set aside
    - Make toffee by melting sugar with ol, adding water carefully, then mixing in
        apple
    - Serve with a bowl of iced water - people dip them in to solidify toffee
