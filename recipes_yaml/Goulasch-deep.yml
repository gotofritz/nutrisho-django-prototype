cuisine: .hungary
description: Hungarian-American version, doesn't really work in pressure cooker as
  meats get stuck
directions:
  step:
  - Put onion and fat together in large pot, cook on medium until translucent
  - Add carrots, water, red pepper and cook until liquid is reduced, 10 mins
  - Meanwhile mix the dry flour ingredients in a large bowl and swirl the meat pieces
    in it to coat them. Keep excess flour
  - When liquid in onion mixture is evaporated and veg are beginning to fry, turn
    up heat, and start adding meat a bit at the time, stirring
  - Lower heat and leave 5 mins
  - Add water, scrape bottom of pan, and cook 1.5h
  - Prepare a slurry by mixing the excess flour with a bit of water
  - Add the slurry, tomato, water, parsely and bay leaf tied together, potato, to
    the stew and cook another 30 mins
  - Before serving warm up the butter and add paprika, stir a bit and add to soup
