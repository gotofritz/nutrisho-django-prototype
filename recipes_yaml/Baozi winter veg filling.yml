cuisine: .chinese.beijing
description: A combination of winter vegetables suitable for filling baozis, or eaten
  on their own
directions:
  step:
  - Soak the dried ingredients for an hour, then remove all lumps from wood ears,
    hard end of lily flowers, and mushrooms stems. Chop the mushrooms finely
  - Beat the egg with half the spring onion and salt, then cook in very hot oil breaking
    up to make a plain omelette. Set aside and cut into ribbons
  - Sauté the remaining spring onion, soaked veg and other chopped vegetables, and
    season with salt.
  - 'Add eggs and still stirring: soy sauce, sugar, rice wine, garlic, sesame seed
    oil.'
