directions:
    step:
    - Cook the potatoes - either boiled in abundant salty water then drained, or steamed
        in pressure cooker
    - Mash with potato ricer, add butter, and season
    - Blanch the fish fillets 5 to 6 mins, dry, and let cool 10 mins
    - Break into flakes and mix into the mashed potato
    - Form into 4 fish cakes
    - Dust the fish cakes in flour, then dip into a beaten egg, then breadcrumbs
    - Refrigerate for 20 mins at least to firm up. Can be kept in fridge up to 24
        hours
    - Put in baking tray lined with baking paper, drizzle with olive oil, and bake
        20 mins at 200°. Turn after 10 mins.
