cuisine: .middle east
description: 'To really appreciate this soup allow it to soak into the flatbreads
  for a few minutes before eating.


  For this recipe a beautiful Arabian spice mixture called baharat is made by grinding
  up spices and rosepetals and then adding them to a soup.'
directions:
  step:
  - dry roast and grind black peppercorns, cardamom, cumin seeds, coriander seeds,
    cloves, cinnamon medium low
  - add nutmeg, ground ginger, dried rose petals
  - "saut\xE9 garlic, onions, potatoes, squash medium for 5m"
  - add spice mix for 4m
  - add and simmer chicken stock, chicken legs, lemon until tender, about 45m
  - pour over bread slices
