cuisine: .indian.punjab
description: Indian classic
directions:
    step:
    - CHOLA (chickpeas). Lightly roast masala seeds. When they are fragrant add the
        powder a few seconds
    - Cool down, then grind. Can be stored 3-4 months in fridge
    - Pressure cook the chickpeas for 45 minutes with the spices and salt. When cooked
        keep the water
    - Sauté seeds, add ginger, shortly after assafoetida and 2 secs later onions.
        Cook a few minutes
    - Add the tomates and cook until the liquid has evaporated
    - Add 2 tsp of the spice mix. Stir in well then ad a bit of water and dry it out.
        Add water again and dry it out again
    - Add in the chickpeas. Stir vigorously
    - Add amchoor and garam masala, mix, and add in enough cooking water to just cover
        chickpeas. Reduce
    - KULCHA (patties). Make a dough with all the ingredients and let it rest covered
        for 2 hours
    - Mix the stuffing ingredients well, add salt
    - Divide into small balls, flatten them wide and put a spoonful of stuffin in
        the middle. Fold doug over stuffing
    - Sautè briefly then bake 20 mins or so
