cuisine: .italian
description: You can use spelt, emmer, korn, kamut, etc
directions:
  '#text': '>






    >'
  step:
  - drain farro, cook covered in stock, on medium heat, for 45m
  - saute garlic, carrots, pancetta in olive oil, on medium high heat, until soft,
    about 8m
  - add sage, tomatoes, dried porcini, and simmer, diluting with stock as necessary,
    for 15m
  - Blend the tomato mixture in food processor, and add to farro. Keep cooking for
    10m
  - Serve garnished with chopped parsley and olive oil
