directions:
  step:
  - Pressure cook dal 8 mins with yam, peanuts, dates
  - Remove potato, add salt and whisk well
  - Dice potato
  - Fry the spices in ghee until the mustard seeds pop, 3/4 mins
  - Add the veg and simmer 10 mins
  - Mix with cooked dal and potato, simmer another 10 mins
  - Serve with chopped coriander
