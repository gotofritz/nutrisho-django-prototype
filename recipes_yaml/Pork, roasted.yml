  step:
  - cut pork in half and then into long, carrot-like strips
  - mix marinade ingredienst in bowl and dip meat in it
  - stand from 2 hrs to overnight, mixing a couple of times
  - "prepare a rack for the portk, and a drip tray below it with 250 ml water in a\
    \ 200\xB0C over"
  - 'put pork on top rack, roast 12 m, turn, then another 5 m or until surface is
    charred around edges and slightly pink inside

    (6a) rest 6 mins then slice as required

    (6b) alternatively, let cool, wrap in greaseproof paper and store in fridge up
    to 4 days'
