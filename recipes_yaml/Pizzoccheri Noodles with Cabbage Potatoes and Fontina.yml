cuisine: .italian
description: Pizzoccheri are a flat, wide pasta that are traditionally made in the
  Valtellina region of Northern Italy and in parts of Switzerland. The pasta is made
  with a mixture of buckwheat flour and white flour and have a lovely nutty flavour.
directions:
  step:
  - To make the dough, place the flours and salt in a large mixing bowl and stir until
    well blended. Make a well in the centre and crack the eggs into the well and add
    the milk. With a fork, whisk the eggs and milk together in the centre of the flour
    and then little by little, incorporate the flour into the eggs until eventually
    you have mixed in all the flour and a soft paste-like dough develops.
  - Turn the dough out onto a lightly floured worksurface and knead the dough for
    8 minutes, adding a sprinkling of flour as necessary while kneading until the
    dough is smooth. To check if the dough is dry enough - insert your finger into
    the centre of the dough. It should feel just moist and not at all sticky.
  - Wrap the dough in cling film and set aside at room temperature to rest for 20
    minutes. Roll out the dough onto a table or worksurface into a thin sheet approximately
    an inch thick and allow it to dry for about 10 minutes. After the dough has been
    allowed to dry, stretch the dough by pulling it in opposite directions with your
    hands. You should be able to stretch the dough to an extra 30 percent of its initial
    size.
  - Using a sharp knife or a pizza wheel, cut the dough into long strips and lay the
    pizzocheri on clean, dry tea towels until you are ready to cook them.
  - Bring a large pot of water to the boil and add the salt and the potatoes. Return
    the water to the boil and cook the potatoes for 3 minutes and add the cabbage
    and the noodles. Cook for a further 3 minutes or until the noodles are tender.
    Drain and set aside.
  - Warm the butter and olive oil in a wide, saute pan over medium heat. Add the garlic
    and sage and saute for 30 seconds, then add the drained pasta, cabbage and potatoes
    and toss gently over the heat.
  - Add the cheeses and toss over the heat just until the cheese begins to soften.
    Season the mixture generously with salt and pepper and serve hot.
