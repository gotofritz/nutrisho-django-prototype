directions:
    step:
    - mix in food processor, sieve, and put in fridge to rest banana, veg stock, banana
        liquor
    - bake in oven aubergine 200° for 40m
    - cut the aubergines into spears and toss with the garlic, mint, olive oil
    - cook fettuccine as per normal, then toss in a little chopped mint and garlic
    - pour the banana sauce in the bottom of the plate, place the aubergines on top
        and the fettuccine rolled up as nests next to it.
