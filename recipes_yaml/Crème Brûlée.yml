directions:
    step:
    - Mix cream and honey in a pot, add any flavourings you may like (tea, cardamom,
        vanilla, lemon peel, pandan leaves...) and bring to boil on medium-lo heat.
    - 'If using vanilla pod: cut in half lengthways, scrape seeds with knife. Add
        both scraped seed and pods to cream.'
    - Meanwhile, beat yolks and sugar with a whisk until well mixed
    - When the cream is just beginning to boil, remove from fire.
    - Add a spoonful of cream to egg mixture, beat. Add another, then more and more
        until you have added it all. At the beginning add very little otherwise you'll
        get scrambled eggs; when you have added half or so you can add bigger amounts.
        It's ok if the extra ingredients in the cream fall into the egg mixture
    - Sieve the mixture into a pouring jug
    - Put five ramekins onto a roasting tray. Split any optional fillings (soaked
        raisins, cherries...) among the ramekins, then pour the egg mixture into them
    - Pour warm water in a roasting tray, enough to surround the ramekins without
        getting into them
    - Bake 40 mins at 150°, then cool and chill
    - Before serving, scatter sugar over the top and blow torch it
