cuisine: Middle Eastern
description: Baba ganoush - also known as baba ganouj, muttabal, or salat hatzilim
  - is a smoky, rich, and creamy eggplant dip, traditionally made by mixing tender
  roasted (or charred) eggplant and nutty tahini with garlic, citrus, and spices.
directions:
  step:
  - Put the aubergine directly over hotplate for 20 mins, turning every 5, until tender
    and the skin is charred and crispy on all sides
  - Remove from fire and sit in a colander until cold enough to touch, then peel
  - Drain well, then transfer to a mixing bowl. Add remaining ingredients and mash
    thoroughly with a fork until well combined
  - Cover the baba ganoush and chill in the fridge for 30 minutes to an hour.
  - To serve, drizzle with oil and sprinkle toasted pine nuts,
  - Serve with pita wedges and veggies
